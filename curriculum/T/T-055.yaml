    type: generated
    count: 3
    prompt: {en: "Minor to its relative major: i – iv – V7/III – III (V7/III is VII7 of the natural minor).", sr: "Mol u paralelni dur: i – iv – V7/III – III (V7/III je VII7 prirodnog mola)."}
