id: T-048
track: T
order: 48
prereqs: [T-047]
title: {en: "Harmonic rhythm", sr: "Harmonski ritam"}
minutes: 11
tags: [harmony, rhythm]
explain:
  en: |
    **Harmonic rhythm** (harmonski ritam) is the rhythm of the *chord changes*, not of the melody. A melody can run in eighth notes over one chord per bar; a hymn can change chord on every quarter note. How often the harmony moves is one of the main things that sets the pace of a piece.

    Three habits of tonal music:
    1. **Changes on strong beats.** A new chord usually arrives on the downbeat (or on beat 3 in 4/4). A chord that enters on a weak beat and is held over the bar line sounds syncopated, which is fine in pop and jazz but feels like a stumble in a chorale.
    2. **It speeds up toward the cadence.** A typical phrase: one chord per bar, then two per bar in the last bars (ii – V), then a long tonic. The acceleration is part of what tells you "the end is coming".
    3. **The cadence lands on a strong beat.** The final I (and the I64 of a cadential 6/4) sits on a downbeat; V comes on the weaker beat before it.

    ```abc
    X:1
    M:4/4
    L:1/4
    K:C
    "C"E G c G | "F"A c A F | "C"G E C E | "Dm"F2 "G"D2 | "C"C4 |]
    ```

    One chord per bar for three bars, then two chords in bar 4 (ii – V), then the tonic held for a whole bar.

    When you harmonize a melody, decide the harmonic rhythm **first** (one chord per bar? per half bar?), then choose chords to fit it.
  sr: |
    **Harmonski ritam** je ritam *promena akorada*, ne ritam melodije. Melodija može da teče u osminama nad jednim akordom po taktu; crkvena pesma može da menja akord na svakoj četvrtini. Koliko se često harmonija menja jedna je od glavnih stvari koje određuju tempo kompozicije.

    Tri navike tonalne muzike:
    1. **Promene na jakim dobama.** Novi akord obično stiže na prvu dobu (ili na 3. dobu u 4/4). Akord koji nastupa na slaboj dobi i traje preko taktne crte zvuči sinkopirano, što je u redu u popu i džezu, ali u koralu zvuči kao spoticanje.
    2. **Ubrzava se pred kadencu.** Tipična fraza: jedan akord po taktu, zatim dva po taktu u poslednjim taktovima (ii – V), pa duga tonika. To ubrzanje je deo onoga što nam govori „kraj dolazi".
    3. **Kadenca pada na jaku dobu.** Završni I (i I64 kadencirajućeg kvartsekstakorda) je na prvoj dobi; V dolazi na slabiju dobu pre toga.

    ```abc
    X:1
    M:4/4
    L:1/4
    K:C
    "C"E G c G | "F"A c A F | "C"G E C E | "Dm"F2 "G"D2 | "C"C4 |]
    ```

    Jedan akord po taktu tri takta, zatim dva akorda u 4. taktu (ii – V), pa tonika ceo takt.

    Kad harmonizuješ melodiju, **prvo** odluči harmonski ritam (jedan akord po taktu? po pola takta?), pa onda biraj akorde koji mu odgovaraju.
exercises:
  - id: T-048-1
    type: mcq
    prompt: {en: "Harmonic rhythm is…", sr: "Harmonski ritam je…"}
    options:
      - {en: "the rhythm of the chord changes", sr: "ritam promena akorada"}
      - {en: "the rhythm of the melody", sr: "ritam melodije"}
      - {en: "the tempo marking", sr: "oznaka tempa"}
      - {en: "the rhythm of the bass line only", sr: "ritam samo basove linije"}
    answer: 0
  - id: T-048-2
    type: mcq
    prompt: {en: "In the example above, where does the harmonic rhythm speed up?", sr: "U primeru iznad, gde se harmonski ritam ubrzava?"}
    abc: |
      X:1
      M:4/4
      L:1/4
      K:C
      "C"E G c G | "F"A c A F | "C"G E C E | "Dm"F2 "G"D2 | "C"C4 |]
    options:
      - {en: "Bar 4: two chords instead of one", sr: "4. takt: dva akorda umesto jednog"}
      - {en: "Bar 1: the melody moves in quarter notes", sr: "1. takt: melodija ide u četvrtinama"}
      - {en: "Bar 5: the last chord", sr: "5. takt: poslednji akord"}
      - {en: "It never changes", sr: "Nigde se ne menja"}
    answer: 0
    checks:
      - chord: {notes: [D4, F4, A4], root: D, quality: min}
      - chord: {notes: [G3, B3, D4], root: G, quality: maj}
  - id: T-048-3
    type: mcq
    prompt: {en: "Listen: how does the harmonic rhythm behave?", sr: "Slušaj: kako se ponaša harmonski ritam?"}
    play: {chords: [[C3, E4, G4, C5], [F3, F4, A4, C5], [D3, F4, A4, D5], [G3, D4, G4, B4], [C3, E4, G4, C5]], durations: [4, 4, 2, 2, 4], tempo: 90}
    options:
      - {en: "Steady at first, then faster before the cadence", sr: "U početku ravnomeran, zatim brži pred kadencu"}
      - {en: "Perfectly steady, one chord every bar", sr: "Potpuno ravnomeran, jedan akord u svakom taktu"}
      - {en: "Fast at first, then slower", sr: "U početku brz, zatim sporiji"}
    answer: 0
    keepOrder: true
    checks:
      - chord: {notes: [D3, F4, A4, D5], root: D, quality: min}
      - chord: {notes: [G3, D4, G4, B4], root: G, quality: maj}
  - id: T-048-4
    type: midi-play
    prompt: {en: "Play the bass of I – IV – ii – V – I in its harmonic rhythm: C (whole bar), F (whole bar), D and G (half bar each), C (whole bar). ♩ = 80.", sr: "Odsviraj bas progresije I – IV – ii – V – I u njenom harmonskom ritmu: C (ceo takt), F (ceo takt), D i G (po pola takta), C (ceo takt). ♩ = 80."}
    mode: sequence
    octave: exact
    expect: [C3, F3, D3, G3, C3]
    beats: [4, 4, 2, 2, 4]
    tempo: 80
    checks:
      - roman: {key: C, type: major, degree: 2, is: ii}
  - id: T-048-5
    type: mcq
    prompt: {en: "In a chorale in 4/4, which chord change sounds weakest (syncopated)?", sr: "U koralu u 4/4, koja promena akorda zvuči najslabije (sinkopirano)?"}
    options:
      - {en: "A chord that enters on beat 4 and is held over the bar line", sr: "Akord koji nastupa na 4. dobi i traje preko taktne crte"}
      - {en: "A chord that enters on beat 1", sr: "Akord koji nastupa na 1. dobi"}
      - {en: "A chord that enters on beat 3", sr: "Akord koji nastupa na 3. dobi"}
    answer: 0
  - id: T-048-6
    type: mcq
    prompt: {en: "A cadential I64 – V – I in 3/4. Which placement is standard?", sr: "Kadencirajući I64 – V – I u 3/4. Koji raspored je uobičajen?"}
    options:
      - {en: "I64 on beat 1, V on beat 2 or 3, I on the next downbeat", sr: "I64 na 1. dobi, V na 2. ili 3. dobi, I na sledećoj prvoj dobi"}
      - {en: "I64 on beat 3, V on the next downbeat, I on beat 2", sr: "I64 na 3. dobi, V na sledećoj prvoj dobi, I na 2. dobi"}
      - {en: "All three on weak beats", sr: "Sva tri na slabim dobama"}
    answer: 0
