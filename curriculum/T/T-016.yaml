id: T-016
track: T
order: 16
prereqs: [T-015]
title: {en: "Simple meters: 2/4, 3/4, 4/4; beat and subdivision", sr: "Proste mere: 2/4, 3/4, 4/4; doba i podela dobe"}
minutes: 12
tags: [rhythm]
explain:
  en: |
    **Meter** is how beats are grouped into bars, strong to weak. The time signature says it in two numbers:
    the **top** is how many beats per bar, the **bottom** which note value is one beat (4 = quarter, 8 = eighth, 2 = half).

    In a **simple meter** each beat divides into **two** (a quarter into two eighths). The three you will meet most:

    | meter | beats | accent pattern | typical |
    |---|---|---|---|
    | 2/4 | 2 | **strong**–weak | march, polka |
    | 3/4 | 3 | **strong**–weak–weak | waltz, minuet |
    | 4/4 | 4 | **strong**–weak–*medium*–weak | most pop, rock, hymns |

    Why it matters: the strong beats are where harmony changes and where a melody puts its important (chord) notes. When you improvise or compose, beat 1 is your anchor.
    At the piano, count the subdivision aloud ("1 and 2 and") when a rhythm mixes quarters and eighths; that is what keeps the eighths even.

    ```abc
    X:1
    L:1/8
    M:2/4
    K:C clef=perc
    !>!B2 B2 | !>!BB B2 || [M:3/4] !>!B2 B2 B2 | !>!B4 B2 || [M:4/4] !>!B2 B2 B2 B2 | !>!B2 BB B2 B2 |]
    ```
  sr: |
    **Mera** (taktovska mera) je način na koji se dobe grupišu u takt, od naglašene ka nenaglašenoj. Oznaka mere to kaže s dva broja:
    **gornji** je broj doba u taktu, **donji** je nota koja traje jednu dobu (4 = četvrtina, 8 = osmina, 2 = polovina).

    U **prostoj meri** svaka doba se deli na **dva** (četvrtina na dve osmine). Tri najčešće:

    | mera | dobe | naglasci | tipično |
    |---|---|---|---|
    | 2/4 | 2 | **teška** (jaka)–laka (slaba) | marš, polka |
    | 3/4 | 3 | **teška**–laka–laka | valcer, menuet |
    | 4/4 | 4 | **teška**–laka–*poluteška*–laka | većina popa, roka, himni |

    Zašto je važno: na jakim dobama se menja harmonija i tu melodija stavlja važne (akordske) tonove. Kad improvizuješ ili komponuješ, prva doba je tvoje sidro.
    Za klavirom broj podelu naglas („1 i 2 i") kad se mešaju četvrtine i osmine; tako osmine ostaju ujednačene.

    ```abc
    X:1
    L:1/8
    M:2/4
    K:C clef=perc
    !>!B2 B2 | !>!BB B2 || [M:3/4] !>!B2 B2 B2 | !>!B4 B2 || [M:4/4] !>!B2 B2 B2 B2 | !>!B2 BB B2 B2 |]
    ```
exercises:
  - id: T-016-1
    type: mcq
    prompt: {en: "The bar lines are there but the time signature is missing. Which one fits?", sr: "Taktne crte postoje, ali oznaka mere nedostaje. Koja odgovara?"}
    abc: |
      X:1
      M:none
      L:1/8
      K:C clef=perc
      B2 B2 B2 | B4 B2 | B2 BB B2 | B6 |]
    options: ["2/4", "3/4", "4/4"]
    answer: 1
  - id: T-016-2
