    count: 4
    prompt: {en: "Diatonic or with secondary dominants? Listen to the chords on 6 and 2: minor or dominant 7th?", sr: "Dijatonski ili sa sporednim dominantama? Slušaj akorde na 6. i 2. stupnju: molski ili dominantni septakord?"}
