id: T-004
track: T
order: 4
prereqs: [T-003]
title: {en: "Interval quality I: major and minor 2nds and 3rds", sr: "Vrsta intervala I: velike i male sekunde i terce"}
minutes: 12
tags: [intervals]
explain:
  en: |
    The letter count gives the number; **counting half steps** gives the *quality*.
    2nds and 3rds come in two everyday sizes, **major** (M) and **minor** (m):

    | interval | half steps | example |
    |---|---|---|
    | minor 2nd (m2) | 1 | E–F, B–C |
    | major 2nd (M2) | 2 | C–D, F–G |
    | minor 3rd (m3) | 3 | D–F, A–C |
    | major 3rd (M3) | 4 | C–E, F–A |

    Method, always in this order:
    1. Count letters → number (C–E♭ is a 3rd).
    2. Count half steps → quality (C–E♭ = 3 half steps → **minor 3rd**).

    Spelling matters: C–D♯ is also 3 half steps, but C–D is a 2nd, so C–D♯ is an *augmented 2nd*, not a minor 3rd.
    Same key on the piano, different job in the music.

    ```abc
    X:1
    L:1/2
    K:C clef=treble
    [EF] [CD] | [DF] [CE] |]
    ```
  sr: |
    Brojanje imena daje broj intervala; **brojanje polustepena** daje *vrstu*.
    Sekunde i terce se najčešće javljaju u dve veličine, **velika** (M) i **mala** (m):

    | interval | polustepeni | primer |
    |---|---|---|
    | mala sekunda (m2) | 1 | E–F, H–C |
    | velika sekunda (M2) | 2 | C–D, F–G |
    | mala terca (m3) | 3 | D–F, A–C |
    | velika terca (M3) | 4 | C–E, F–A |

    Postupak, uvek ovim redom:
    1. Prebroj imena → broj (C–Es je terca).
    2. Prebroj polustepene → vrsta (C–Es = 3 polustepena → **mala terca**).

    Zapis je važan: C–Dis je takođe 3 polustepena, ali C–D je sekunda, pa je C–Dis *prekomerna sekunda*, a ne mala terca.
    Ista dirka na klaviru, druga uloga u muzici.

    ```abc
    X:1
    L:1/2
    K:C clef=treble
    [EF] [CD] | [DF] [CE] |]
    ```
