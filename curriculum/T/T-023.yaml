id: T-023
track: T
order: 23
prereqs: [T-022]
title: {en: "Seventh chords in minor; viiø7 vs vii°7", sr: "Septakordi u molu; viiø7 i vii°7"}
minutes: 14
tags: [chords, harmony]
explain:
  en: |
    In minor, the chords that **lead to the tonic** use the raised 7th (harmonic minor); the others usually keep the natural 7th.
    The set you actually meet in A minor:

    | numeral | notes | type |
    |---|---|---|
    | i7 | A C E G | minor 7th |
    | iiø7 | B D F A | half-diminished |
    | IIImaj7 | C E G B | major 7th |
    | iv7 | D F A C | minor 7th |
    | **V7** | E **G♯** B D | dominant 7th |
    | VImaj7 | F A C E | major 7th |
    | **vii°7** | **G♯** B D F | **fully diminished** |

    (Strict harmonic minor also gives i(maj7) A–C–E–G♯ and III+maj7; both exist as special colours, mostly in jazz and film music.)

    **viiø7 vs vii°7**: both start with a diminished triad. The difference is the 7th:
    - **ø7, half-diminished** (major keys, B–D–F–A in C): diminished triad + **minor 7th**.
    - **°7, fully diminished** (minor keys, G♯–B–D–F in A minor): diminished triad + **diminished 7th**. Every interval is a minor third, so the chord is **symmetrical**: invert it and it still sounds like a dim7 (on the keyboard, still a stack of minor thirds). There are only three different dim7 chords in all.

    Both work as dominants: each is V7 without its root plus one more note on top (B–D–F + A in C major, G♯–B–D + F in A minor), built on the leading tone; °7 sounds more dramatic.

    ```abc
    X:1
    L:1/1
    K:C
    "Bø7 (C major)"[Bdfa] "G#°7 (A minor)"[^GBdf] |]
    ```
  sr: |
    U molu akordi koji **vode ka tonici** koriste povišeni VII stupanj (harmonski mol); ostali obično zadržavaju prirodni.
    Skup koji stvarno srećeš u a-molu:

    | oznaka | tonovi | vrsta |
    |---|---|---|
    | i7 | A C E G | mali molski |
    | iiø7 | H D F A | polusmanjeni |
    | IIImaj7 | C E G H | veliki durski |
    | iv7 | D F A C | mali molski |
    | **V7** | E **Gis** H D | dominantni |
    | VImaj7 | F A C E | veliki durski |
    | **vii°7** | **Gis** H D F | **smanjeni** |

    (Strogi harmonski mol daje i i(maj7) A–C–E–Gis i III+maj7; oba postoje kao posebne boje, uglavnom u džezu i filmskoj muzici.)

    **viiø7 i vii°7**: oba počinju smanjenim trozvukom. Razlika je u septimi:
    - **ø7, polusmanjeni septakord** (dur, H–D–F–A u C-duru): smanjeni trozvuk + **mala septima**.
    - **°7, smanjeni septakord** (mol, Gis–H–D–F u a-molu): smanjeni trozvuk + **smanjena septima**. Svi susedni intervali su male terce, pa je akord **simetričan**: obrni ga i i dalje zvuči kao smanjeni septakord (na klavijaturi i dalje niz malih terci). Postoje samo tri različita smanjena septakorda.

    Oba deluju kao dominanta: svaki je V7 bez osnovnog tona, sa još jednim tonom na vrhu (H–D–F + A u C-duru, Gis–H–D + F u a-molu), sagrađen na vođici; °7 zvuči dramatičnije.

    ```abc
    X:1
    L:1/1
    K:C
    "Hø7 (C-dur)"[Bdfa] "Gis°7 (a-mol)"[^GBdf] |]
    ```
