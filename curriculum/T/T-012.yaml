id: T-012
track: T
order: 12
prereqs: [T-011]
title: {en: "Diatonic triads in major and Roman numerals", sr: "Trozvuci na stupnjevima dura i rimski brojevi"}
minutes: 13
tags: [chords, harmony]
explain:
  en: |
    Build a triad on **every degree** of a major scale, using only notes of that scale (every other note).
    In C major:

    | degree | 1 | 2 | 3 | 4 | 5 | 6 | 7 |
    |---|---|---|---|---|---|---|---|
    | notes | C E G | D F A | E G B | F A C | G B D | A C E | B D F |
    | quality | major | minor | minor | major | major | minor | dim. |
    | numeral | **I** | **ii** | **iii** | **IV** | **V** | **vi** | **vii°** |

    **Roman numerals** name a chord by its degree, not its letters: **upper case = major**, **lower case = minor**, **° = diminished**.
    The pattern **I ii iii IV V vi vii°** is the same in *every* major key. In G major, V is D–F♯–A; in F major, V is C–E–G.

    That is why musicians say "I–vi–IV–V": it describes the progression in any key at once.

    ```abc
    X:1
    L:1/2
    K:C clef=treble
    [CEG] [DFA] [EGB] [FAc] | [GBd] [Ace] [Bdf] [ceg] |]
    ```
  sr: |
    Napravimo trozvuk na **svakom stupnju** durske lestvice, koristeći samo tonove te lestvice (svaki drugi ton).
    U C-duru:

    | stupanj | I | II | III | IV | V | VI | VII |
    |---|---|---|---|---|---|---|---|
    | tonovi | C E G | D F A | E G H | F A C | G H D | A C E | H D F |
    | vrsta | durski | molski | molski | durski | durski | molski | smanjeni |
    | oznaka | **I** | **ii** | **iii** | **IV** | **V** | **vi** | **vii°** |

    **Rimski brojevi** imenuju akord po stupnju, a ne po imenima tonova: **veliko slovo = durski**, **malo slovo = molski**, **° = smanjeni**.
    Raspored **I ii iii IV V vi vii°** isti je u *svakom* duru. U G-duru V je D–Fis–A; u F-duru V je C–E–G.
    (U domaćoj literaturi stupnjevi se često pišu svi velikim rimskim brojevima; ovde koristimo međunarodni način, gde slovo pokazuje i vrstu akorda.)

    Zato muzičari kažu „I–vi–IV–V": to opisuje niz akorada u bilo kom tonalitetu odjednom.

    ```abc
    X:1
    L:1/2
    K:C clef=treble
    [CEG] [DFA] [EGB] [FAc] | [GBd] [Ace] [Bdf] [ceg] |]
    ```
