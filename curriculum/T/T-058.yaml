id: T-058
track: T
order: 58
prereqs: [T-057]
title: {en: "Tonicization vs modulation: how long is \"in a new key\"?", sr: "Tonikalizacija ili modulacija: koliko dugo je \"u novom tonalitetu\"?"}
minutes: 12
tags: [harmony, modulation, analysis]
explain:
  en: |
    V7/V – V (T-043) and a modulation to G use the same chords. The difference is **time and confirmation**:

    | | tonicization | modulation |
    |---|---|---|
    | length | one or two chords inside a phrase | at least a phrase |
    | cadence in the new key | no | yes, usually authentic (V–I) |
    | afterwards | straight back to the home key | the new key continues |
    | numerals | old key: V7/V – V | new key: G: V7 – I |

    Compare. Example 1: D7 – G is a brief lean toward G, and the phrase cadences in C.

    ```abc
    X:1
    M:4/4
    L:1/2
    K:C
    "C"[CEG]2 | "D7"[D^FAc] "G"[DGB] | "F"[CFA] "G7"[B,DFG] | "C"[CEG]2 |]
    ```

    Example 2: the first phrase ends on G after D7, and the **second phrase** stays in G and closes with a perfect cadence there. Now G is home.

    ```abc
    X:1
    M:4/4
    L:1/2
    K:C
    "C"[CEG]2 | "Am"[CEA]2 | "D7"[D^FAc]2 | "G"[DGB]2 | "Em"[B,EG]2 | "Am"[CEA]2 | "D7"[D^FAc]2 | "G"[DGB]2 |]
    ```

    Note that at bar 4 you cannot yet tell: the phrase could be a half cadence in C with a tonicized V. **The next phrase decides.** If it returns to C, bar 4 was a half cadence; if it continues in G and cadences there, it was a modulation.

    There is a grey zone, and analysts do disagree about middle cases (a few bars in a new key with a weak cadence). Do not worry about the label; ask your ear the real question: **where is home right now?** If you would end the piece on G at this moment and it would feel finished, you are in G.
  sr: |
    V7/V – V (T-043) i modulacija u G-dur koriste iste akorde. Razlika je u **trajanju i potvrdi**:

    | | tonikalizacija | modulacija |
    |---|---|---|
    | trajanje | jedan ili dva akorda unutar fraze | najmanje jedna fraza |
    | kadenca u novom tonalitetu | ne | da, obično autentična (V–I) |
    | posle toga | odmah nazad u polazni tonalitet | novi tonalitet se nastavlja |
    | brojevi | stari tonalitet: V7/V – V | novi tonalitet: G: V7 – I |

    Uporedi. Primer 1: D7 – G je kratko naginjanje ka G, a fraza kadencira u C-duru.

    ```abc
    X:1
    M:4/4
    L:1/2
    K:C
    "C"[CEG]2 | "D7"[D^FAc] "G"[DGB] | "F"[CFA] "G7"[B,DFG] | "C"[CEG]2 |]
    ```

    Primer 2: prva fraza se završava na G posle D7, a **druga fraza** ostaje u G-duru i tamo se zatvara savršenom kadencom. Sada je G dom.

    ```abc
    X:1
    M:4/4
    L:1/2
    K:C
    "C"[CEG]2 | "Am"[CEA]2 | "D7"[D^FAc]2 | "G"[DGB]2 | "Em"[B,EG]2 | "Am"[CEA]2 | "D7"[D^FAc]2 | "G"[DGB]2 |]
    ```

    Obrati pažnju: u 4. taktu još ne možeš znati: fraza može biti polukadenca u C-duru sa tonikalizovanom dominantom. **Sledeća fraza odlučuje.** Ako se vrati u C, 4. takt je bio polukadenca; ako nastavi u G-duru i tamo kadencira, bila je to modulacija.

    Postoji siva zona, i analitičari se zaista ne slažu oko srednjih slučajeva (nekoliko taktova u novom tonalitetu sa slabom kadencom). Ne brini o oznaci; postavi uhu pravo pitanje: **gde je dom upravo sada?** Ako bi u ovom trenutku završio komad na G i to bi zvučalo završeno, u G-duru si.
