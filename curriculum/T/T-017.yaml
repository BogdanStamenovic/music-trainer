id: T-017
track: T
order: 17
prereqs: [T-016]
title: {en: "Compound meters: 6/8, 9/8, 12/8", sr: "Složene mere: 6/8, 9/8, 12/8"}
minutes: 12
tags: [rhythm]
explain:
  en: |
    In a **compound meter** each beat is a **dotted quarter**, so it divides into **three** eighths, not two.
    The top number counts eighths, not beats: divide it by 3 to get the beats you actually feel.

    | meter | eighths | felt beats | count |
    |---|---|---|---|
    | 6/8 | 6 | 2 | **1**-and-a **2**-and-a |
    | 9/8 | 9 | 3 | **1**-and-a **2**-and-a **3**-and-a |
    | 12/8 | 12 | 4 | four groups of three |

    The trap: **3/4 and 6/8 both hold six eighths**, but they group them differently.
    3/4 is three beats of two (**1**&**2**&**3**&); 6/8 is two beats of three (**1**23**4**56). Beaming shows the grouping, so read the beams, not just the note count.
    Compound time is the lilt of a jig, a barcarolle, a slow 12/8 blues or a doo-wop ballad. At the keyboard, a 12/8 ballad is often four left-hand beats with right-hand eighth-note triplet chords on top.

    ```abc
    X:1
    L:1/8
    M:3/4
    K:C clef=perc
    !>!BB BB BB | !>!B2 B2 B2 || [M:6/8] !>!BBB !>!BBB | !>!B3 !>!B3 |]
    ```
  sr: |
    U **složenoj meri** svaka doba je **četvrtina s tačkom**, pa se deli na **tri** osmine, a ne na dve.
    Gornji broj broji osmine, ne dobe: podeli ga sa 3 i dobićeš dobe koje stvarno osećaš.

    | mera | osmine | dobe | brojanje |
    |---|---|---|---|
    | 6/8 | 6 | 2 | **1**-i-a **2**-i-a |
    | 9/8 | 9 | 3 | **1**-i-a **2**-i-a **3**-i-a |
    | 12/8 | 12 | 4 | četiri grupe po tri |

    Zamka: **3/4 i 6/8 imaju po šest osmina**, ali ih grupišu drugačije.
    3/4 su tri dobe po dve osmine (**1** i **2** i **3** i); 6/8 su dve dobe po tri (**1**23**4**56). Grede (spojnice) pokazuju grupisanje, zato čitaj grede, ne samo broj nota.
    Složena mera je ljuljanje žige, barkarole, spore bluz-balade u 12/8. Za klavirom, balada u 12/8 je često četiri dobe u levoj ruci i triolski akordi u osminama u desnoj.

    ```abc
    X:1
    L:1/8
    M:3/4
    K:C clef=perc
    !>!BB BB BB | !>!B2 B2 B2 || [M:6/8] !>!BBB !>!BBB | !>!B3 !>!B3 |]
    ```
