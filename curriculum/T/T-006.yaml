  - id: T-006-1
    type: generated
    prompt: {en: "Count half steps, up to an octave", sr: "Broj polustepene, do oktave"}
    count: 5
    gen: {kind: semitones, maxSemitones: 12}
  - id: T-006-2
    type: generated
    prompt: {en: "Name 6ths and 7ths", sr: "Imenuj sekste i septime"}
    count: 6
    gen: {kind: interval-name, intervals: [m6, M6, m7, M7], show: both}
  - id: T-006-3
    type: generated
    prompt: {en: "Find 6ths and 7ths on the keys", sr: "Nađi sekste i septime na klavijaturi"}
    count: 4
    gen: {kind: interval-build, intervals: [m6, M6, m7, M7], answer: play}
  - id: T-006-4
    type: mcq
    prompt: {en: "C–E is a major 3rd. Its inversion E–C is a…", sr: "C–E je velika terca. Njen obrtaj E–C je…"}
    options:
      - {en: "minor 6th", sr: "mala seksta"}
      - {en: "major 6th", sr: "velika seksta"}
      - {en: "minor 3rd", sr: "mala terca"}
      - {en: "perfect 5th", sr: "čista kvinta"}
    answer: 0
    checks:
      - interval: {from: C4, to: E4, is: M3}
      - interval: {from: E4, to: C5, is: m6}
  - id: T-006-5
    type: mcq
    prompt: {en: "D–C is a minor 7th. What is its inversion C–D?", sr: "D–C je mala septima. Šta je njen obrtaj C–D?"}
    options:
      - {en: "minor 2nd", sr: "mala sekunda"}
      - {en: "major 2nd", sr: "velika sekunda"}
      - {en: "major 7th", sr: "velika septima"}
      - {en: "minor 3rd", sr: "mala terca"}
    answer: 1
    checks:
      - interval: {from: D4, to: C5, is: m7}
      - interval: {from: C5, to: D5, is: M2}
  - id: T-006-6
    type: mcq
    prompt: {en: "A perfect 4th inverts to a…", sr: "Čista kvarta se obrće u…"}
    options:
      - {en: "perfect 5th", sr: "čistu kvintu"}
      - {en: "diminished 5th", sr: "smanjenu kvintu"}
      - {en: "perfect 4th", sr: "čistu kvartu"}
      - {en: "major 6th", sr: "veliku sekstu"}
    answer: 0
    checks:
      - interval: {from: G4, to: C5, is: P4}
      - interval: {from: C5, to: G5, is: P5}
  - id: T-006-7
    type: generated
    prompt: {en: "Hear 6ths, 7ths and the octave", sr: "Prepoznaj sluhom sekste, septime i oktavu"}
    count: 6
    gen: {kind: interval-ear, intervals: [m6, M6, m7, M7, P8], direction: up}
