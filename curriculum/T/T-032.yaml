id: T-032
track: T
order: 32
prereqs: [T-031]
title: {en: "Review: harmonizing a melody with I, IV, V(7), ii, vi", sr: "Ponavljanje: harmonizacija melodije sa I, IV, V(7), ii, vi"}
minutes: 15
tags: [harmony, review]
explain:
  en: |
    Harmonizing a melody puts this whole wave together: chord tones, non-chord tones, function and cadence.

    **The method**
    1. Mark the notes on **strong beats** (and long notes). Those are your chord tones; passing and neighbor tones on weak beats can be ignored.
    2. List the chords that **contain** each marked note. In C major:

    | melody note | chords that contain it |
    |---|---|
    | C | I, IV, vi |
    | D | ii, V(7) |
    | E | I, vi (iii) |
    | F | IV, ii, V7 |
    | G | I, V(7) (iii) |
    | A | IV, ii, vi |
    | B | V(7) (iii, vii°) |

    3. Choose by **function**: start on I, end with a cadence (**V(7) → I** at the end, often V for a half cadence in the middle), and prefer T → PD → D → T inside a phrase.
    4. Play it and listen. If two chords both fit, pick the one that makes the bass move well (by step or by fifth).

    A simple 4-bar example, one chord per bar:

    ```abc
    X:1
    M:4/4
    L:1/4
    K:C
    "I"C E G E | "IV"F A c A | "V7"B d G F | "I"E4 |]
    ```
  sr: |
    Harmonizacija melodije spaja ceo ovaj talas: akordske tonove, vanakordske tonove, funkcije i kadencu.

    **Postupak**
    1. Označi tonove na **jakim dobama** (i duge tonove). To su akordski tonovi; prolaznice i skretnice na slabim dobama možeš zanemariti.
    2. Za svaki označeni ton nabroj akorde koji ga **sadrže**. U C-duru:

    | ton melodije | akordi koji ga sadrže |
    |---|---|
    | C | I, IV, vi |
    | D | ii, V(7) |
    | E | I, vi (iii) |
    | F | IV, ii, V7 |
    | G | I, V(7) (iii) |
    | A | IV, ii, vi |
    | H | V(7) (iii, vii°) |

    3. Biraj po **funkciji**: počni na I, završi kadencom (**V(7) → I** na kraju, u sredini često V kao polukadenca) i unutar fraze se drži toka T → S → D → T.
    4. Odsviraj i slušaj. Ako dva akorda odgovaraju, izaberi onaj koji daje dobar pokret basa (za stupanj ili za kvintu).

    Jednostavan primer od 4 takta, jedan akord po taktu:

    ```abc
    X:1
    M:4/4
    L:1/4
    K:C
    "I"C E G E | "IV"F A c A | "V7"B d G F | "I"E4 |]
    ```
exercises:
  - id: T-032-1
    type: mcq
    prompt: {en: "Bar 2 uses F, A and C. Which chord fits the whole bar?", sr: "2. takt koristi F, A i C. Koji akord odgovara celom taktu?"}
    abc: |
      X:1
      M:4/4
      L:1/4
      K:C
      G E C E | A F A c | B G d B | c4 |]
    options: ["I", "IV", "V7", "vi"]
    answer: 1
    checks:
      - chord: {notes: [F4, A4, C5], root: F, quality: maj}
  - id: T-032-2
    type: mcq
    prompt: {en: "Bar 3 uses B, G and D. Which chord fits?", sr: "3. takt koristi H, G i D. Koji akord odgovara?"}
    abc: |
