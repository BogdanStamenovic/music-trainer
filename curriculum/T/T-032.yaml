      M:4/4
      L:1/4
      K:C
      G E C E | A F A c | B G d B | c4 |]
    options: ["ii", "IV", "V", "vi"]
    answer: 2
    checks:
      - chord: {notes: [G4, B4, D5], root: G, quality: maj}
  - id: T-032-3
    type: mcq
    prompt: {en: "In C major, a melody A on a strong beat can be harmonized by…", sr: "U C-duru, ton A na jakoj dobi može se harmonizovati sa…"}
    options: ["IV, ii, vi", "I, iii, V", "V, vii°, iii", "I, IV, V"]
    answer: 0
    checks:
      - chord: {notes: [F4, A4, C5], root: F, quality: maj}
      - chord: {notes: [D4, F4, A4], root: D, quality: min}
      - chord: {notes: [A4, C5, E5], root: A, quality: min}
  - id: T-032-4
    type: mcq
    prompt: {en: "In C major, which chord can NOT harmonize a melody E?", sr: "Koji akord u C-duru NE može da harmonizuje ton E u melodiji?"}
    options: ["I", "vi", "iii", "V"]
