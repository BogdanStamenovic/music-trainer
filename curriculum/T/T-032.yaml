    type: mcq
    prompt: {en: "The melody ends D → C on the last downbeat. The best final two chords are…", sr: "Melodija se završava sa D → C na poslednjoj jakoj dobi. Najbolja poslednja dva akorda su…"}
    options: ["V(7) → I", "IV → I", "ii → vi", "I → V"]
    answer: 0
  - id: T-032-6
    type: midi-play
    prompt: {en: "Play the harmonization of the melody above, one chord per bar: I – IV – V – I in C (root in the bass).", sr: "Odsviraj harmonizaciju melodije iznad, jedan akord po taktu: I – IV – V – I u C-duru (osnovni ton u basu)."}
    abc: |
      X:1
      M:4/4
      L:1/4
      K:C
      G E C E | A F A c | B G d B | c4 |]
    mode: chords
