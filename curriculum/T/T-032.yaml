    bass: true
    derive: {roman: {key: C4, numerals: [I, IV, V, I]}}
  - id: T-032-7
    type: compose
    prompt: {en: "Add a bass line under this melody (voice 2, bass clef): one note per bar or more, roots of I – IV – V – I or your own choice. Avoid parallel fifths and octaves with the melody; end with the bass going G → C.", sr: "Dodaj basovu liniju ispod ove melodije (2. glas, bas ključ): jedan ton po taktu ili više, osnovni tonovi I – IV – V – I ili po tvom izboru. Izbegavaj paralelne kvinte i oktave sa melodijom; završi basom G → C."}
    key: C major
    meter: "4/4"
    bars: 4
    voices: 2
