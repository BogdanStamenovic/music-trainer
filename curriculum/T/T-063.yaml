    type: mcq
    prompt: {en: "Which key is the B section in, and what is the clue?", sr: "U kom tonalitetu je B deo i šta je trag?"}
    options:
      - {en: "A minor: G♯, the leading tone, in E7", sr: "a-mol: Gis, vođica, u akordu E7"}
      - {en: "C major: no accidentals", sr: "C-dur: nema predznaka"}
      - {en: "E major: G♯", sr: "E-dur: Gis"}
      - {en: "D minor: the Dm chord", sr: "d-mol: akord d-mol"}
    answer: 0
    checks:
      - numeral: {key: A, type: harmonic-minor, is: V7, notes: [E4, G#4, B4, D5]}
      - numeral: {key: A, type: harmonic-minor, is: iv, notes: [D4, F4, A4]}
