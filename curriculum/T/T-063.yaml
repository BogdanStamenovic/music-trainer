id: T-063
track: T
order: 63
prereqs: [T-062]
title: {en: "Ternary form", sr: "Trodelni oblik"}
minutes: 12
tags: [form, analysis]
explain:
  en: |
    **Ternary form** (trodelni oblik) is **A B A**: a statement, a contrast, and a return. Its big difference from rounded binary is that the first **A is closed**: it ends with a perfect cadence **in the tonic** and could stand alone as a complete piece. B is a full section with its own character, often in a different key, and then A returns (often unchanged).

    | | rounded binary | ternary |
    |---|---|---|
    | end of A | open (in V or III) | closed (PAC in I) |
    | B | a continuation, leads back | a separate, contrasting section |
    | return | only part of A, inside the second half | all of A |

    Where you meet it: the **minuet and trio** (minuet – trio – minuet *da capo*; each of the three parts is itself a small binary form), the Baroque *da capo* aria, nocturnes, many slow movements, and plenty of songs.

    Contrast in B usually comes from several things at once: **key** (relative or parallel minor, the subdominant), **texture**, **rhythm**, **register**.

    The return is often not written out. **D.C. al Fine** (*da capo al fine*) means: go back to the beginning and play to the word **Fine** (end).

    ```abc
    X:1
    M:4/4
    L:1/4
    K:C
    "C" E G c G | "F" A c "G7" B d | "C" c G E G | "G7" F D "C""^Fine" C2 ||
    "Am" A c e c | "Dm" d f "E7" ^g e | "Am" a e c A | "E7" ^G B "Am""^D.C. al Fine" A2 |]
    ```

    Play bars 1–8, go back to bar 1, stop at Fine (bar 4): A B A, 12 bars. A is in C and closes with a perfect cadence; B moves to A minor (G♯ is the clue).
  sr: |
    **Trodelni oblik** je **A B A**: izlaganje, kontrast i povratak. Njegova velika razlika od zaokruženog dvodelnog oblika je u tome što je prvi **A deo zatvoren**: završava se savršenom kadencom **u tonici** i mogao bi da stoji sam kao celovit komad. B je ceo deo sa sopstvenim karakterom, često u drugom tonalitetu, a zatim se A vraća (često nepromenjen).

    | | zaokruženi dvodelni | trodelni |
    |---|---|---|
    | kraj A | otvoren (u V ili III) | zatvoren (savršena kadenca u I) |
    | B | nastavak, vodi nazad | poseban, kontrastni deo |
    | povratak | samo deo A, unutar drugog dela | ceo A |

    Gde ga srećeš: **menuet i trio** (menuet – trio – menuet *da capo*; svaki od tri dela je sam po sebi mali dvodelni oblik), barokna *da capo* arija, nokturna, mnogi spori stavovi i mnoge pesme.

    Kontrast u B delu obično dolazi iz više stvari odjednom: **tonalitet** (paralelni ili istoimeni mol, subdominanta), **faktura**, **ritam**, **registar**.

    Povratak često nije ispisan. **D.C. al Fine** (*da capo al fine*) znači: vrati se na početak i sviraj do reči **Fine** (kraj).

    ```abc
    X:1
    M:4/4
    L:1/4
    K:C
    "C" E G c G | "F" A c "G7" B d | "C" c G E G | "G7" F D "C""^Fine" C2 ||
    "Am" A c e c | "Dm" d f "E7" ^g e | "Am" a e c A | "E7" ^G B "Am""^D.C. al Fine" A2 |]
    ```

    Odsviraj taktove 1–8, vrati se na 1. takt, stani kod Fine (4. takt): A B A, 12 taktova. A je u C-duru i zatvara se savršenom kadencom; B prelazi u a-mol (Gis je trag).
exercises:
  - id: T-063-1
    type: mcq
    prompt: {en: "In the example, which bars do you play, in order?", sr: "Koje taktove u primeru sviraš, redom?"}
    options:
      - {en: "1–8, then 1–4", sr: "1–8, pa 1–4"}
      - {en: "1–8, then 1–8", sr: "1–8, pa 1–8"}
      - {en: "1–4, 1–4, 5–8", sr: "1–4, 1–4, 5–8"}
      - {en: "1–8 only", sr: "samo 1–8"}
    answer: 0
  - id: T-063-2
    type: mcq
    prompt: {en: "What makes the example ternary rather than rounded binary?", sr: "Šta primer čini trodelnim, a ne zaokruženim dvodelnim oblikom?"}
    options:
      - {en: "A is closed: it ends with a perfect cadence in C, and all of A returns", sr: "A je zatvoren: završava se savršenom kadencom u C-duru, i vraća se ceo A"}
      - {en: "B is in a minor key", sr: "B je u molu"}
      - {en: "There are no repeat signs", sr: "Nema znakova za ponavljanje"}
    answer: 0
    checks:
      - numeral: {key: C, is: V7, notes: [G3, B3, D4, F4]}
