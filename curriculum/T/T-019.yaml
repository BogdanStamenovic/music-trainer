  - id: T-019-1
    type: generated
    prompt: {en: "Which numeral is this chord in A harmonic minor?", sr: "Koji je rimski broj ovog akorda u harmonskom a-molu?"}
    count: 5
    gen: {kind: roman, keys: [A], type: harmonic-minor, ask: numeral}
    checks:
      - roman: {key: A, type: harmonic-minor, degree: 1, is: "i"}
      - roman: {key: A, type: harmonic-minor, degree: 2, is: "ii°"}
      - roman: {key: A, type: harmonic-minor, degree: 3, is: "III+"}
      - roman: {key: A, type: harmonic-minor, degree: 4, is: "iv"}
      - roman: {key: A, type: harmonic-minor, degree: 5, is: "V"}
      - roman: {key: A, type: harmonic-minor, degree: 6, is: "VI"}
      - roman: {key: A, type: harmonic-minor, degree: 7, is: "vii°"}
      - scale: {tonic: A, type: harmonic-minor, is: [A, B, C, D, E, F, G#]}
      - chord: {notes: [C4, E4, G#4], root: C, quality: aug}
