  - id: T-019-5
    type: mcq
    prompt: {en: "Why raise the 7th degree in minor?", sr: "Zašto se u molu povisuje VII stupanj?"}
    options:
      - {en: "So V becomes major and has a leading tone a half step below the tonic", sr: "Da V postane durski i dobije vođicu polustepen ispod tonike"}
      - {en: "So the scale has no augmented second", sr: "Da lestvica nema prekomernu sekundu"}
      - {en: "So iv becomes major", sr: "Da iv postane durski"}
      - {en: "So the key signature changes", sr: "Da se promeni oznaka tonaliteta"}
    answer: 0
  - id: T-019-6
    type: mcq
    prompt: {en: "Listen to i–iv–?–i in A minor. Which chord is on the third position?", sr: "Slušaj i–iv–?–i u a-molu. Koji je akord na trećem mestu?"}
    play: {derive: {roman: {key: A3, type: natural-minor, numerals: [i, iv, v, i]}}, tempo: 60}
    options:
