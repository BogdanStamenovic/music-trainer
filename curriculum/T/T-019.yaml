    type: generated
    prompt: {en: "Play i, iv and V in minor keys", sr: "Odsviraj i, iv i V u molu"}
    count: 4
    gen: {kind: roman, keys: [A, D, E], type: harmonic-minor, degrees: [1, 4, 5], ask: play}
  - id: T-019-4
    type: mcq
    prompt: {en: "In A minor, V is…", sr: "U a-molu V je…"}
    options:
      - {en: "E–G–B", sr: "E–G–H"}
      - {en: "E–G♯–B", sr: "E–Gis–H"}
      - {en: "E–G♯–B♯", sr: "E–Gis–His"}
