id: T-019
track: T
order: 19
prereqs: [T-018]
title: {en: "Diatonic triads in minor (harmonic minor: i ii° III+ iv V VI vii°)", sr: "Trozvuci na stupnjevima mola (harmonski mol: i ii° III+ iv V VI vii°)"}
minutes: 13
tags: [chords, harmony]
explain:
  en: |
    Build triads on the **natural minor** scale and V comes out **minor**: in A minor, E–G–B.
    A minor v has no **leading tone**: G is a whole step below A, so it does not pull home. V–i cadences sound weak.

    The fix is **harmonic minor**: raise the 7th degree (G → G♯). That one note changes three chords:

    | degree | 1 | 2 | 3 | 4 | 5 | 6 | 7 |
    |---|---|---|---|---|---|---|---|
    | A harmonic minor | A C E | B D F | C E G♯ | D F A | E G♯ B | F A C | G♯ B D |
    | quality | minor | dim. | **aug.** | minor | **major** | major | **dim.** |
    | numeral | **i** | **ii°** | **III+** | **iv** | **V** | **VI** | **vii°** |

    **V** (major) and **vii°** are the reason harmonic minor exists: both contain G♯, which rises a half step to A.
    **III+** is a side effect; in real music III usually keeps the natural 7th (C–E–G) because it does not lead to the tonic.

    At the keyboard: in any minor key, play i–iv–V–i and notice that V is the only chord with an accidental outside the key signature.

    ```abc
    X:1
    L:1/2
    K:Am
    "i"[ACe] "iv"[DFa] | "V"[E^GB] "i"[Ace] |]
    ```
  sr: |
    Ako gradimo trozvuke na **prirodnom molu**, V ispada **molski**: u a-molu E–G–H.
    Molska dominanta nema **vođicu**: G je ceo stepen ispod A, pa ne vuče ka tonici. Kadenca V–i zvuči slabo.

    Rešenje je **harmonski mol**: povisimo VII stupanj (G → Gis). Taj jedan ton menja tri akorda:

    | stupanj | I | II | III | IV | V | VI | VII |
    |---|---|---|---|---|---|---|---|
    | a-mol harmonski | A C E | H D F | C E Gis | D F A | E Gis H | F A C | Gis H D |
    | vrsta | molski | smanjeni | **povećani** | molski | **durski** | durski | **smanjeni** |
    | oznaka | **i** | **ii°** | **III+** | **iv** | **V** | **VI** | **vii°** |

    **Durska dominanta (V)** i **vii°** su razlog postojanja harmonskog mola: oba sadrže Gis, koje ide polustepenom naviše na A.
    **III+** je usputna posledica; u stvarnoj muzici III obično zadržava prirodni VII stupanj (C–E–G), jer ne vodi ka tonici.

    Za klavirom: u bilo kom molu odsviraj i–iv–V–i i primeti da je V jedini akord sa predznakom van oznake tonaliteta.

    ```abc
    X:1
    L:1/2
    K:Am
    "i"[ACe] "iv"[DFa] | "V"[E^GB] "i"[Ace] |]
    ```
