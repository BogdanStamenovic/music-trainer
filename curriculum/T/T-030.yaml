  - id: T-030-4
    type: mcq
    prompt: {en: "What separates a suspension from an appoggiatura?", sr: "Šta razlikuje zadržicu od apođature?"}
    options:
      - {en: "How the dissonance is approached: held over from the previous chord vs. reached by a leap", sr: "Kako se dolazi do disonance: zadržana iz prethodnog akorda ili dostignuta skokom"}
      - {en: "A suspension is on a weak beat, an appoggiatura on a strong beat", sr: "Zadržica je na slaboj dobi, apođatura na teškoj"}
      - {en: "A suspension resolves up, an appoggiatura down", sr: "Zadržica se razrešava naviše, apođatura naniže"}
      - {en: "Nothing, they are two names for the same thing", sr: "Ništa, to su dva imena za isto"}
    answer: 0
  - id: T-030-5
    type: mcq
    prompt: {en: "Listen: C major, then something on G, then C. What happens in the 2nd and 3rd chords?", sr: "Slušaj: C-dur, zatim nešto na G, pa C. Šta se dešava u 2. i 3. akordu?"}
