    options:
      - {en: "a 4–3 suspension: C held over G, resolving down to B", sr: "zadržica 4–3: C zadržano nad G, razrešava se naniže na H"}
      - {en: "a passing tone between two chords", sr: "prolaznica između dva akorda"}
      - {en: "a deceptive cadence", sr: "prekinuta kadenca"}
      - {en: "nothing: two plain G major chords", sr: "ništa: dva obična G-dur akorda"}
    answer: 0
    checks:
      - interval: {from: G3, to: C4, is: P4}
      - interval: {from: B3, to: C4, is: m2}
      - chord: {notes: [G3, B3, D4], root: G, quality: maj}
