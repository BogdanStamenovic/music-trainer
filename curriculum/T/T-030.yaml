id: T-030
track: T
order: 30
prereqs: [T-029]
title: {en: "Non-chord tones II: suspensions, appoggiaturas, anticipations", sr: "Vanakordski tonovi II: zadržica, apođatura, anticipacija"}
minutes: 13
tags: [harmony, melody]
explain:
  en: |
    Passing and neighbor tones are quiet, on weak beats. These three are the **expressive** ones: the dissonance lands on a **strong** beat (or arrives early), and the ear feels it.

    | name | approached by | dissonance on | left by |
    |---|---|---|---|
    | **suspension** | the **same note**, held over from the previous chord (prepared) | strong beat | step **down** |
    | **appoggiatura** | a **leap** | strong beat | step, usually in the opposite direction |
    | **anticipation** | step | weak beat, just **before** the chord change | repeated: it is a note of the *next* chord, arriving early |

    The classic **4–3 suspension**: C is a chord tone of C major, is held while the harmony changes to G, now sits a 4th above the bass and resolves down to B, the 3rd. That is exactly what the sus4 chord (Gsus4 → G) does in pop.
    An appoggiatura is the "sigh": the melody leaps up to a dissonance on the beat and falls back. An anticipation is common at final cadences: the tonic note sounds a beat early, before V has resolved.

    The test that separates suspension from appoggiatura: look at the note *before* the dissonance. Same pitch (tied or repeated) → suspension. A leap → appoggiatura.

    ```abc
    X:1
    M:4/4
    L:1/4
    K:C
    "C"G2 c2- | "G"c2 B2 | "C"c4 || "C"C2 E2 | "G"c2 B2 | "C"c4 || "G"d2 B c | "C"c4 |]
    ```

    Bars 1–3: suspension (C tied over into G). Bars 4–6: appoggiatura (leap E → C onto the G chord). Bars 7–8: anticipation (C arrives on beat 4, before the C chord).
  sr: |
    Prolaznice i skretnice su tihe, na slabim dobama. Ova tri su **izražajna**: disonanca pada na **tešku** dobu (ili stiže ranije), i uho je oseti.

    | naziv | dolazak | disonanca na | odlazak |
    |---|---|---|---|
    | **zadržica** | **isti ton**, zadržan iz prethodnog akorda (pripremljen) | jakoj dobi | za stupanj **naniže** |
    | **apođatura** | **skokom** | jakoj dobi | za stupanj, obično u suprotnom smeru |
    | **anticipacija** | za stupanj | slaboj dobi, tik **pre** promene akorda | ponavlja se: to je ton *sledećeg* akorda koji stiže ranije |

    Klasična **zadržica 4–3**: C je akordski ton C-dura, zadržava se dok se harmonija menja u G, sada je kvarta iznad basa i razrešava se naniže na H, tercu. Upravo to radi sus4 akord (Gsus4 → G) u popu.
    Apođatura je „uzdah": melodija skače na disonancu na dobi i vraća se. Anticipacija je česta u završnim kadencama: tonika zazvuči dobu ranije, pre nego što se V razreši.

    Test koji razdvaja zadržicu od apođature: pogledaj ton *pre* disonance. Isti ton (vezan lukom ili ponovljen) → zadržica. Skok → apođatura.

    ```abc
    X:1
    M:4/4
    L:1/4
    K:C
    "C"G2 c2- | "G"c2 B2 | "C"c4 || "C"C2 E2 | "G"c2 B2 | "C"c4 || "G"d2 B c | "C"c4 |]
    ```

    Taktovi 1–3: zadržica (C vezano lukom u G). Taktovi 4–6: apođatura (skok E → C na G akord). Taktovi 7–8: anticipacija (C stiže na 4. dobu, pre C akorda).
exercises:
  - id: T-030-1
    type: mcq
    prompt: {en: "The C on the downbeat of bar 2 (over G) is a…", sr: "C na prvoj dobi 2. takta (nad G) je…"}
    abc: |
      X:1
      M:4/4
      L:1/4
      K:C
      "C"G2 c2- | "G"c2 B2 | "C"c4 |]
    options:
      - {en: "suspension", sr: "zadržica"}
      - {en: "appoggiatura", sr: "apođatura"}
      - {en: "anticipation", sr: "anticipacija"}
      - {en: "passing tone", sr: "prolaznica"}
    answer: 0
    checks:
      - chord: {notes: [G4, B4, D5], root: G, quality: maj}
      - interval: {from: G4, to: C5, is: P4}
      - interval: {from: B4, to: C5, is: m2}
