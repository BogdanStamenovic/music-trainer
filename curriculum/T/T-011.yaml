id: T-011
track: T
order: 11
prereqs: [T-010]
title: {en: "Triads: major, minor, diminished, augmented", sr: "Trozvuci: durski, molski, smanjeni, povećani"}
minutes: 13
tags: [chords]
explain:
  en: |
    A **triad** is three notes stacked in **3rds**: a **root**, the **3rd** above it, and the **5th** above it.
    On the staff that is line-line-line or space-space-space, like a snowman.

    Which two 3rds you stack decides the quality:

    | triad | lower 3rd | upper 3rd | root to 5th | C example |
    |---|---|---|---|---|
    | major | M3 | m3 | P5 | C E G |
    | minor | m3 | M3 | P5 | C E♭ G |
    | diminished | m3 | m3 | d5 | C E♭ G♭ |
    | augmented | M3 | M3 | A5 | C E G♯ |

    Major and minor share the perfect 5th; only the 3rd differs. Diminished squeezes the 5th, augmented stretches it.
    Spelling still matters: C diminished is C–E♭–G♭, not C–E♭–F♯, because a triad uses every other letter (C, E, G).

    ```abc
    X:1
    L:1/2
    K:C clef=treble
    [CEG] [C_EG] | [C_E_G] [CE^G] |]
    ```
  sr: |
    **Trozvuk** su tri tona složena po **tercama**: **osnovni ton**, **terca** iznad njega i **kvinta** iznad njega.
    Na linijskom sistemu to je linija-linija-linija ili praznina-praznina-praznina.
    Trozvuk u osnovnom položaju zove se i **kvintakord**.

    Koje dve terce složiš, to određuje vrstu:

    | trozvuk | donja terca | gornja terca | osnovni ton – kvinta | primer od C |
    |---|---|---|---|---|
    | durski | M3 | m3 | P5 | C E G |
    | molski | m3 | M3 | P5 | C Es G |
    | smanjeni | m3 | m3 | d5 | C Es Ges |
    | povećani | M3 | M3 | A5 | C E Gis |

    Durski i molski imaju istu čistu kvintu; razlikuje se samo terca. Smanjeni sužava kvintu, povećani je širi.
    Zapis je i ovde važan: smanjeni trozvuk od C je C–Es–Ges, a ne C–Es–Fis, jer trozvuk koristi svako drugo ime (C, E, G).

    ```abc
    X:1
    L:1/2
    K:C clef=treble
    [CEG] [C_EG] | [C_E_G] [CE^G] |]
    ```
