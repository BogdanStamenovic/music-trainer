    checks:
      - chord: {notes: [C4, E4, G4], root: C, quality: maj}
      - chord: {notes: [C4, Eb4, G4], root: C, quality: min}
      - chord: {notes: [C4, Eb4, Gb4], root: C, quality: dim}
      - chord: {notes: [C4, E4, G#4], root: C, quality: aug}
