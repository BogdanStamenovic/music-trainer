id: T-065
track: T
order: 65
prereqs: [T-064]
title: {en: "Song forms II: verse–chorus–bridge", sr: "Oblici pesme II: strofa–refren–most"}
minutes: 12
tags: [form, song, pop, analysis]
explain:
  en: |
    Since the 1960s most pop, rock, country and Serbian pop songs use **verse–chorus** form. The sections:

    | section | sr | music | words | job |
    |---|---|---|---|---|
    | verse | strofa | same each time | **new** each time | tells the story, the details |
    | pre-chorus | predrefren | same each time | often the same | builds tension, usually ends on **V** (or IV) |
    | chorus | refren | same each time | **same** each time | the title and the hook, the emotional summary |
    | bridge | most | heard **once** | new | a new angle; new chords; sets up the last chorus |

    A typical map: **Intro – Verse – (Pre) – Chorus – Verse – (Pre) – Chorus – Bridge – Chorus – Chorus – Outro.**

    How the chorus is made to feel like the arrival (you will use this in C-017 and L-011):
    - **register**: the verse sits lower, the chorus higher (the chorus has the highest notes of the song);
    - **rhythm**: the verse has more words and shorter notes, the chorus fewer words and longer notes;
    - **harmony**: the chorus often starts on **I** or **IV** after a verse that avoided I or started on vi; the harmonic rhythm may change;
    - **texture**: the band gets fuller.

    The **bridge** comes after the second chorus, because by then the listener has heard verse and chorus twice and wants something new. It often starts on **IV or vi** and ends on **V**, so that the last chorus lands with full force, sometimes **lifted** to a higher key (T-056).

    Compare with AABA (T-064): there, the A section carries the title and the bridge is the only contrast. Here the contrast is built in from the start: verse versus chorus.
  sr: |
    Od 1960-ih većina pop, rok, kantri i domaćih pop pesama koristi oblik **strofa–refren**. Delovi:

    | deo | en | muzika | tekst | posao |
    |---|---|---|---|---|
    | strofa | verse | ista svaki put | **nov** svaki put | priča priču, detalji |
    | predrefren | pre-chorus | ista svaki put | često isti | gradi napetost, obično se završava na **V** (ili IV) |
    | refren | chorus | ista svaki put | **isti** svaki put | naslov i glavni motiv (hook), emotivni sažetak |
    | most | bridge | čuje se **jednom** | nov | nov ugao; novi akordi; priprema poslednji refren |

    Tipičan plan: **Uvod – Strofa – (Predrefren) – Refren – Strofa – (Predrefren) – Refren – Most – Refren – Refren – Završetak.**

    Kako se postiže da refren zvuči kao dolazak (koristićeš to u C-017 i L-011):
    - **registar**: strofa je niže, refren više (refren ima najviše tonove pesme);
    - **ritam**: strofa ima više reči i kraće note, refren manje reči i duže note;
    - **harmonija**: refren često počinje na **I** ili **IV** posle strofe koja je izbegavala I ili počinjala na vi; harmonski ritam se može promeniti;
    - **faktura**: bend postaje puniji.

    **Most** dolazi posle drugog refrena, jer je slušalac do tada dvaput čuo strofu i refren i želi nešto novo. Često počinje na **IV ili vi** i završava se na **V**, da bi poslednji refren pao punom snagom, ponekad **podignut** u viši tonalitet (T-056).

    Uporedi sa AABA (T-064): tamo A deo nosi naslov, a most je jedini kontrast. Ovde je kontrast ugrađen od početka: strofa naspram refrena.
exercises:
  - id: T-065-1
    type: mcq
    prompt: {en: "Which section comes back with the same music AND the same words every time?", sr: "Koji deo se vraća sa istom muzikom I istim tekstom svaki put?"}
    options:
      - {en: "The chorus (refren)", sr: "Refren"}
      - {en: "The verse (strofa)", sr: "Strofa"}
      - {en: "The bridge (most)", sr: "Most"}
      - {en: "The intro", sr: "Uvod"}
    answer: 0
  - id: T-065-2
    type: mcq
    prompt: {en: "Which is the typical verse–chorus map?", sr: "Koji je tipičan plan strofa–refren pesme?"}
    options:
      - {en: "V – C – V – C – Bridge – C", sr: "S – R – S – R – Most – R"}
      - {en: "V – V – Bridge – V", sr: "S – S – Most – S"}
      - {en: "C – Bridge – C – Bridge – V", sr: "R – Most – R – Most – S"}
      - {en: "Bridge – V – C – V – C", sr: "Most – S – R – S – R"}
    answer: 0
  - id: T-065-3
    type: mcq
    prompt: {en: "What does a pre-chorus usually do at its end?", sr: "Šta predrefren obično radi na svom kraju?"}
    options:
      - {en: "Stops on V (or IV), so the chorus feels like an arrival", sr: "Stane na V (ili IV), da refren zvuči kao dolazak"}
      - {en: "Cadences on I", sr: "Kadencira na I"}
      - {en: "Modulates to the relative minor", sr: "Modulira u paralelni mol"}
    answer: 0
  - id: T-065-4
    type: mcq
    prompt: {en: "Listen: a verse (4 chords) and then the chorus. In C major, which chord does the chorus start on?", sr: "Slušaj: strofa (4 akorda), pa refren. U C-duru, na kom akordu počinje refren?"}
    options: ["IV", "I", "vi", "V"]
    answer: 0
    play: {mode: chords, tempo: 100, chords: [[A2, C4, E4, A4], [F2, C4, F4, A4], [C3, C4, E4, G4], [G2, B3, D4, G4], [F3, C5, F5, A5], [G3, B4, D5, G5], [C3, C5, E5, G5], [C3, C5, E5, G5]], durations: [4, 4, 4, 4, 4, 4, 4, 4]}
    checks:
      - numeral: {key: C, is: vi, notes: [A2, C4, E4, A4]}
      - numeral: {key: C, is: IV, notes: [F3, C5, F5, A5]}
      - numeral: {key: C, is: V, notes: [G3, B4, D5, G5]}
  - id: T-065-5
    type: mcq
    prompt: {en: "Listen: the chorus, a short bridge, and the chorus again. What happens to the last chorus?", sr: "Slušaj: refren, kratak most i ponovo refren. Šta se dešava sa poslednjim refrenom?"}
    options:
      - {en: "It is lifted a whole step, prepared by the new key's V7", sr: "Podignut je za ceo stepen, pripremljen akordom V7 novog tonaliteta"}
      - {en: "It stays in the same key", sr: "Ostaje u istom tonalitetu"}
      - {en: "It moves to the relative minor", sr: "Prelazi u paralelni mol"}
      - {en: "It is lifted a half step, abruptly", sr: "Podignut je za polustepen, naglo"}
    answer: 0
