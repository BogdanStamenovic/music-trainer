      - numeral: {key: D, is: V, notes: [A2, C#4, E4, A4]}
      - numeral: {key: D, is: vi, notes: [B2, D4, F#4, B4]}
  - id: T-065-6
    type: mcq
    prompt: {en: "Where does the bridge usually come in a verse–chorus song, and how often?", sr: "Gde most obično dolazi u pesmi strofa–refren i koliko puta?"}
    options:
      - {en: "Once, after the second chorus", sr: "Jednom, posle drugog refrena"}
      - {en: "Between every verse and chorus", sr: "Između svake strofe i refrena"}
      - {en: "At the start, as the intro", sr: "Na početku, kao uvod"}
