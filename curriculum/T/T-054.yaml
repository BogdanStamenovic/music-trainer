  - id: T-054-5
    type: mcq
    prompt: {en: "A piece in G major has modulated to D major. What happens to the C major chord of G major?", sr: "Komad u G-duru je modulirao u D-dur. Šta se dešava sa C-dur akordom iz G-dura?"}
    options:
      - {en: "is no longer diatonic: D major has C♯", sr: "više nije na stupnjevima: D-dur ima Cis"}
      - {en: "is IV in D major", sr: "je IV u D-duru"}
      - {en: "is the pivot", sr: "je akord-most"}
    answer: 0
    checks:
      - scale: {tonic: D, type: major, is: [D, E, F#, G, A, B, C#]}
