      - chord: {notes: [E3, G3, C4], root: C, quality: maj, inversion: 1}
  - id: T-049-6
    type: mcq
    prompt: {en: "G major: the soprano has C and the bass has A under it. Which chord is that?", sr: "G-dur: sopran ima C, a bas ispod njega A. Koji je to akord?"}
    options: ["ii (A C E)", "IV (C E G)", {en: "vi (E G B)", sr: "vi (E G H)"}, {en: "V (D F♯ A)", sr: "V (D Fis A)"}]
    answer: 0
