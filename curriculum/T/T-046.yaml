    type: mcq
    prompt: {en: "In C major a C♯ appears in a chord. Which chord is most likely being tonicized?", sr: "U C-duru se u akordu pojavi Cis. Koji akord se najverovatnije tonikalizuje?"}
    options:
      - {en: "ii (D minor)", sr: "ii (d-mol)"}
      - {en: "vi (A minor)", sr: "vi (a-mol)"}
      - {en: "V (G major)", sr: "V (G-dur)"}
      - {en: "IV (F major)", sr: "IV (F-dur)"}
    answer: 0
    checks:
      - interval: {from: C#4, to: D4, is: m2}
      - chord: {notes: [A3, C#4, E4], root: A, quality: maj}
