id: T-046
track: T
order: 46
prereqs: [T-045]
title: {en: "Spotting tonicization: accidentals as clues", sr: "Prepoznavanje tonikalizacije: predznaci kao tragovi"}
minutes: 12
tags: [harmony, chromatic, analysis]
explain:
  en: |
    When you read a piece, an accidental that is not in the key signature is the fastest way to find a tonicization. Two questions:

    1. **Raised note?** (♯, or ♮ on a flat) It is probably a **temporary leading tone**. The target's root is a **half step above** it.
    2. **Lowered note?** (♭, or ♮ on a sharp) It is probably a **7th falling** to its target, most often the 7th of **V7/IV**.

    Then confirm with the chord around it: a major triad or dominant 7th a **5th above** the target (V/X), or a diminished chord a **half step below** it (vii°/X), followed by the target.

    | accidental in C major | temporary leading tone of | likely chord | target |
    |---|---|---|---|
    | F♯ | G | V/V, vii°/V | V |
    | C♯ | D | V/ii | ii |
    | G♯ | A | V/vi | vi |
    | D♯ | E | V/iii | iii |
    | B♭ | (7th of C7) | V7/IV | IV |

    Two cautions:
    - **In minor, the raised 7th is not a tonicization.** G♯ in A minor is just the normal leading tone of V and vii°7; an ascending F♯ can be melodic minor. Look for accidentals *beyond* those.
    - A chromatic **passing or neighbour tone** (a quick note on a weak beat) is decoration, not a new chord. Tonicization needs a chord.

    ```abc
    X:1
    M:4/4
    L:1/4
    K:G
    V:1
    B2 c2 | ^c2 d2 | B c A2 | G4 |]
    V:2 clef=bass
    G,2 E,2 | A,2 D,2 | G,, A,, D,2 | G,,4 |]
    ```

    G major: in bar 2 the C♯ over A is the leading tone of D, so A C♯ (E) is V/V, resolving to V.
  sr: |
    Kad čitaš kompoziciju, predznak koga nema u predznaku tonaliteta je najbrži put do tonikalizacije. Dva pitanja:

    1. **Povišen ton?** (♯, ili ♮ na sniženom tonu) Verovatno je **privremena vođica**. Osnovni ton cilja je **polustepen iznad** njega.
    2. **Snižen ton?** (♭, ili ♮ na povišenom tonu) Verovatno je **septima koja silazi** ka cilju, najčešće septima od **V7/IV**.

    Zatim potvrdi akordom oko njega: durski trozvuk ili dominantni septakord **kvintu iznad** cilja (V/X), ili smanjeni akord **polustepen ispod** cilja (vii°/X), a posle toga cilj.

    | predznak u C-duru | privremena vođica ka | verovatan akord | cilj |
    |---|---|---|---|
    | Fis | G | V/V, vii°/V | V |
    | Cis | D | V/ii | ii |
    | Gis | A | V/vi | vi |
    | Dis | E | V/iii | iii |
    | B | (septima C7) | V7/IV | IV |

    Dva upozorenja:
    - **U molu povišeni 7. stupanj nije tonikalizacija.** Gis u a-molu je obična vođica u V i vii°7; Fis naviše može biti melodijski mol. Traži predznake *pored* tih.
    - Hromatska **prolaznica ili skretnica** (brz ton na slaboj dobi) je ukras, ne novi akord. Za tonikalizaciju je potreban akord.

    ```abc
    X:1
    M:4/4
    L:1/4
    K:G
    V:1
    B2 c2 | ^c2 d2 | B c A2 | G4 |]
    V:2 clef=bass
    G,2 E,2 | A,2 D,2 | G,, A,, D,2 | G,,4 |]
    ```

    G-dur: u 2. taktu Cis nad A je vođica ka D, pa je A Cis (E) V/V koja se razrešava u V.
