  - id: T-057-6
    type: mcq
    prompt: {en: "A piece in G major reaches D major through the E minor chord: G: vi = D: ii. Which type of modulation is that?", sr: "Komad u G-duru stiže u D-dur preko e-mol akorda, G: vi = D: ii. Koja je to vrsta modulacije?"}
    options:
      - {en: "Diatonic (dijatonska): the pivot is diatonic in both keys", sr: "Dijatonska: most je na stupnjevima oba tonaliteta"}
      - {en: "Chromatic (hromatska)", sr: "Hromatska"}
      - {en: "Enharmonic (enharmonska)", sr: "Enharmonska"}
      - {en: "Direct (frazna)", sr: "Direktna (frazna)"}
    answer: 0
    checks:
      - numeral: {key: G, is: vi, notes: [E4, G4, B4]}
      - numeral: {key: D, is: ii, notes: [E4, G4, B4]}
  - id: T-057-7
    type: mcq
    prompt: {en: "F major chord (F A C) becomes F A♭ C, then the music cadences in C minor. What type of modulation?", sr: "F-dur akord (F A C) postaje F As C, a zatim muzika kadencira u c-molu. Koja vrsta modulacije?"}
    options:
      - {en: "Chromatic: A → A♭ on the same letter", sr: "Hromatska: A → As na istom slovu"}
      - {en: "Diatonic", sr: "Dijatonska"}
      - {en: "Enharmonic", sr: "Enharmonska"}
    answer: 0
