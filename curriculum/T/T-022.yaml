id: T-022
track: T
order: 22
prereqs: [T-021]
title: {en: "Diatonic seventh chords in major (Imaj7 ii7 iii7 IVmaj7 V7 vi7 viiø7)", sr: "Septakordi na stupnjevima dura (Imaj7 ii7 iii7 IVmaj7 V7 vi7 viiø7)"}
minutes: 14
tags: [chords, harmony]
explain:
  en: |
    Stack one more scale third on **every** diatonic triad and you get seven seventh chords. Only **four types** come out:

    | type | triad + 7th | symbol | where in major |
    |---|---|---|---|
    | major seventh | major + **major** 7th | Cmaj7 | **Imaj7, IVmaj7** |
    | dominant seventh | major + **minor** 7th | G7 | **V7** only |
    | minor seventh | minor + minor 7th | Dm7 | **ii7, iii7, vi7** |
    | half-diminished | diminished + minor 7th | Bm7♭5 = Bø7 | **viiø7** |

    In C major: Cmaj7 (C E G B), Dm7, Em7, Fmaj7, G7, Am7, Bø7 (B D F A).
    The pattern **maj7 m7 m7 maj7 7 m7 ø7** is the same in every major key, exactly like I ii iii IV V vi vii° for triads.

    Why it matters: this is the default harmony of jazz, soul, R&B and a lot of pop; a "plain" I–vi–ii–V becomes Imaj7–vi7–ii7–V7.
    Ear tip: maj7 sounds soft and dreamy (the 7th is a half step below the octave), m7 mellow, 7 restless, ø7 dark and unresolved.

    ```abc
    X:1
    L:1/2
    K:C
    "Imaj7"[CEGB] "ii7"[DFAc] "iii7"[EGBd] "IVmaj7"[FAce] | "V7"[GBdf] "vi7"[Aceg] "viiø7"[Bdfa] "Imaj7"[cegb] |]
    ```
  sr: |
    Dodaj još jednu tercu iz lestvice na **svaki** trozvuk i dobijaš sedam septakorda. Ispadaju samo **četiri vrste**:

    | vrsta | trozvuk + septima | oznaka | gde u duru |
    |---|---|---|---|
    | veliki durski septakord | durski + **velika** septima | Cmaj7 | **Imaj7, IVmaj7** |
    | dominantni septakord | durski + **mala** septima | G7 | samo **V7** |
    | mali molski septakord | molski + mala septima | Dm7 | **ii7, iii7, vi7** |
    | polusmanjeni septakord | smanjeni + mala septima | Hm7♭5 = Hø7 | **viiø7** |

    U C-duru: Cmaj7 (C E G H), Dm7, Em7, Fmaj7, G7, Am7, Hø7 (H D F A).
    Raspored **maj7 m7 m7 maj7 7 m7 ø7** isti je u svakom duru, tačno kao I ii iii IV V vi vii° kod trozvuka.

    Zašto je važno: to je osnovna harmonija džeza, soula, R&B-ja i dobrog dela popa; „obično" I–vi–ii–V postaje Imaj7–vi7–ii7–V7.
    Za uho: maj7 zvuči meko i sanjivo (septima je polustepen ispod oktave), m7 toplo, 7 nemirno, ø7 tamno i nerazrešeno.

    ```abc
    X:1
    L:1/2
    K:C
    "Imaj7"[CEGB] "ii7"[DFAc] "iii7"[EGBd] "IVmaj7"[FAce] | "V7"[GBdf] "vi7"[Aceg] "viiø7"[Bdfa] "Imaj7"[cegb] |]
    ```
