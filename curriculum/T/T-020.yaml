id: T-020
track: T
order: 20
prereqs: [T-019]
title: {en: "The dominant seventh chord (V7) and its resolution", sr: "Dominantni septakord (V7) i njegovo razrešenje"}
minutes: 13
tags: [chords, harmony]
explain:
  en: |
    Add one more third on top of V and you get the **dominant seventh**, **V7**: a major triad plus a **minor 7th** above the root.
    In C major: G–B–D + **F** = G7. The new note is scale degree 4.

    Why it pulls so hard: B (the 3rd, leading tone) and F (the 7th) form a **tritone** (diminished 5th), the most unstable interval in the key.
    It resolves by both notes moving a **half step** inward or outward:

    - the **3rd** (leading tone) goes **up** to the tonic: B → C
    - the **7th** goes **down by step**: F → E

    The tritone B–F becomes the third C–E: tension into rest. That is the sound of almost every final cadence from Bach to the Beatles.

    In minor, V7 uses the raised 7th: in A minor, **E–G♯–B–D**.

    ```abc
    X:1
    L:1/2
    K:C
    "V7"[G,B,F] "I"[C,CE] |]
    ```

    (Root, 3rd and 7th only; the 5th is often left out. Bass G → C, B up to C, F down to E.)
  sr: |
    Dodaj još jednu tercu na V i dobijaš **dominantni septakord**, **V7** (D7): durski trozvuk plus **mala septima** od osnovnog tona.
    U C-duru: G–H–D + **F** = G7. Novi ton je IV stupanj.

    Zašto toliko vuče: H (terca, vođica) i F (septima) grade **tritonus** (smanjenu kvintu), najnestabilniji interval u tonalitetu.
    Razrešava se tako što oba tona idu **polustepenom**:

    - **terca** (vođica) ide **naviše** na toniku: H → C
    - **septima** ide **naniže za stupanj**: F → E

    Tritonus H–F postaje terca C–E: napetost prelazi u mir. To je zvuk skoro svake završne kadence od Baha do Bitlsa.

    U molu V7 koristi povišeni VII stupanj: u a-molu **E–Gis–H–D**.

    ```abc
    X:1
    L:1/2
    K:C
    "V7"[G,B,F] "I"[C,CE] |]
    ```

    (Samo osnovni ton, terca i septima; kvinta se često izostavlja. Bas G → C, H naviše na C, F naniže na E.)
