id: T-007
track: T
order: 7
prereqs: [T-006]
title: {en: "The major scale and scale degrees", sr: "Durska lestvica i stupnjevi lestvice"}
minutes: 13
tags: [scales]
explain:
  en: |
    Play C to C on white keys: that is **C major**. Its steps are

    **W W H W W W H** (W = whole step, H = half step)

    The half steps fall between degrees **3–4** and **7–8** (E–F and B–C in C major).
    Any note can be the start (**tonic**): keep the pattern, and use **every letter exactly once**.
    D major: D E F♯ G A B C♯ D. It must be F♯, not G♭, because G is already taken.

    Each degree has a number and a name:

    | degree | name |
    |---|---|
    | 1 | tonic |
    | 2 | supertonic |
    | 3 | mediant |
    | 4 | subdominant |
    | 5 | dominant |
    | 6 | submediant |
    | 7 | leading tone (it "leads" up a half step to the tonic) |

    Tonic, subdominant and dominant (1, 4, 5) are the pillars; you will build chords on them in lesson 14.

    ```abc
    X:1
    L:1/4
    K:D clef=treble
    D E F G | A B c d |]
    ```
  sr: |
    Odsviraj od C do C po belim dirkama: to je **C-dur**. Njegovi koraci su

    **C C P C C C P** (C = ceo stepen, P = polustepen)

    Polustepeni su između **3. i 4.** i **7. i 8.** stupnja (E–F i H–C u C-duru).
    Svaki ton može biti početni (**tonika**): zadrži raspored i upotrebi **svako ime tačno jednom**.
    D-dur: D E Fis G A H Cis D. Mora biti Fis, a ne Ges, jer je G već zauzet.

    Svaki stupanj ima broj i naziv:

    | stupanj | naziv |
    |---|---|
    | I | tonika |
    | II | supertonika |
    | III | medijanta (gornja medijanta) |
    | IV | subdominanta |
    | V | dominanta |
    | VI | submedijanta (donja medijanta) |
    | VII | vođica (polustepenom „vodi" naviše ka tonici) |

    Tonika, subdominanta i dominanta (I, IV, V) su stubovi; na njima ćeš graditi akorde u 14. lekciji.

    ```abc
    X:1
    L:1/4
    K:D clef=treble
    D E F G | A B c d |]
    ```
