      - numeral: {key: D, is: I, notes: [D3, D4, F#4, A4]}
      - numeral: {key: D, is: vi, notes: [B2, D4, F#4, B4]}
      - numeral: {key: D, is: IV, notes: [G2, D4, G4, B4]}
  - id: T-056-6
    type: midi-play
    prompt: {en: "Play the lift: C: V7 – I, then D: V7 – I (two beats each, any octave). Feel C♯ pull to D.", sr: "Odsviraj podizanje: C: V7 – I, pa D: V7 – I (po dve dobe, bilo koja oktava). Oseti kako Cis vuče ka D."}
    mode: chords
    octave: any
