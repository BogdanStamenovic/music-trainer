  - id: T-029-5
    type: mcq
    prompt: {en: "Over the C chord: how many non-chord tones are in this bar?", sr: "Nad akordom C: koliko vanakordskih tonova ima u ovom taktu?"}
    abc: |
      X:1
      M:4/4
      L:1/4
      K:C
      "C"c B A G |]
    options: ["0", "1", "2", "3"]
    answer: 2
    checks:
      - chord: {notes: [G4, C5, E5], root: C, quality: maj, inversion: 2}
      - interval: {from: G4, to: C5, is: P4}
  - id: T-029-6
    type: midi-play
    prompt: {en: "Over a C chord, connect the chord tones C, E, G with passing tones: play C D E F G (one octave from middle C).", sr: "Nad C akordom poveži akordske tonove C, E, G prolaznicama: odsviraj C D E F G (od prvog C)."}
    mode: sequence
    expect: [C4, D4, E4, F4, G4]
    checks:
      - interval: {from: C4, to: E4, is: M3}
      - interval: {from: E4, to: G4, is: m3}
  - id: T-029-7
    type: midi-play
    prompt: {en: "In G major, decorate G with an upper and a lower neighbor: G A G F♯ G (from G above middle C).", sr: "U G-duru ukrasi G gornjom i donjom skretnicom: G A G Fis G (od G iznad prvog C)."}
    mode: sequence
    expect: [G4, A4, G4, F#4, G4]
    checks:
      - interval: {from: G4, to: A4, is: M2}
      - interval: {from: F#4, to: G4, is: m2}
      - scale: {tonic: G, type: major, is: [G, A, B, C, D, E, F#]}
