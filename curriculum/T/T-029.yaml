id: T-029
track: T
order: 29
prereqs: [T-028]
title: {en: "Non-chord tones I: passing and neighbor tones", sr: "Vanakordski tonovi I: prolaznica i skretnica"}
minutes: 12
tags: [harmony, melody]
explain:
  en: |
    Melodies are not made only of chord tones. A **non-chord tone** is a melody note that does not belong to the chord sounding under it.
    The two most common ones are simple, usually sit on a **weak** beat, and move **by step**:

    - **Passing tone**: fills the gap between two *different* chord tones, stepwise, in one direction. Over C: E **F** G, or C **D** E.
    - **Neighbor tone**: steps away from a chord tone and comes back to the *same* one. Upper neighbor G **A** G; lower neighbor G **F** G (over F major: A **G** A).

    How to tell them apart: look at the notes on either side. Different chord tones, same direction → passing. Same chord tone on both sides → neighbor.
    Why it matters: when you harmonize a melody, only the chord tones decide the chord; passing and neighbor notes can be ignored. When you improvise, chord tones on the beat with passing tones between them is the simplest way to sound "inside" the harmony.

    ```abc
    X:1
    M:4/4
    L:1/4
    K:C
    "C"E "^P"F G2 | "C"G "^N"A G2 | "F"A "^N"G A2 | "Am"c "^P"B A2 |]
    ```

    P = passing tone, N = neighbor tone.
  sr: |
    Melodije nisu napravljene samo od akordskih tonova. **Vanakordski ton** je ton melodije koji ne pripada akordu koji zvuči ispod njega.
    Dva najčešća su jednostavna, obično na **lakoj** dobi, i kreću se **za stupanj**:

    - **Prolaznica**: popunjava razmak između dva *različita* akordska tona, za stupanj, u jednom smeru. Nad C: E **F** G, ili C **D** E.
    - **Skretnica**: odlazi za stupanj od akordskog tona i vraća se na *isti* ton. Gornja skretnica G **A** G; donja G **F** G (nad F-durom: A **G** A).

    Kako ih razlikovati: pogledaj tonove sa obe strane. Različiti akordski tonovi, isti smer → prolaznica. Isti akordski ton sa obe strane → skretnica.
    Zašto je važno: kad harmonizuješ melodiju, akord određuju samo akordski tonovi; prolaznice i skretnice možeš zanemariti. Kad improvizuješ, akordski tonovi na dobi i prolaznice između njih su najjednostavniji način da zvučiš „unutar" harmonije.

    ```abc
    X:1
    M:4/4
    L:1/4
    K:C
    "C"E "^P"F G2 | "C"G "^S"A G2 | "F"A "^S"G A2 | "Am"c "^P"B A2 |]
    ```

    P = prolaznica, S = skretnica.
exercises:
  - id: T-029-1
    type: mcq
    prompt: {en: "Over the C chord, the F is a…", sr: "Nad akordom C, ton F je…"}
    abc: |
      X:1
      M:4/4
      L:1/4
      K:C
      "C"E F G2 |]
    options:
      - {en: "passing tone", sr: "prolaznica"}
      - {en: "neighbor tone", sr: "skretnica"}
      - {en: "chord tone", sr: "akordski ton"}
    answer: 0
    checks:
      - chord: {notes: [C4, E4, G4], root: C, quality: maj}
      - interval: {from: E4, to: F4, is: m2}
      - interval: {from: F4, to: G4, is: M2}
  - id: T-029-2
    type: mcq
    prompt: {en: "Over the C chord, the A is a…", sr: "Nad akordom C, ton A je…"}
    abc: |
      X:1
      M:4/4
      L:1/4
      K:C
      "C"G A G2 |]
    options:
      - {en: "passing tone", sr: "prolaznica"}
      - {en: "upper neighbor tone", sr: "gornja skretnica"}
      - {en: "lower neighbor tone", sr: "donja skretnica"}
      - {en: "chord tone", sr: "akordski ton"}
    answer: 1
    checks:
      - interval: {from: G4, to: A4, is: M2}
  - id: T-029-3
    type: mcq
    prompt: {en: "Over the F chord, the G is a…", sr: "Nad akordom F, ton G je…"}
    abc: |
      X:1
      M:4/4
      L:1/4
      K:C
      "F"A G A2 |]
    options:
      - {en: "passing tone", sr: "prolaznica"}
      - {en: "upper neighbor tone", sr: "gornja skretnica"}
      - {en: "lower neighbor tone", sr: "donja skretnica"}
      - {en: "chord tone", sr: "akordski ton"}
    answer: 2
    checks:
      - chord: {notes: [F4, A4, C5], root: F, quality: maj}
      - interval: {from: G4, to: A4, is: M2}
  - id: T-029-4
    type: mcq
    prompt: {en: "Over A minor, the B is a…", sr: "Nad a-mol akordom, ton H je…"}
    abc: |
      X:1
      M:4/4
      L:1/4
      K:C
      "Am"c B A2 |]
    options:
      - {en: "passing tone", sr: "prolaznica"}
      - {en: "neighbor tone", sr: "skretnica"}
      - {en: "chord tone", sr: "akordski ton"}
    answer: 0
    checks:
      - chord: {notes: [A4, C5, E5], root: A, quality: min}
      - interval: {from: B4, to: C5, is: m2}
