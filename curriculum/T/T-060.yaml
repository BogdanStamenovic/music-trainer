  - id: T-060-6
    type: mcq
    prompt: {en: "The music reaches B D F A♭ in C minor, then the same sound, written G♯ B D F, resolves to A minor. What is this?", sr: "Muzika stigne na H D F As u c-molu, a zatim se isti zvuk, zapisan kao Gis H D F, razreši u a-mol. Šta je ovo?"}
    options:
      - {en: "Enharmonic modulation (enharmonska modulacija)", sr: "Enharmonska modulacija"}
      - {en: "Chromatic modulation (hromatska)", sr: "Hromatska modulacija"}
