    type: generated
    count: 4
    prompt: {en: "Diminished 7th, dominant 7th, or the diminished 7th of V?", sr: "Smanjeni septakord, dominantni septakord ili smanjeni septakord dominante?"}
    gen: {kind: progression-ear, keys: [C, A, D], type: harmonic-minor, options: [["i", "iv", "vii°7", "i"], [i, iv, V7, i], ["i", "iv", "vii°7/V", V]], tempo: 60, smooth: true}
