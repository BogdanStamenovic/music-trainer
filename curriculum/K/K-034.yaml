id: K-034
track: K
order: 34
title: {en: "Lead sheet: melody in the right hand, chords in the left", sr: "Lead sheet: melodija u desnoj ruci, akordi u levoj"}
prereqs: [K-032, T-031]
minutes: 15
tags: [keys, lead-sheet, accompaniment, chord-symbols]
explain:
  en: |
    A **lead sheet** is how most songs are written down outside classical music: one staff
    with the melody, and chord symbols above it (T-031). There is no piano part; you make one.
    The most basic way to play it is **melody in the right hand, chords in the left**.

    ```abc
    X:1
    M:4/4
    L:1/4
    K:C
    "C"G c e d | "Am"c2 A2 | "F"A c f e | "G7"d2 B2 |
    "C"G c e g | "Am"a2 e2 | "Dm7"f d "G7"B G | "C"c4 |]
    ```

    **Left hand: compact voicings around C3.** Low enough to stay out of the melody's way,
    high enough not to sound muddy.

    | symbol | left hand | why |
    |---|---|---|
    | C | C3 E3 G3 | root-position triad |
    | Am | A2 C3 E3 | |
    | F | F2 A2 C3 | |
    | G7 | G2 F3 B3 | **shell**: root, 3rd, 7th; the 5th adds nothing |
    | Dm7 | D3 F3 C4 | shell |

    Shells (root–3rd–7th) are the standard left hand for seventh chords: three notes, the ones
    that define the chord, and they connect smoothly (Dm7 → G7: F stays, C moves to B).

    **Right hand: the melody, sung out.** It should be clearly louder than the left hand.
    Play the chord **on the beat where the symbol stands** and hold it until the next symbol;
    the melody moves on top. When two symbols share a bar (bar 7), each gets half the bar.

    **Reading order:** look at the chord symbol first, place the left hand, then read the
    melody. Your hand is on the next chord before the bar line, and the melody is just a line
    to read, which you already do fluently.
  sr: |
    **Lead sheet** (engl.; ponekad "lid šit" ili prosto "akordska partitura") je način na koji
    se većina pesama zapisuje van klasične muzike: jedan sistem sa melodijom, a iznad njega
    oznake akorda (T-031). Klavirske deonice nema; ti je praviš. Najosnovniji način sviranja
    je **melodija u desnoj ruci, akordi u levoj**.

    ```abc
    X:1
    M:4/4
    L:1/4
    K:C
    "C"G c e d | "Am"c2 A2 | "F"A c f e | "G7"d2 B2 |
    "C"G c e g | "Am"a2 e2 | "Dm7"f d "G7"B G | "C"c4 |]
    ```

    **Leva ruka: zbijeni rasporedi oko C3.** Dovoljno nisko da ne smeta melodiji, dovoljno
    visoko da ne zvuči mutno.

    | oznaka | leva ruka | zašto |
    |---|---|---|
    | C | C3 E3 G3 | kvintakord u osnovnom položaju |
    | Am | A2 C3 E3 | |
    | F | F2 A2 C3 | |
    | G7 | G2 F3 H3 | **"školjka"** (shell): osnovni ton, terca, septima; kvinta ne dodaje ništa |
    | Dm7 | D3 F3 C4 | školjka |

    Školjke (osnovni ton–terca–septima) su standardna leva ruka za septakorde: tri tona, baš ona
    koja određuju akord, i glatko se povezuju (Dm7 → G7: F ostaje, C ide na H).

    **Desna ruka: melodija, izražajno.** Treba da bude jasno glasnija od leve. Akord sviraj
    **na dobi iznad koje stoji oznaka** i drži ga do sledeće oznake; melodija se kreće iznad.
    Kad dve oznake dele takt (takt 7), svaka dobija pola takta.

    **Redosled čitanja:** prvo pogledaj oznaku akorda, postavi levu ruku, pa čitaj melodiju.
    Ruka ti je na sledećem akordu pre taktne crte, a melodija je samo linija za čitanje, što
    već tečno radiš.
exercises:
  - id: K-034-1
    type: mcq
    prompt: {en: "In a lead sheet, what does G7/B mean?", sr: "Šta u lead sheet-u znači G7/H (G7/B u engleskom zapisu)?"}
    options:
      - {en: "G7 with B in the bass", sr: "G7 sa H u basu"}
      - {en: "G7 followed by B", sr: "G7, a zatim H"}
      - {en: "G7 or B, the player chooses", sr: "G7 ili H, po izboru svirača"}
      - {en: "G7 with an added B♭", sr: "G7 sa dodatim B"}
    answer: 0
    checks:
      - chord: {notes: [B2, D3, F3, G3], root: G, quality: "7", inversion: 1}
  - id: K-034-2
    type: mcq
    prompt: {en: "Which left-hand voicing of Dm7 is a shell (root, 3rd, 7th)?", sr: "Koji raspored Dm7 u levoj ruci je školjka (osnovni ton, terca, septima)?"}
    options: ["D3 F3 C4", "D3 A3 C4", "D3 F3 A3", "F3 A3 C4"]
    answer: 0
    checks:
      - chord: {notes: [D3, F3, C4], root: D, quality: min7, inversion: 0}
      - interval: {from: D3, to: F3, is: m3}
      - interval: {from: D3, to: C4, is: m7}
  - id: K-034-3
    type: midi-play
    prompt: {en: "Left hand alone, the chords of the lead sheet: C – Am – F – G7 – C – Am – Dm7 G7 – C, voicings from the table, one bar each (bar 7 split), ♩=88.", sr: "Samo leva ruka, akordi iz lead sheet-a: C – Am – F – G7 – C – Am – Dm7 G7 – C, rasporedi iz tabele, po jedan takt (sedmi takt podeljen), ♩=88."}
