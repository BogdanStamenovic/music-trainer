    type: practice
    prompt: {en: "Make your own lead sheet: write the melody of \"Oda radosti\" (K-032) or \"Sjaj, sjaj, zvezdice\" with chord symbols above it, then play it melody-plus-left-hand. Then play it again with the left-hand pattern of your choice from K-025 or K-032 instead of held chords.", sr: "Napravi sopstveni lead sheet: zapiši melodiju \"Ode radosti\" (K-032) ili \"Sjaj, sjaj, zvezdice\" sa oznakama akorda iznad, pa je odsviraj kao melodiju sa levom rukom. Zatim je odsviraj ponovo sa obrascem leve ruke po izboru iz K-025 ili K-032 umesto držanih akorada."}
