id: K-001
track: K
order: 1
title: {en: "Play intervals above and below a note", sr: "Sviraj intervale iznad i ispod tona"}
prereqs: [T-006]
minutes: 11
tags: [keys, intervals]
explain:
  en: |
    Theory says "a perfect 5th above D"; your hand should answer before you finish counting.
    Each exercise names a starting note and an interval: play the start note, then the target.

    Fast routes on the keyboard (counting half steps is the slow fallback):

    | interval | shortcut |
    |---|---|
    | m2 / M2 | next key / skip one key |
    | m3 / M3 | 3 / 4 half steps; or: is the third of the minor / major chord on that note |
    | P4 / P5 | 5 / 7 half steps; on white keys always a P4 / P5 except **F–B** (tritone) and **B–F** |
    | m6 / M6 | an octave minus a M3 / minus a m3 |
    | m7 / M7 | an octave minus a whole step / minus a half step |
    | P8 | same letter, next octave |

    Below works the same way, mirrored. A 5th below G is C; a 4th below C is G.
  sr: |
    Teorija kaže „čista kvinta iznad D"; ruka treba da odgovori pre nego što završiš brojanje.
    Svaka vežba zada početni ton i interval: odsviraj početni ton, pa ciljni.

    Brzi putevi na klavijaturi (brojanje polustepena je spora rezerva):

    | interval | prečica |
    |---|---|
    | m2 / M2 | susedna dirka / preskoči jednu |
    | m3 / M3 | 3 / 4 polustepena; ili: terca molskog / durskog akorda na tom tonu |
    | P4 / P5 | 5 / 7 polustepena; na belim dirkama uvek čista kvarta / kvinta osim **F–H** (tritonus) i **H–F** |
    | m6 / M6 | oktava manje M3 / manje m3 |
    | m7 / M7 | oktava manje ceo stepen / manje polustepen |
    | P8 | isto ime, sledeća oktava |

    Naniže je isto, u ogledalu. Kvinta ispod G je C; kvarta ispod C je G.
