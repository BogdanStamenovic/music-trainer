  - id: K-044-5
    type: mcq
    prompt: {en: "A \"break\" before the chorus means…", sr: "\"Prekid\" pred refren znači…"}
    options:
      - {en: "stopping on beat 3 or 4 of the bar before, leaving a moment of silence", sr: "zaustavljanje na treću ili četvrtu dobu takta pre, uz trenutak tišine"}
      - {en: "slowing down for the whole last verse bar", sr: "usporavanje kroz ceo poslednji takt strofe"}
      - {en: "changing key for the chorus", sr: "promenu tonaliteta za refren"}
      - {en: "playing the chorus without the left hand", sr: "sviranje refrena bez leve ruke"}
    answer: 0
  - id: K-044-6
    type: practice
    prompt: {en: "The whole song form at ♩=84: verse (4 bars) twice, chorus (4 bars) twice, verse once, chorus twice. Use a build before the first chorus and a break before the last one. If you sing (V-062 works on verse in light voice, chorus in mix), hum or sing the top note of each right-hand chord in the chorus; otherwise invent a simple melody in the right hand for the verse.", sr: "Cela forma pesme, ♩=84: strofa (4 takta) dva puta, refren (4 takta) dva puta, strofa jednom, refren dva puta. Pred prvi refren upotrebi pojačavanje, a pred poslednji prekid. Ako pevaš (V-062 radi strofu lakim glasom, refren u miksu), pevuši ili pevaj gornji ton svakog akorda desne ruke u refrenu; inače izmisli jednostavnu melodiju za desnu ruku u strofi."}
    minutes: 5
