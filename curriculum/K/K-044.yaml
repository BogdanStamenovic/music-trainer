    type: midi-play
    prompt: {en: "The switch: the last verse bar (D, broken chords) straight into the first chorus bar (C, octaves + pulsed chords). Land beat 1 of the chorus with both hands exactly together. ♩=84.", sr: "Prelaz: poslednji takt strofe (D, razloženo) pravo u prvi takt refrena (C, oktave + akordi u pulsu). Prvu dobu refrena udari obema rukama tačno zajedno. ♩=84."}
