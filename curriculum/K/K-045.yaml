  - id: K-045-7
    type: practice
    prompt: {en: "Play i – V7/iv – iv – V7 – i in A minor as a slow tango: left hand on beats 1 and 3 (root, then 5th), right hand chords on the \"and\" of 2 and on 4. Then the same in E and D minor. Listen for the chromatic top line (C – C♯ – D in A minor) and bring it out.", sr: "Odsviraj i – V7/iv – iv – V7 – i u a-molu kao spori tango: leva ruka na prvu i treću dobu (osnovni ton, pa kvinta), desna akordi na \"i\" posle druge i na četvrtu dobu. Zatim isto u e-molu i d-molu. Osluškuj hromatsku gornju liniju (C – Cis – D u a-molu) i istakni je."}
    minutes: 4
