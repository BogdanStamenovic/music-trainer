    type: generated
    prompt: {en: "i – V7/iv – iv – V7 – i in minor keys round the circle, voice-led", sr: "i – V7/iv – iv – V7 – i u molskim tonalitetima po kvintnom krugu, glatko vođenje glasova"}
    count: 4
    gen: {kind: progression, keys: [A, E, B, D, G, C], type: harmonic-minor, numerals: [i, V7/iv, iv, V7, i], tempo: 66, smooth: true}
  - id: K-045-6
