    prompt: {en: "Arpeggio from the 3rd: over each chord play 3–5–7–9 (Dm7: F A C E; G7: B D F A; Cmaj7: E G B D). It sounds more like jazz than root-up arpeggios, and every bar starts on a guide tone. Then improvise, starting every bar this way and leaving the rest free.", sr: "Arpeđo od terce: preko svakog akorda sviraj 3–5–7–9 (Dm7: F A C E; G7: H D F A; Cmaj7: E G H D). Zvuči više kao džez nego arpeđa od osnovnog tona, i svaki takt počinje ključnim tonom. Zatim improvizuj tako da svaki takt počne ovako, a ostatak je slobodan."}
    minutes: 4
