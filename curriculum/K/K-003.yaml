id: K-003
track: K
order: 3
title: {en: "Major scales with sharps: A, E, B", sr: "Durske lestvice sa povisilicama: A, E, H"}
prereqs: [K-002, T-008]
minutes: 13
tags: [keys, scales, technique]
explain:
  en: |
    Each new sharp key adds one sharp: G has F♯, D adds C♯, **A adds G♯**, **E adds D♯**,
    **B adds A♯**. The added sharp is always the 7th degree, the note just below the tonic.

    | key | sharps | right hand | left hand (going up) |
    |---|---|---|---|
    | A | F♯ C♯ G♯ | 1 2 3 1 2 3 4 5 | 5 4 3 2 1 3 2 1 |
    | E | F♯ C♯ G♯ D♯ | 1 2 3 1 2 3 4 5 | 5 4 3 2 1 3 2 1 |
    | B | F♯ C♯ G♯ D♯ A♯ | 1 2 3 1 2 3 4 5 | **4 3 2 1 4 3 2 1** |

    - A and E use the C-major fingering in both hands. The thumb always lands on a white key.
    - **B major, left hand** is different: start with finger 4 on B, thumb on E, then 4 on F♯.
      The thumb stays off the black keys.
    - Before playing, say the sharps to yourself. If you know which keys are black, the hand
      shape follows.
  sr: |
    Svaki novi tonalitet sa povisilicama dodaje jednu: G-dur ima Fis, D-dur dodaje Cis,
    **A-dur dodaje Gis**, **E-dur dodaje Dis**, **H-dur dodaje Ais**. Dodata povisilica je uvek
    7. stupanj (vođica), ton odmah ispod tonike.

    | tonalitet | povisilice | desna ruka | leva ruka (naviše) |
    |---|---|---|---|
    | A-dur | Fis Cis Gis | 1 2 3 1 2 3 4 5 | 5 4 3 2 1 3 2 1 |
    | E-dur | Fis Cis Gis Dis | 1 2 3 1 2 3 4 5 | 5 4 3 2 1 3 2 1 |
    | H-dur | Fis Cis Gis Dis Ais | 1 2 3 1 2 3 4 5 | **4 3 2 1 4 3 2 1** |

    - A-dur i E-dur imaju prstored kao C-dur u obe ruke. Palac uvek pada na belu dirku.
    - **H-dur, leva ruka** je drugačija: počni četvrtim prstom na H, palac na E, pa opet 4 na Fis.
      Palac ostaje van crnih dirki.
    - Pre sviranja izgovori povisilice u sebi. Kad znaš koje su dirke crne, oblik ruke sledi.
