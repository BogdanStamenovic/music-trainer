    gen: {kind: scale-build, types: [major], tonics: [A, E, B], answer: play}
    checks:
      - scale: {tonic: A, type: major, is: [A, B, "C#", D, E, "F#", "G#"]}
      - scale: {tonic: E, type: major, is: [E, "F#", "G#", A, B, "C#", "D#"]}
      - scale: {tonic: B, type: major, is: [B, "C#", "D#", E, "F#", "G#", "A#"]}
      - keysig: {key: G, is: 1}
      - keysig: {key: D, is: 2}
      - keysig: {key: A, is: 3}
      - keysig: {key: E, is: 4}
      - keysig: {key: B, is: 5}
