  - id: K-036-8
    type: practice
    prompt: {en: "A chain round the circle: C → G → D → A, each time using the new key's vi as the next pivot (C: Am–D7–G, then G: Em–A7–D, then D: Bm–E7–A). Keep one hand shape and let the voices slide. Stop when you can do it without pausing at the pivots.", sr: "Lanac po kvintnom krugu: C → G → D → A, svaki put vi novog tonaliteta je sledeći most (C: Am–D7–G, zatim G: Em–A7–D, zatim D: Hm–E7–A). Zadrži jedan oblik ruke i pusti glasove da klize. Završi kad uspeš bez zastajanja na mostovima."}
