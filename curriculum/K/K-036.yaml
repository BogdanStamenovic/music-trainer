id: K-036
track: K
order: 36
title: {en: "Modulating cadences in 4 keys", sr: "Modulirajuće kadence u 4 tonaliteta"}
prereqs: [K-035]
minutes: 14
tags: [keys, harmony, modulation, transposition]
explain:
  en: |
    The two modulations from K-035 are patterns, so they transpose like any cadence. Learn
    them by **function**, not by note names:

    | to the dominant | I | IV | vi = **ii** | **V7** | **I** |
    |---|---|---|---|---|---|
    | to the relative minor | I | IV | ii = **iv** | **V7** | **i** |

    The bold numerals belong to the new key. Written in the *old* key, the same chords are
    I – IV – vi – V7/V – V and I – IV – ii – V7/vi – vi: the new key's V7 is a secondary
    dominant that does not go away. That is the difference between tonicization (one chord)
    and modulation (a cadence, and then you stay).

    **Where is the new note?**

    - To the dominant: the **raised 4th degree** of the old key (F♯ in C, B♮ in F, G♯ in D,
      E♮ in B♭). It is the leading tone of the new key, and it sits in the 3rd of V7.
    - To the relative minor: the **raised 5th degree** of the old key (G♯ in C, D♯ in G,
      C♯ in F). It is the leading tone of the minor key, the 3rd of its V7.

    The hand shapes are exactly the K-035 ones moved up or down. F → C, for example:

    ```abc
    X:1
    M:4/4
    L:1/2
    K:F
    "F"[F,,CFA] "Bb"[B,,DFB] | "Dm"[D,DFA] "G7"[G,,DF=B] | "C"[C,G,CEc]2 |]
    ```

    In F the B is flat; B♮ in G7 is the first note outside F major, exactly where F♯ was in
    C → G. Say the new note out loud before you play each key; after four keys you will see
    it before you read it.
  sr: |
    Dve modulacije iz K-035 su obrasci, pa se transponuju kao svaka kadenca. Uči ih po
    **funkciji**, ne po imenima tonova:

    | u dominantu | I | IV | vi = **ii** | **V7** | **I** |
    |---|---|---|---|---|---|
    | u paralelni mol | I | IV | ii = **iv** | **V7** | **i** |

    Podebljani brojevi pripadaju novom tonalitetu. Zapisani u *starom* tonalitetu, isti
    akordi su I – IV – vi – V7/V – V i I – IV – ii – V7/vi – vi: V7 novog tonaliteta je
    sporedna dominanta koja ne odlazi. To je razlika između tonikalizacije (jedan akord) i
    modulacije (kadenca, i zatim ostaješ).

    **Gde je novi ton?**

    - U dominantu: **povišeni 4. stupanj** starog tonaliteta (Fis u C-duru, H u F-duru, Gis
      u D-duru, E u B-duru). To je vođica novog tonaliteta, i nalazi se u terci od V7.
    - U paralelni mol: **povišeni 5. stupanj** starog tonaliteta (Gis u C-duru, Dis u G-duru,
      Cis u F-duru). To je vođica molskog tonaliteta, terca njegovog V7.

    Oblici ruku su tačno oni iz K-035, pomereni naviše ili naniže. Na primer F → C:

    ```abc
    X:1
    M:4/4
    L:1/2
    K:F
    "F"[F,,CFA] "Bb"[B,,DFB] | "Dm"[D,DFA] "G7"[G,,DF=B] | "C"[C,G,CEc]2 |]
    ```

    U F-duru je B snižen; H u G7 je prvi ton van F-dura, tačno tamo gde je bio Fis u C → G.
    Izgovori novi ton naglas pre nego što odsviraš svaki tonalitet; posle četiri tonaliteta
    videćeš ga pre nego što ga pročitaš.
exercises:
  - id: K-036-1
    type: mcq
    prompt: {en: "Modulating from B♭ major to F major (its dominant). Which note is the first one outside B♭ major?", sr: "Modulacija iz B-dura u F-dur (njegovu dominantu). Koji ton je prvi van B-dura?"}
    options: ["E", "Eb", "F#", "C#"]
    answer: 0
    checks:
      - scale: {tonic: Bb, type: major, is: [Bb, C, D, Eb, F, G, A]}
      - scale: {tonic: F, type: major, is: [F, G, A, Bb, C, D, E]}
      - numeral: {key: F, is: "V7", notes: [C4, E4, G4, Bb4]}
      - numeral: {key: Bb, is: "V7/V", notes: [C4, E4, G4, Bb4]}
  - id: K-036-2
    type: mcq
    prompt: {en: "G major to E minor (relative minor): the chord that confirms E minor is…", sr: "G-dur u e-mol (paralelni mol): akord koji potvrđuje e-mol je…"}
    options:
      - {en: "B7 (B D♯ F♯ A), V7 in E minor", sr: "H7 (H Dis Fis A), V7 u e-molu"}
      - {en: "D7 (D F♯ A C), V7 in G", sr: "D7 (D Fis A C), V7 u G-duru"}
      - {en: "Bm (B D F♯), v in E minor", sr: "Hm (H D Fis), v u e-molu"}
      - {en: "Am (A C E), iv in E minor", sr: "Am (A C E), iv u e-molu"}
    answer: 0
    checks:
      - numeral: {key: E, type: harmonic-minor, is: "V7", notes: [B3, "D#4", "F#4", A4]}
      - numeral: {key: G, is: "V7/vi", notes: [B3, "D#4", "F#4", A4]}
      - numeral: {key: G, is: "V7", notes: [D4, "F#4", A4, C5]}
      - numeral: {key: E, type: natural-minor, is: "v", notes: [B3, D4, "F#4"]}
      - numeral: {key: E, type: harmonic-minor, is: "iv", notes: [A3, C4, E4]}
