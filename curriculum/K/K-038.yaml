id: K-038
track: K
order: 38
title: {en: "Diminished seventh chords: resolutions at the keys", sr: "Smanjeni septakordi: razrešenja za klavirom"}
prereqs: [T-060]
minutes: 15
tags: [keys, harmony, diminished, minor, voice-leading]
explain:
  en: |
    T-060 showed that a diminished seventh chord is built only of minor thirds, so it divides
    the octave into four equal parts and **any of its four notes can act as the root**. At the
    keyboard this means: one hand shape, four possible destinations.

    **The basic resolution, vii°7 – i in A minor.** G♯°7 = G♯ B D F. Every note has a
    tendency, and all four move by step:

    | voice | G♯°7 | → | Am |
    |---|---|---|---|
    | bass (root = leading tone) | G♯2 | up a half step | A2 |
    | 5th | D4 | down a step | C4 |
    | 7th | F4 | down a half step | E4 |
    | 3rd | B4 | up a step | C5 |

    The result is Am with a doubled 3rd (C4, C5). That is the textbook result here: the
    diminished 5th G♯–D **closes inwards** to a 3rd (A–C), the augmented 4th F–B **opens
    outwards** to a 6th (E–C), and that leaves two Cs.

    **Same keys, four keys.** Respell the same four piano keys with a different note as the
    leading tone, and the same sound resolves somewhere else:

    | bass note (leading tone) | spelled as | resolves to |
    |---|---|---|
    | G♯ | G♯ B D F | A minor |
    | B | B D F A♭ | C minor |
    | D | D F A♭ C♭ | E♭ minor |
    | E♯ (= F) | E♯ G♯ B D | F♯ minor |

    The four keys are a minor third apart (A, C, E♭, F♯): the same minor-third ladder the
    chord itself is built from. This is why composers love the chord for sudden modulations:
    the listener cannot know which of the four doors you will open.

    ```abc
    X:1
    M:4/4
    L:1/2
    K:C
    "G#°7"[^G,,DF=B] "Am"[A,,CEc] | "B°7"[B,,F_Ad] "Cm"[C,_EG_e] |]
    ```

    **In major keys** the same chord appears as vii°7/V: in C, F♯°7 (F♯ A C E♭) leans into G.
    Played between I and V, it makes the dominant arrive with extra weight.
  sr: |
    T-060 je pokazao da je smanjeni septakord sastavljen samo od malih terci, pa deli oktavu
    na četiri jednaka dela i **bilo koji od njegova četiri tona može biti osnovni**. Za
    klavirom to znači: jedan oblik ruke, četiri moguća cilja.

    **Osnovno razrešenje, vii°7 – i u a-molu.** Gis°7 = Gis H D F. Svaki ton ima težnju, i
    sva četiri se pomeraju korakom:

    | glas | Gis°7 | → | Am |
    |---|---|---|---|
    | bas (osnovni ton = vođica) | Gis2 | polustepen naviše | A2 |
    | kvinta | D4 | korak naniže | C4 |
    | septima | F4 | polustepen naniže | E4 |
    | terca | H4 | korak naviše | C5 |

    Rezultat je Am sa udvojenom tercom (C4, C5). To je ovde rezultat po pravilu: smanjena
    kvinta Gis–D se **zatvara ka unutra** u tercu (A–C), prekomerna kvarta F–H se **otvara ka
    spolja** u sekstu (E–C), i ostaju dva C.

    **Iste dirke, četiri tonaliteta.** Imenuj iste četiri dirke tako da je drugi ton vođica,
    i isti zvuk se razrešava negde drugde:

    | bas (vođica) | zapisano kao | razrešava se u |
    |---|---|---|
    | Gis | Gis H D F | a-mol |
    | H | H D F As | c-mol |
    | D | D F As Ces | es-mol |
    | Eis (= F) | Eis Gis H D | fis-mol |

    Četiri tonaliteta su udaljena malu tercu (A, C, Es, Fis): ista lestvica malih terci od
    koje je sagrađen i sam akord. Zato ga kompozitori vole za iznenadne modulacije: slušalac
    ne može znati koja od četiri vrata ćeš otvoriti.

    ```abc
    X:1
    M:4/4
    L:1/2
    K:C
    "G#°7"[^G,,DF=B] "Am"[A,,CEc] | "B°7"[B,,F_Ad] "Cm"[C,_EG_e] |]
    ```

    **U durskim tonalitetima** isti akord se javlja kao vii°7/V: u C-duru Fis°7 (Fis A C Es)
    se naslanja na G. Odsviran između I i V, čini da dominanta stigne sa dodatnom težinom.
