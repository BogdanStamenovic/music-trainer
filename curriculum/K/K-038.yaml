    prompt: {en: "G♯°7 (G♯ B D F) respelled with B as the leading tone is B D F A♭. Where does it resolve?", sr: "Gis°7 (Gis H D F) zapisan sa H kao vođicom je H D F As. Gde se razrešava?"}
    options:
      - {en: "C minor", sr: "c-mol"}
      - {en: "A minor", sr: "a-mol"}
      - {en: "B♭ minor", sr: "b-mol"}
      - {en: "E minor", sr: "e-mol"}
