  - id: K-031-1
    type: mcq
    prompt: {en: "C major. A melody has F♯ on a strong beat, followed by G. Which chord goes under the F♯?", sr: "C-dur. Melodija ima Fis na jakoj dobi, a zatim G. Koji akord ide ispod Fis?"}
    options: ["V7/V", "V7/ii", "V7/vi", "V7/IV"]
    answer: 0
    checks:
      - chord: {notes: [D4, "F#4", A4, C5], root: D, quality: "7"}
      - numeral: {key: C, is: "V7/V", notes: [D4, "F#4", A4, C5]}
      - semitones: {from: "F#4", to: G4, is: 1}
