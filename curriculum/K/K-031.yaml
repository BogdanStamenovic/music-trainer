id: K-031
track: K
order: 31
title: {en: "Harmonizing a melody with secondary dominants", sr: "Harmonizacija melodije sporednim dominantama"}
prereqs: [K-017, T-044]
minutes: 15
tags: [keys, harmony, harmonization, secondary-dominant, reharmonization]
explain:
  en: |
    In K-017 you harmonized melodies with I, IV and V. Secondary dominants (T-043, T-044) give
    you more colours for the same melody note, and they **point** at the next chord. Two ways
    to find one:

    **1. The melody has a chromatic note.** A note outside the key is usually the 3rd of a
    secondary dominant, the leading tone of the chord that follows (B♭ is the exception: it
    is the 7th of C7 and falls):

    | melody note in C | secondary dominant | goes to |
    |---|---|---|
    | F♯ | D7 = V7/V | G (V) |
    | C♯ | A7 = V7/ii | Dm (ii) |
    | G♯ | E7 = V7/vi | Am (vi) |
    | B♭ | C7 = V7/IV | F (IV) |

    **2. The melody is diatonic, but the next chord is a target.** Before any chord X, you may
    replace the chord with V7 of X, as long as the melody note belongs to it **and does not
    clash** with its chromatic note. Under a melody G you cannot use E7 (it has G♯ against
    your G), but you can use C7 (G is its 5th) or A7 (G is its 7th).

    "Sjaj, sjaj, zvezdice" (Twinkle, Twinkle), melody an octave up, with two secondary
    dominants:

    ```abc
    X:1
    M:4/4
    L:1/4
    K:C
    "C"c c "C7"g g | "F"a a "C"g2 | "F"f f "A7"e e | "Dm"d "G7"d "C"c2 |]
    ```

    - G G over **C7**: the B♭ makes C sound like a dominant, and the next bar lands on F (IV).
    - E E over **A7**: C♯ leads into D; the next chord is Dm (ii), then G7 and home. That gives
      a little chain, A7 → Dm → G7 → C: each chord is the dominant of the next.

    At the keyboard: the melody note is the **top** of the right hand, the root in the left,
    and the remaining chord tones in between, moved as little as possible. The chromatic
    note (B♭, C♯) should **resolve by a half step** in the next chord: B♭ down to A, C♯ up to D.
  sr: |
    U K-017 si harmonizovao melodije sa I, IV i V. Sporedne dominante (T-043, T-044) daju više
    boja za isti ton melodije, i **pokazuju** na sledeći akord. Dva načina da je nađeš:

    **1. Melodija ima hromatski ton.** Ton van tonaliteta je obično terca sekundarne
    dominante, vođica ka akordu koji sledi (B je izuzetak: to je septima od C7 i pada):

    | ton melodije u C-duru | sporedna dominanta | ide u |
    |---|---|---|
    | Fis | D7 = V7/V | G (V) |
    | Cis | A7 = V7/ii | Dm (ii) |
    | Gis | E7 = V7/vi | Am (vi) |
    | B | C7 = V7/IV | F (IV) |

    **2. Melodija je dijatonska, ali je sledeći akord cilj.** Pre bilo kog akorda X možeš da
    staviš V7 od X, pod uslovom da ton melodije pripada tom akordu **i da se ne sudara** sa
    njegovim hromatskim tonom. Ispod melodijskog G ne možeš da staviš E7 (ima Gis naspram
    tvog G), ali možeš C7 (G je kvinta) ili A7 (G je septima).

    "Sjaj, sjaj, zvezdice", melodija oktavu više, sa dve sporedne dominante:

    ```abc
    X:1
    M:4/4
    L:1/4
    K:C
    "C"c c "C7"g g | "F"a a "C"g2 | "F"f f "A7"e e | "Dm"d "G7"d "C"c2 |]
    ```

    - G G preko **C7**: B čini da C zvuči kao dominanta, a sledeći takt doskače na F (IV).
    - E E preko **A7**: Cis vodi u D; sledeći akord je Dm (ii), pa G7 i kući. To daje mali lanac
      A7 → Dm → G7 → C: svaki akord je dominanta sledećeg.

    Za klavirom: ton melodije je **gornji** ton desne ruke, osnovni ton u levoj, a ostali
    tonovi akorda između, pomereni što manje. Hromatski ton (B, Cis) treba da se **razreši za
    polustepen** u sledećem akordu: B naniže na A, Cis naviše na D.
