      - numeral: {key: C, is: "V7/vi", notes: [E4, "G#4", B4, D5]}
      - numeral: {key: C, is: "V7/IV", notes: [C4, E4, G4, Bb4]}
      - numeral: {key: C, is: "V7/ii", notes: [A3, "C#4", E4, G4]}
