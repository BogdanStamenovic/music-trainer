id: K-005
track: K
order: 5
title: {en: "Major and minor triads on all 12 roots", sr: "Durski i molski kvintakordi na svih 12 tonova"}
prereqs: [K-004, T-011]
minutes: 12
tags: [keys, chords]
explain:
  en: |
    Goal: any major or minor triad under your fingers **without spelling it first**. The fastest
    way is to know the **black/white shape** of each chord, bottom to top (● = black key, ○ = white key):

    | shape | major | minor |
    |---|---|---|
    | ○ ○ ○ | C, F, G | D, E, A |
    | ○ ● ○ | D, E, A | C, F, G |
    | ● ○ ● | D♭, E♭, A♭ | C♯, F♯, G♯ |
    | ● ● ● | F♯ | E♭ |
    | ● ○ ○ | B♭ | – |
    | ○ ● ● | B | – |
    | ● ● ○ | – | B♭ |
    | ○ ○ ● | – | B |

    The pairs are mirror images: C, F, G major are all white, and their minor chords put a black
    key in the middle; D, E, A work the other way round.

    Spelling note: a minor triad on C♯ (C♯–E–G♯) and on G♯ (G♯–B–D♯) is normally written with
    sharps, while the major triads on the same keys are written D♭ and A♭.
  sr: |
    Cilj: bilo koji durski ili molski kvintakord pod prstima **bez nabrajanja tonova**. Najbrži put je da
    znaš **raspored crnih i belih dirki** svakog akorda, odozdo naviše (● = crna dirka, ○ = bela):

    | oblik | dur | mol |
    |---|---|---|
    | ○ ○ ○ | C, F, G | d, e, a |
    | ○ ● ○ | D, E, A | c, f, g |
    | ● ○ ● | Des, Es, As | cis, fis, gis |
    | ● ● ● | Fis | es |
    | ● ○ ○ | B | – |
    | ○ ● ● | H | – |
    | ● ● ○ | – | b |
    | ○ ○ ● | – | h |

    (Mala slova za molske akorde, kao kod tonaliteta: d = d-mol, b = b-mol, h = h-mol.)

    Parovi su kao u ogledalu: C, F, G-dur su sve bele dirke, a njihovi molski akordi imaju crnu
    dirku u sredini; D, E, A obrnuto.

    Pravopis: molski kvintakord na Cis (Cis–E–Gis) i na Gis (Gis–H–Dis) piše se sa povisilicama,
    a durski na istim dirkama kao Des i As.
