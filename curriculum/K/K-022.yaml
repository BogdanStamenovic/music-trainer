id: K-022
track: K
order: 22
title: {en: "Cadential 6/4 at the keys: I64–V7–I in 4 keys", sr: "Kadencirajući kvartsekstakord za klavirom: I64–V7–I u 4 tonaliteta"}
prereqs: [K-011, T-027]
minutes: 14
tags: [keys, harmony, cadence, voice-leading]
explain:
  en: |
    The **cadential 6/4** is the tonic chord in second inversion (I64, in C: C–E over a **G**
    bass), placed right before V at a cadence. It looks like I, but it behaves like V: the bass
    is already on the dominant and stays there, while the upper voices step down into V7:

    - the **6th** above the bass (E) falls to the **5th** (D),
    - the **4th** above the bass (C) falls to the **3rd** (B).

    That 6–5 / 4–3 double step is the classic "big ending" of Classical concertos and hymns.
    So think of I64–V7 as **one dominant with a delay**, not as two different functions.

    Four-voice keyboard style: **left hand one bass note, right hand three voices**. In C:

    | | I | IV | I64 | V7 | I |
    |---|---|---|---|---|---|
    | left hand | C3 | F3 | G2 | G2 | C3 |
    | right hand | E4 G4 C5 | F4 A4 C5 | E4 G4 C5 | D4 F4 B4 | C4 E4 C5 |

    ```abc
    X:1
    L:1/2
    K:C
    [C,EGc] [F,FAc] | [G,,EGc] [G,,DFB] | [C,CEc]2 |]
    ```

    Watch the right hand: from I64 to V7 all three voices step **down** together. Then the
    leading tone B rises to C, the 7th F falls to E, and D falls to C. The final I has no 5th
    (C–E–C): that is normal and correct when V7 resolves properly; forcing the G in would make
    a voice leap or move the wrong way.

    The same shape in G, F and D is shown in the exercises; in F and D you get only the key and
    the numerals.
  sr: |
    **Kadencirajući kvartsekstakord** je tonički akord u drugom obrtaju (I64, u C-duru: C–E
    iznad **G** u basu), postavljen tik pre V u kadenci. Izgleda kao I, ali se ponaša kao V: bas
    je već na dominanti i ostaje tu, dok gornji glasovi koračaju naniže u V7:

    - **seksta** iznad basa (E) pada na **kvintu** (D),
    - **kvarta** iznad basa (C) pada na **tercu** (H).

    Taj dvostruki korak 6–5 / 4–3 je klasičan "veliki završetak" klasičnih koncerata i horala.
    Zato misli o I64–V7 kao o **jednoj dominanti sa zadrškom**, a ne kao o dve različite
    funkcije.

    Četvoroglasni slog za klavirom: **leva ruka jedan bas ton, desna tri glasa**. U C-duru:

    | | I | IV | I64 | V7 | I |
    |---|---|---|---|---|---|
    | leva ruka | C3 | F3 | G2 | G2 | C3 |
    | desna ruka | E4 G4 C5 | F4 A4 C5 | E4 G4 C5 | D4 F4 H4 | C4 E4 C5 |

    ```abc
    X:1
    L:1/2
    K:C
    [C,EGc] [F,FAc] | [G,,EGc] [G,,DFB] | [C,CEc]2 |]
    ```

    Prati desnu ruku: od I64 do V7 sva tri glasa zajedno koračaju **naniže**. Zatim vođica H
    raste na C, septima F pada na E, a D pada na C. Završni I nema kvintu (C–E–C): to je
    normalno i ispravno kad se V7 pravilno razreši; da nateraš G unutra, neki glas bi morao da
    skoči ili da ide u pogrešnom smeru.

    Isti oblik u G, F i D-duru je u vežbama; za F i D dobijaš samo tonalitet i stupnjeve.
exercises:
  - id: K-022-1
    type: mcq
    prompt: {en: "At a cadence, I64 (C–E over a G bass in C) functions as…", sr: "U kadenci, I64 (C–E iznad G u basu, u C-duru) ima funkciju…"}
    options:
      - {en: "tonic", sr: "tonike"}
      - {en: "a decorated dominant: the upper voices resolve into V", sr: "ukrašene dominante: gornji glasovi se razrešavaju u V"}
      - {en: "predominant", sr: "subdominante (predominante)"}
    answer: 1
    checks:
      - chord: {notes: [G3, C4, E4], root: C, quality: maj, inversion: 2}
      - interval: {from: G3, to: E4, is: M6}
      - interval: {from: G3, to: C4, is: P4}
      - semitones: {from: D4, to: E4, is: 2}
      - semitones: {from: B3, to: C4, is: 1}
