id: K-021
track: K
order: 21
title: {en: "Circle progressions in C and G (vi–ii–V–I, iii–vi–ii–V–I)", sr: "Progresije po kvintnom krugu u C i G-duru (vi–ii–V–I, iii–vi–ii–V–I)"}
prereqs: [K-013, T-026]
minutes: 14
tags: [keys, harmony, voice-leading]
explain:
  en: |
    ii–V–I is the end of a longer chain. Keep going backwards by the same step, roots **down a
    5th** (= up a 4th), and you get the **circle progression**:

    | | iii | vi | ii | V | I |
    |---|---|---|---|---|---|
    | C | Em | Am | Dm | G | C |
    | G | Bm | Em | Am | D | G |

    Every move is the strongest root motion there is, the same V→I pull, repeated. That is why
    the chain sounds inevitable and why it is everywhere: Baroque sequences, jazz standards,
    "I Will Survive", Christmas songs.

    **Triads, smooth.** Keep common tones and move the rest by step. In C, vi–ii–V–I with the
    left hand on the roots:

    ```abc
    X:1
    L:1/2
    K:C
    [A,,A,CE] [D,A,DF] | [G,,G,B,D] [C,G,CE] |]
    ```

    **Sevenths, guide tones.** In K-013 the 3rd and 7th swapped roles at every chord. Around
    the circle that continues for the whole chain: the 7th falls a step to the next 3rd, the
    3rd stays as the next 7th. In C, right hand only two notes, left hand the root:

    | chord | Em7 | Am7 | Dm7 | G7 | Cmaj7 |
    |---|---|---|---|---|---|
    | left hand | E3 | A2 | D3 | G2 | C3 |
    | right hand | D4 G4 | C4 G4 | C4 F4 | B3 F4 | B3 E4 |

    The right hand walks down by half and whole steps while the bass jumps around the circle.
    That is the sound of a jazz pianist "comping" through changes.
  sr: |
    ii–V–I je kraj dužeg lanca. Nastavi unazad istim korakom, osnovni tonovi **za kvintu
    naniže** (= kvartu naviše), i dobijaš **progresiju po kvintnom krugu**:

    | | iii | vi | ii | V | I |
    |---|---|---|---|---|---|
    | C | e | a | d | G | C |
    | G | h | e | a | D | G |

    Svaki korak je najjače kretanje osnovnih tonova koje postoji, isto privlačenje V→I,
    ponovljeno. Zato lanac zvuči neizbežno i zato je svuda: barokne sekvence, džez standardi,
    "I Will Survive", božićne pesme.

    **Kvintakordi, glatko.** Zadrži zajedničke tonove, ostale pomeri za korak. U C-duru,
    vi–ii–V–I sa levom rukom na osnovnim tonovima:

    ```abc
    X:1
    L:1/2
    K:C
    [A,,A,CE] [D,A,DF] | [G,,G,B,D] [C,G,CE] |]
    ```

    **Septakordi, ključni tonovi.** U K-013 terca i septima su menjale uloge na svakom akordu.
    Po kvintnom krugu to se nastavlja kroz ceo lanac: septima pada za korak na sledeću tercu,
    terca ostaje kao sledeća septima. U C-duru, desna ruka samo dva tona, leva osnovni ton:

    | akord | Em7 | Am7 | Dm7 | G7 | Cmaj7 |
    |---|---|---|---|---|---|
    | leva ruka | E3 | A2 | D3 | G2 | C3 |
    | desna ruka | D4 G4 | C4 G4 | C4 F4 | H3 F4 | H3 E4 |

    Desna ruka silazi polustepenima i stepenima dok bas skače po krugu. Tako zvuči džez
    pijanista koji prati kroz akorde (comping).
