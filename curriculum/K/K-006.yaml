id: K-006
track: K
order: 6
title: {en: "Diatonic triads in C, G and F", sr: "Dijatonski kvintakordi u C, G i F-duru"}
prereqs: [K-005, T-012]
minutes: 13
tags: [keys, chords, harmony]
explain:
  en: |
    Stack a third and a fifth on every note of a major scale, using only notes of that scale,
    and you get the seven chords of the key. In every major key the pattern is the same:

    | degree | 1 | 2 | 3 | 4 | 5 | 6 | 7 |
    |---|---|---|---|---|---|---|---|
    | numeral | I | ii | iii | IV | V | vi | vii° |
    | quality | major | minor | minor | major | major | minor | diminished |
    | in C | C | Dm | Em | F | G | Am | B° |

    ```abc
    X:1
    L:1/4
    K:C
    [CEG] [DFA] [EGB] [FAc] [GBd] [Ace] [Bdf] [ceg] |]
    ```

    On the keyboard this is easy: keep the **same hand shape** (fingers 1-3-5) and walk it up the
    scale, playing only the key's notes. In G every F is F♯; in F every B is B♭.

    Upper case = major, lower case = minor, ° = diminished. When you see "vi in F", think: 6th
    note of F major (D), minor chord: D–F–A.
  sr: |
    Na svaki ton durske lestvice složi tercu i kvintu, samo od tonova te lestvice, i dobiješ
    sedam akorada tonaliteta. U svakom duru obrazac je isti:

    | stupanj | 1 | 2 | 3 | 4 | 5 | 6 | 7 |
    |---|---|---|---|---|---|---|---|
    | oznaka | I | ii | iii | IV | V | vi | vii° |
    | vrsta | durski | molski | molski | durski | durski | molski | smanjeni |
    | u C-duru | C | d | e | F | G | a | h° |

    ```abc
    X:1
    L:1/4
    K:C
    [CEG] [DFA] [EGB] [FAc] [GBd] [Ace] [Bdf] [ceg] |]
    ```

    Na klavijaturi je lako: drži **isti oblik ruke** (prsti 1-3-5) i pomeraj ga naviše po
    lestvici, samo po tonovima tonaliteta. U G-duru svako F je Fis; u F-duru svako H je B.

    Veliko slovo = durski, malo = molski, ° = smanjeni. Kad vidiš „vi u F-duru", misli: 6. ton
    F-dura (D), molski akord: D–F–A.
