    type: midi-play
    prompt: {en: "Walk the triads up C major: I ii iii IV V vi vii° I (block chords, 1-3-5).", sr: "Prođi kvintakorde naviše kroz C-dur: I ii iii IV V vi vii° I (akordi, prsti 1-3-5)."}
    mode: chords
    derive: {roman: {key: C4, numerals: [I, ii, iii, IV, V, vi, "vii°", I]}}
    octave: any
    bass: true
    checks:
      - roman: {key: C, degree: 1, is: "I"}
      - roman: {key: C, degree: 2, is: "ii"}
      - roman: {key: C, degree: 3, is: "iii"}
      - roman: {key: C, degree: 4, is: "IV"}
      - roman: {key: C, degree: 5, is: "V"}
      - roman: {key: C, degree: 6, is: "vi"}
      - roman: {key: C, degree: 7, is: "vii°"}
      - roman: {key: F, degree: 6, is: "vi"}
      - chord: {notes: [D4, F4, A4], root: D, quality: min}
      - chord: {notes: [B4, D5, F5], root: B, quality: dim}
