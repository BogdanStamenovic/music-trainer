id: K-030
track: K
order: 30
title: {en: "Minor cadences: i–iv–V7–i in 6 minor keys", sr: "Molske kadence: i–iv–V7–i u 6 molskih tonaliteta"}
prereqs: [T-039, K-023]
minutes: 14
tags: [keys, harmony, cadence, minor, transposition]
explain:
  en: |
    In natural minor the chord on 5 is minor (in A minor: E–G–B) and has no leading tone, so it
    does not pull home. Minor-key harmony fixes that by **raising the 7th degree** for the
    dominant (T-039): G becomes G♯, and V7 is E–G♯–B–D, the same V7 as in A major. The i and iv
    stay minor; only the dominant borrows the raised note.

    The K-023 hand shape works in minor unchanged, with one accidental:

    | | i | iv | V7 | i |
    |---|---|---|---|---|
    | RH scale degrees | 1 3 5 | 1 4 6 | ♯7 2 4 5 | 1 3 5 |
    | in A minor | A C E | A D F | G♯ B D E | A C E |
    | left hand | A2 | D3 | E2 | A2 |

    ```abc
    X:1
    L:1/2
    K:Am
    [A,,A,CE] [D,A,DF] | [E,,^G,B,DE] [A,,A,CE] |]
    ```

    One voice-leading detail matters more in minor. From iv to V7 the 6th degree (F) moves
    **down** to 5 (E), not up to the raised 7th (G♯). F to G♯ is an **augmented 2nd**, three
    half steps that sound like a gap in the line (it is the "exotic" interval of the harmonic
    minor scale). In this shape G♯ comes from A, a half step above it, so the problem never
    arises.

    The key signature never shows the raised 7th; you add it every time. Six keys, three on
    each side of the circle:

    | key | signature | V7 | raised 7th |
    |---|---|---|---|
    | a | none | E7 | G♯ |
    | e | 1♯ | B7 | D♯ |
    | b | 2♯ | F♯7 | A♯ |
    | d | 1♭ | A7 | C♯ |
    | g | 2♭ | D7 | F♯ |
    | c | 3♭ | G7 | B♮ |
  sr: |
    U prirodnom molu akord na 5. stupnju je molski (u a-molu: E–G–H) i nema vođicu, pa ne vuče
    kući. Harmonija u molu to rešava **povišenjem sedmog stupnja** za dominantu (T-039): G
    postaje Gis, a V7 je E–Gis–H–D, isti V7 kao u A-duru. i i iv ostaju molski; samo dominanta
    pozajmljuje povišen ton.

    Oblik šake iz K-023 radi u molu bez promene, uz jedan predznak:

    | | i | iv | V7 | i |
    |---|---|---|---|---|
    | stupnjevi u desnoj ruci | 1 3 5 | 1 4 6 | ♯7 2 4 5 | 1 3 5 |
    | u a-molu | A C E | A D F | Gis H D E | A C E |
    | leva ruka | A2 | D3 | E2 | A2 |

    ```abc
    X:1
    L:1/2
    K:Am
    [A,,A,CE] [D,A,DF] | [E,,^G,B,DE] [A,,A,CE] |]
    ```

    Jedan detalj vođenja glasova je u molu važniji. Od iv ka V7 šesti stupanj (F) ide **naniže**
    na 5 (E), a ne naviše na povišeni sedmi (Gis). F–Gis je **prekomerna sekunda**, tri
    polustepena koja zvuče kao rupa u liniji (to je "egzotični" interval harmonske molske
    lestvice). U ovom obliku Gis dolazi od A, polustepen iznad, pa problem nikad ne nastaje.

    Predznaci na početku nikad ne pokazuju povišen sedmi stupanj; dodaješ ga svaki put. Šest
    tonaliteta, po tri sa svake strane kruga:

    | tonalitet | predznaci | V7 | povišen 7. stupanj |
    |---|---|---|---|
    | a | nema | E7 | Gis |
    | e | 1♯ | H7 | Dis |
    | h | 2♯ | Fis7 | Ais |
    | d | 1♭ | A7 | Cis |
    | g | 2♭ | D7 | Fis |
    | c | 3♭ | G7 | H |
exercises:
  - id: K-030-1
    type: mcq
    prompt: {en: "In a minor, which note turns the minor v (E–G–B) into the major V (E–G♯–B)?", sr: "U a-molu, koji ton pretvara molsku v (E–G–H) u dursku V (E–Gis–H)?"}
    options:
      - {en: "G♯, the raised 7th degree", sr: "Gis, povišen 7. stupanj"}
      - {en: "F♯, the raised 6th degree", sr: "Fis, povišen 6. stupanj"}
      - {en: "D♯, the raised 4th degree", sr: "Dis, povišen 4. stupanj"}
      - {en: "C♯, the raised 3rd degree", sr: "Cis, povišen 3. stupanj"}
    answer: 0
    checks:
      - chord: {notes: [E4, G4, B4], root: E, quality: min}
      - chord: {notes: [E4, "G#4", B4], root: E, quality: maj}
      - scale: {tonic: A, type: harmonic-minor, is: [A, B, C, D, E, F, "G#"]}
      - roman: {key: A, type: harmonic-minor, degree: 5, is: "V"}
      - roman: {key: A, type: natural-minor, degree: 5, is: "v"}
  - id: K-030-2
    type: mcq
    prompt: {en: "From iv (D–F–A) to V7 in a minor, why should F move down to E rather than up to G♯?", sr: "Od iv (D–F–A) ka V7 u a-molu, zašto F treba da ide naniže na E, a ne naviše na Gis?"}
    options:
      - {en: "F–G♯ is an augmented 2nd, an awkward leap in a voice", sr: "F–Gis je prekomerna sekunda, nezgodan skok u glasu"}
      - {en: "G♯ is not part of V7", sr: "Gis nije deo V7"}
      - {en: "E is the leading tone", sr: "E je vođica"}
      - {en: "F–G♯ makes parallel fifths", sr: "F–Gis pravi paralelne kvinte"}
    answer: 0
    checks:
      - interval: {from: F4, to: "G#4", is: A2}
      - semitones: {from: F4, to: "G#4", is: 3}
      - chord: {notes: [E3, "G#3", B3, D4], root: E, quality: "7"}
  - id: K-030-3
    type: midi-play
    prompt: {en: "a minor, as in the table: A2 · A3 C4 E4 → D3 · A3 D4 F4 → E2 · G♯3 B3 D4 E4 → A2 · A3 C4 E4, ♩=60.", sr: "a-mol, kao u tabeli: A2 · A3 C4 E4 → D3 · A3 D4 F4 → E2 · Gis3 H3 D4 E4 → A2 · A3 C4 E4, ♩=60."}
    mode: chords
    expectChords: [[A2, A3, C4, E4], [D3, A3, D4, F4], [E2, "G#3", B3, D4, E4], [A2, A3, C4, E4]]
    tempo: 60
    checks:
      - chord: {notes: [A2, A3, C4, E4], root: A, quality: min, inversion: 0}
      - chord: {notes: [D3, A3, D4, F4], root: D, quality: min, inversion: 0}
      - chord: {notes: [E2, "G#3", B3, D4, E4], root: E, quality: "7", inversion: 0}
      - semitones: {from: "G#3", to: A3, is: 1}
  - id: K-030-4
    type: midi-play
    prompt: {en: "e minor: E3 · E4 G4 B4 → A2 · E4 A4 C5 → B2 · D♯4 F♯4 A4 B4 → E3 · E4 G4 B4, ♩=60.", sr: "e-mol: E3 · E4 G4 H4 → A2 · E4 A4 C5 → H2 · Dis4 Fis4 A4 H4 → E3 · E4 G4 H4, ♩=60."}
    mode: chords
    expectChords: [[E3, E4, G4, B4], [A2, E4, A4, C5], [B2, "D#4", "F#4", A4, B4], [E3, E4, G4, B4]]
    tempo: 60
    checks:
      - chord: {notes: [E3, E4, G4, B4], root: E, quality: min, inversion: 0}
      - chord: {notes: [A2, E4, A4, C5], root: A, quality: min, inversion: 0}
      - chord: {notes: [B2, "D#4", "F#4", A4, B4], root: B, quality: "7", inversion: 0}
      - keysig: {key: E, mode: minor, is: 1}
  - id: K-030-5
    type: midi-play
    prompt: {en: "d minor, notes hidden: i – iv – V7 – i, root in the bass. Remember the C♯. ♩=60.", sr: "d-mol, bez prikaza tonova: i – iv – V7 – i, osnovni ton u basu. Ne zaboravi Cis. ♩=60."}
    mode: chords
    expectChords: [[D3, D4, F4, A4], [G2, D4, G4, Bb4], [A2, "C#4", E4, G4, A4], [D3, D4, F4, A4]]
    octave: any
    bass: true
    tempo: 60
    showNotes: false
    checks:
      - chord: {notes: [D3, D4, F4, A4], root: D, quality: min, inversion: 0}
      - chord: {notes: [G2, D4, G4, Bb4], root: G, quality: min, inversion: 0}
      - chord: {notes: [A2, "C#4", E4, G4, A4], root: A, quality: "7", inversion: 0}
      - keysig: {key: D, mode: minor, is: -1}
  - id: K-030-6
    type: midi-play
    prompt: {en: "b minor, notes hidden: i – iv – V7 – i, root in the bass. The V7 is F♯7 with A♯. ♩=60.", sr: "h-mol, bez prikaza tonova: i – iv – V7 – i, osnovni ton u basu. V7 je Fis7 sa Ais. ♩=60."}
    mode: chords
    expectChords: [[B2, B3, D4, "F#4"], [E2, B3, E4, G4], ["F#2", "A#3", "C#4", E4, "F#4"], [B2, B3, D4, "F#4"]]
    octave: any
    bass: true
    tempo: 60
    showNotes: false
    checks:
      - chord: {notes: [B2, B3, D4, "F#4"], root: B, quality: min, inversion: 0}
      - chord: {notes: [E2, B3, E4, G4], root: E, quality: min, inversion: 0}
      - chord: {notes: ["F#2", "A#3", "C#4", E4, "F#4"], root: "F#", quality: "7", inversion: 0}
      - keysig: {key: B, mode: minor, is: 2}
  - id: K-030-7
    type: generated
    prompt: {en: "All six keys at random (a, e, b, d, g, c): i – iv – V7 – i, root in the bass", sr: "Svih šest tonaliteta nasumično (a, e, h, d, g, c): i – iv – V7 – i, osnovni ton u basu"}
    count: 4
    gen: {kind: progression, keys: [A, E, B, D, G, C], type: harmonic-minor, numerals: [i, iv, V7, i], tempo: 60}
    checks:
      - keysig: {key: G, mode: minor, is: -2}
      - keysig: {key: C, mode: minor, is: -3}
      - keysig: {key: B, mode: minor, is: 2}
