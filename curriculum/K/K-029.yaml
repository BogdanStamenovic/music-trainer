id: K-029
track: K
order: 29
title: {en: "Secondary dominants at the keys: I–V7/V–V7–I in 4 keys", sr: "Sporedne dominante za klavirom: I–V7/V–V7–I u 4 tonaliteta"}
prereqs: [T-043, K-023]
minutes: 14
tags: [keys, harmony, secondary-dominant, voice-leading]
explain:
  en: |
    **V7/V** ("five-seven of five") is the dominant seventh chord that belongs to the key of
    the dominant. In C the dominant is G; the V7 of G is **D7** (D F♯ A C). Played before G7 it
    makes G sound, for a moment, like a tonic, so the arrival on V is stronger (T-043).

    At the keyboard, think of V7/V as **ii with a raised 3rd**: Dm7 is D F A C, D7 is
    D **F♯** A C. One note changes. That F♯ is the leading tone of G, and it is the note that
    gives the chord its pull.

    Use the K-023 hand shape and slot the new chord in:

    | | I | V7/V | V7 | I |
    |---|---|---|---|---|
    | left hand | C3 | D3 | G2 | C3 |
    | right hand | C4 E4 G4 | C4 F♯4 A4 | B3 D4 F4 G4 | C4 E4 G4 |

    ```abc
    X:1
    L:1/2
    K:C
    [C,CEG] [D,C^FA] | [G,,B,DFG] [C,CEG] |]
    ```

    Follow the voices from V7/V to V7:

    - C (the 7th of D7) falls to B, as every 7th does.
    - **F♯ slides down to F♮.** Over a plain V, F♯ would rise to G. But the next chord is V7,
      and F is its 7th, so the line moves chromatically, F♯ → F. That half-step slide in an
      inner voice is the sound of a secondary dominant going to V7.
    - A falls to G, and D is added to complete G7.

    The same shape in G, F and D is in the exercises. In each key, find the chromatic note
    first: it is always the **raised 4th degree** (F♯ in C, C♯ in G, B♮ in F, G♯ in D).
  sr: |
    **V7/V** ("dominanta dominante", "pet-sedam od pet") je dominantni septakord koji pripada
    tonalitetu dominante. U C-duru dominanta je G; V7 od G je **D7** (D Fis A C). Odsviran pre
    G7, na trenutak čini da G zvuči kao tonika, pa je dolazak na V jači (T-043).

    Za klavirom misli o V7/V kao o **ii sa povišenom tercom**: Dm7 je D F A C, D7 je
    D **Fis** A C. Menja se jedan ton. Taj Fis je vođica ka G, i on akordu daje privlačnu silu.

    Koristi oblik šake iz K-023 i ubaci novi akord:

    | | I | V7/V | V7 | I |
    |---|---|---|---|---|
    | leva ruka | C3 | D3 | G2 | C3 |
    | desna ruka | C4 E4 G4 | C4 Fis4 A4 | H3 D4 F4 G4 | C4 E4 G4 |

    ```abc
    X:1
    L:1/2
    K:C
    [C,CEG] [D,C^FA] | [G,,B,DFG] [C,CEG] |]
    ```

    Prati glasove od V7/V do V7:

    - C (septima od D7) pada na H, kao svaka septima.
    - **Fis klizi naniže na F.** Preko običnog V, Fis bi rastao na G. Ali sledeći akord je V7,
      a F je njegova septima, pa linija ide hromatski, Fis → F. To klizanje za polustepen u
      unutrašnjem glasu je zvuk sporedne dominante koja ide u V7.
    - A pada na G, a D se dodaje da G7 bude potpun.

    Isti oblik u G, F i D-duru je u vežbama. U svakom tonalitetu prvo nađi hromatski ton: to
    je uvek **povišeni četvrti stupanj** (Fis u C, Cis u G, H u F, Gis u D-duru).
exercises:
  - id: K-029-1
    type: mcq
    prompt: {en: "In C, ii7 is Dm7 (D F A C) and V7/V is D7. Which note is different?", sr: "U C-duru ii7 je Dm7 (D F A C), a V7/V je D7. Koji ton je drugačiji?"}
    options:
      - {en: "F becomes F♯", sr: "F postaje Fis"}
      - {en: "C becomes C♯", sr: "C postaje Cis"}
      - {en: "A becomes A♭", sr: "A postaje As"}
      - {en: "D becomes D♯", sr: "D postaje Dis"}
    answer: 0
    checks:
      - chord: {notes: [D4, F4, A4, C5], root: D, quality: min7}
      - chord: {notes: [D4, "F#4", A4, C5], root: D, quality: "7"}
      - roman: {key: C, degree: 2, is: "ii7", seventh: true}
      - numeral: {key: C, is: "V7/V", notes: [D4, "F#4", A4, C5]}
      - semitones: {from: "F#4", to: G4, is: 1}
  - id: K-029-2
    type: mcq
    prompt: {en: "V7/V in D major is…", sr: "V7/V u D-duru je…"}
    options:
