      - {en: "A7 (A C♯ E G)", sr: "A7 (A Cis E G)"}
      - {en: "Em7 (E G B D)", sr: "Em7 (E G H D)"}
      - {en: "B7 (B D♯ F♯ A)", sr: "H7 (H Dis Fis A)"}
    answer: 0
    checks:
      - chord: {notes: [E4, "G#4", B4, D5], root: E, quality: "7"}
      - chord: {notes: [A3, "C#4", E4, G4], root: A, quality: "7"}
      - numeral: {key: D, is: "V7/V", notes: [E4, "G#4", B4, D5]}
      - numeral: {key: D, is: "V7", notes: [A3, "C#4", E4, G4]}
