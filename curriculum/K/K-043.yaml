  - id: K-043-6
    type: practice
    prompt: {en: "Hands together through the whole form twice. Second time through, on the last A, paraphrase the melody: same notes on the downbeats, but change the rhythm (anticipate a note, add a pickup, hold one longer). End with a small ritardando in the last bar.", sr: "Obe ruke kroz celu formu dva puta. Drugi put, u poslednjem A, parafraziraj melodiju: isti tonovi na prvim dobama, ali promeni ritam (najavi ton ranije, dodaj predtakt, zadrži jedan duže). Završi malim ritardandom u poslednjem taktu."}
    minutes: 4
