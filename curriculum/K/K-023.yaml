id: K-023
track: K
order: 23
title: {en: "I–IV–V7–I in all 12 major keys", sr: "I–IV–V7–I u svih 12 durskih tonaliteta"}
prereqs: [K-022]
minutes: 15
tags: [keys, harmony, cadence, transposition]
explain:
  en: |
    So far you have played cadences in four or five keys, each worked out note by note. This
    lesson turns the cadence into **one hand shape** that you move around the circle of fifths,
    so that in a song in E♭ or B you do not have to think, only place the hand.

    **Left hand:** the root of each chord (1 – 4 – 5 – 1 of the key).
    **Right hand:** start from I in root position, then move each finger to the nearest note:

    | | I | IV | V7 | I |
    |---|---|---|---|---|
    | scale degrees in the right hand | 1 3 5 | 1 4 6 | 7 2 4 5 | 1 3 5 |
    | in C | C E G | C F A | B D F G | C E G |
    | left hand in C | C3 | F2 | G2 | C3 |

    ```abc
    X:1
    L:1/2
    K:C
    [C,CEG] [F,,CFA] | [G,,B,DFG] [C,CEG] |]
    ```

    Why this shape: the tonic (1) is held from I into IV (common tone); 3 and 5 move up by step
    to 4 and 6. Into V7 every voice moves by a step or less: 1 down to the **leading tone 7**,
    6 down to 5, 4 stays (it becomes the **7th** of V7) and 2 is added to complete the chord.
    Then 7 rises to 1 and 4 falls to 3: the two tendency tones of V7 resolve exactly as in K-011.

    The right hand never moves more than a step, in any key. What changes is only which keys
    are black. Go round the circle of fifths, each key a fifth higher than the last:

    C – G – D – A – E – B – F♯/G♭ – D♭ – A♭ – E♭ – B♭ – F – (C)

    Saying the letter names of the RH shape before playing (in E: "E G♯ B, E A C♯, D♯ F♯ A B")
    is the fastest way to stop guessing at accidentals.
  sr: |
    Do sada si kadence svirao u četiri ili pet tonaliteta, svaku razrađenu ton po ton. Ova
    lekcija pretvara kadencu u **jedan oblik šake** koji pomeraš po kvintnom krugu, tako da u
    pesmi u Es ili H-duru ne moraš da razmišljaš, samo da postaviš ruku.

    **Leva ruka:** osnovni ton svakog akorda (1 – 4 – 5 – 1 tonaliteta).
    **Desna ruka:** kreni od I u osnovnom položaju, pa pomeri svaki prst na najbliži ton:

    | | I | IV | V7 | I |
    |---|---|---|---|---|
    | stupnjevi u desnoj ruci | 1 3 5 | 1 4 6 | 7 2 4 5 | 1 3 5 |
    | u C-duru | C E G | C F A | H D F G | C E G |
    | leva ruka u C-duru | C3 | F2 | G2 | C3 |

    ```abc
    X:1
    L:1/2
    K:C
    [C,CEG] [F,,CFA] | [G,,B,DFG] [C,CEG] |]
    ```

    Zašto baš ovaj oblik: tonika (1) se zadržava iz I u IV (zajednički ton); 3 i 5 idu za
    korak naviše na 4 i 6. U V7 svaki glas ide za korak ili manje: 1 silazi na **vođicu 7**,
    6 silazi na 5, 4 ostaje (postaje **septima** od V7), a 2 se dodaje da akord bude potpun.
    Zatim 7 raste na 1, a 4 pada na 3: dva tona sa težnjom u V7 razrešavaju se tačno kao u
    K-011.

    Desna ruka se nikad ne pomera više od koraka, ni u jednom tonalitetu. Menja se samo koje
    dirke su crne. Idi po kvintnom krugu, svaki tonalitet kvintu iznad prethodnog:

    C – G – D – A – E – H – Fis/Ges – Des – As – Es – B – F – (C)

    Izgovori imena tonova oblika desne ruke pre sviranja (u E-duru: "E Gis H, E A Cis, Dis Fis
    A H"): to je najbrži način da prestaneš da pogađaš predznake.
exercises:
  - id: K-023-1
    type: mcq
    prompt: {en: "Going round the circle of fifths from C (C, G, D, A, E, B, F♯/G♭, …), which key comes right after F♯/G♭?", sr: "Idući po kvintnom krugu od C (C, G, D, A, E, H, Fis/Ges, …), koji tonalitet dolazi odmah posle Fis/Ges?"}
    options:
      - {en: "D♭", sr: "Des"}
      - {en: "A♭", sr: "As"}
      - {en: "B♭", sr: "B"}
      - {en: "B", sr: "H"}
    answer: 0
    checks:
      - interval: {from: Gb3, to: Db4, is: P5}
      - interval: {from: "F#3", to: "C#4", is: P5}
      - keysig: {key: Gb, is: -6}
      - keysig: {key: Db, is: -5}
      - keysig: {key: "F#", is: 6}
  - id: K-023-2
    type: midi-play
    prompt: {en: "C major, the shape from the table: C3 · C4 E4 G4 → F2 · C4 F4 A4 → G2 · B3 D4 F4 G4 → C3 · C4 E4 G4, one chord per beat at ♩=60.", sr: "C-dur, oblik iz tabele: C3 · C4 E4 G4 → F2 · C4 F4 A4 → G2 · H3 D4 F4 G4 → C3 · C4 E4 G4, jedan akord po dobi, ♩=60."}
    mode: chords
    expectChords: [[C3, C4, E4, G4], [F2, C4, F4, A4], [G2, B3, D4, F4, G4], [C3, C4, E4, G4]]
    tempo: 60
    checks:
      - chord: {notes: [C3, C4, E4, G4], root: C, quality: maj, inversion: 0}
      - chord: {notes: [F2, C4, F4, A4], root: F, quality: maj, inversion: 0}
      - chord: {notes: [G2, B3, D4, F4, G4], root: G, quality: "7", inversion: 0}
      - semitones: {from: B3, to: C4, is: 1}
      - semitones: {from: E4, to: F4, is: 1}
  - id: K-023-3
    type: midi-play
    prompt: {en: "A major (three sharps), same shape: A2 · A3 C♯4 E4 → D3 · A3 D4 F♯4 → E3 · G♯3 B3 D4 E4 → A2 · A3 C♯4 E4, ♩=60.", sr: "A-dur (tri povisilice), isti oblik: A2 · A3 Cis4 E4 → D3 · A3 D4 Fis4 → E3 · Gis3 H3 D4 E4 → A2 · A3 Cis4 E4, ♩=60."}
    mode: chords
    expectChords: [[A2, A3, "C#4", E4], [D3, A3, D4, "F#4"], [E3, "G#3", B3, D4, E4], [A2, A3, "C#4", E4]]
    tempo: 60
    checks:
      - chord: {notes: [A2, A3, "C#4", E4], root: A, quality: maj, inversion: 0}
      - chord: {notes: [D3, A3, D4, "F#4"], root: D, quality: maj, inversion: 0}
      - chord: {notes: [E3, "G#3", B3, D4, E4], root: E, quality: "7", inversion: 0}
      - keysig: {key: A, is: 3}
      - semitones: {from: "G#3", to: A3, is: 1}
  - id: K-023-4
    type: midi-play
    prompt: {en: "E♭ major, notes hidden. Name the RH shape to yourself first (1 3 5 / 1 4 6 / 7 2 4 5 / 1 3 5), then play I – IV – V7 – I with the root in the bass, ♩=60.", sr: "Es-dur, bez prikaza tonova. Prvo u sebi imenuj oblik desne ruke (1 3 5 / 1 4 6 / 7 2 4 5 / 1 3 5), pa odsviraj I – IV – V7 – I sa osnovnim tonom u basu, ♩=60."}
    mode: chords
    expectChords: [[Eb3, Eb4, G4, Bb4], [Ab2, Eb4, Ab4, C5], [Bb2, D4, F4, Ab4, Bb4], [Eb3, Eb4, G4, Bb4]]
    octave: any
    bass: true
    tempo: 60
    showNotes: false
    checks:
      - chord: {notes: [Eb3, Eb4, G4, Bb4], root: Eb, quality: maj, inversion: 0}
      - chord: {notes: [Ab2, Eb4, Ab4, C5], root: Ab, quality: maj, inversion: 0}
      - chord: {notes: [Bb2, D4, F4, Ab4, Bb4], root: Bb, quality: "7", inversion: 0}
      - keysig: {key: Eb, is: -3}
  - id: K-023-5
    type: midi-play
    prompt: {en: "D♭ major (five flats), notes hidden: I – IV – V7 – I, same shape, root in the bass, ♩=60. The V7 is A♭7 and its leading tone is C.", sr: "Des-dur (pet snizilica), bez prikaza tonova: I – IV – V7 – I, isti oblik, osnovni ton u basu, ♩=60. V7 je As7, a vođica mu je C."}
    mode: chords
    expectChords: [[Db3, Db4, F4, Ab4], [Gb2, Db4, Gb4, Bb4], [Ab2, C4, Eb4, Gb4, Ab4], [Db3, Db4, F4, Ab4]]
    octave: any
    bass: true
    tempo: 60
    showNotes: false
    checks:
      - chord: {notes: [Db3, Db4, F4, Ab4], root: Db, quality: maj, inversion: 0}
      - chord: {notes: [Gb2, Db4, Gb4, Bb4], root: Gb, quality: maj, inversion: 0}
      - chord: {notes: [Ab2, C4, Eb4, Gb4, Ab4], root: Ab, quality: "7", inversion: 0}
      - keysig: {key: Db, is: -5}
      - semitones: {from: C4, to: Db4, is: 1}
  - id: K-023-6
    type: generated
    prompt: {en: "Random keys from the whole circle: I – IV – V7 – I, root in the bass, all chord tones present", sr: "Nasumični tonaliteti iz celog kruga: I – IV – V7 – I, osnovni ton u basu, svi tonovi akorda prisutni"}
    count: 4
    gen: {kind: progression, keys: [C, G, D, A, E, B, "F#", Db, Ab, Eb, Bb, F], numerals: [I, IV, V7, I], tempo: 60}
  - id: K-023-7
    type: practice
    prompt: {en: "All 12 keys without stopping: play I – IV – V7 – I, then go straight to the next key a fifth up (C, G, D … F, C). Metronome ♩=60, one chord per click, no gap between keys. When that holds, go the other way, by fourths (C, F, B♭ …).", sr: "Svih 12 tonaliteta bez zaustavljanja: odsviraj I – IV – V7 – I, pa odmah pređi u sledeći tonalitet kvintu naviše (C, G, D … F, C). Metronom ♩=60, jedan akord po udarcu, bez pauze između tonaliteta. Kad to ide, idi obrnuto, po kvartama (C, F, B …)."}
    minutes: 4
