    type: generated
    prompt: {en: "The tune's harmony in other keys, written in the starting key: I – IV – V7 – I – vi – V7/V – V", sr: "Harmonija teme u drugim tonalitetima, zapisana u polaznom tonalitetu: I – IV – V7 – I – vi – V7/V – V"}
    count: 3
    gen: {kind: progression, keys: [F, D, Bb, A], numerals: [I, IV, V7, I, vi, V7/V, V], tempo: 72, smooth: true}
  - id: K-046-6
    type: mcq
    prompt: {en: "You transpose the lead sheet to F major. Where does it end, and what is the first foreign note?", sr: "Transponuješ lead sheet u F-dur. Gde se završava, i koji je prvi strani ton?"}
    options:
      - {en: "In C major; B♮ in G7 (bar 5)", sr: "U C-duru; H u G7 (5. takt)"}
      - {en: "In B♭ major; E♭ in F7", sr: "U B-duru; Es u F7"}
      - {en: "In D minor; C♯ in A7", sr: "U d-molu; Cis u A7"}
      - {en: "In F major; it does not modulate", sr: "U F-duru; ne modulira"}
    answer: 0
    checks:
      - numeral: {key: F, is: "V7/V", notes: [G3, B3, D4, F4]}
      - numeral: {key: C, is: "V7", notes: [G3, B3, D4, F4]}
      - numeral: {key: F, is: "vi", notes: [D3, F3, A3]}
  - id: K-046-7
    type: practice
    prompt: {en: "Play the whole lead sheet hands together in C, then in F (pivot Dm, new note B♮ in G7, ending in C), reading from your pencilled numerals rather than the notes. Then add a second half of your own (8 bars) that goes back from G to C: G7 is the easiest way home.", sr: "Odsviraj ceo lead sheet obema rukama u C-duru, pa u F-duru (most Dm, novi ton H u G7, završetak u C-duru), čitajući sa olovkom upisanih stupnjeva umesto tonova. Zatim dodaj sopstvenu drugu polovinu (8 taktova) koja se vraća iz G u C: G7 je najlakši put kući."}
    minutes: 5
