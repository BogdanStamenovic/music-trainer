    prompt: {en: "The opening phrase in G major: G G D D | E E D – | C C B B | A A G –. Harmonize it, one chord per half bar (♩=60).", sr: "Početna fraza u G-duru: G G D D | E E D – | C C H H | A A G –. Harmonizuj je, jedan akord po polutaktu (♩=60)."}
