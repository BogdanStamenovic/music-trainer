id: K-004
track: K
order: 4
title: {en: "Major scales with flats: B♭, E♭, A♭", sr: "Durske lestvice sa snizilicama: B, Es, As"}
prereqs: [K-003, T-009]
minutes: 13
tags: [keys, scales, technique]
explain:
  en: |
    Each new flat key adds one flat: F has B♭, **B♭ adds E♭**, **E♭ adds A♭**, **A♭ adds D♭**.
    The added flat is always the 4th degree of the new key.

    The flat keys share one simple fingering rule. **Right hand: thumb on C and F, finger 4 on
    B♭.** **Left hand: 3 2 1 4 3 2 1 3** in all three, finger 4 on the 4th degree.

    | key | flats | right hand | left hand (going up) |
    |---|---|---|---|
    | B♭ | B♭ E♭ | 2 1 2 3 1 2 3 4 | 3 2 1 4 3 2 1 3 |
    | E♭ | B♭ E♭ A♭ | 3 1 2 3 4 1 2 3 | 3 2 1 4 3 2 1 3 |
    | A♭ | B♭ E♭ A♭ D♭ | 3 4 1 2 3 1 2 3 | 3 2 1 4 3 2 1 3 |

    - Notice the hand never starts with the thumb: the thumb on a black key is awkward, so the
      fingering starts mid-pattern.
    - In Serbian, B♭ is simply **B**, E♭ is **Es**, A♭ is **As**, D♭ is **Des**.
  sr: |
    Svaki novi tonalitet sa snizilicama dodaje jednu: F-dur ima B, **B-dur dodaje Es**,
    **Es-dur dodaje As**, **As-dur dodaje Des**. Dodata snizilica je uvek 4. stupanj novog
    tonaliteta.

    Ovi tonaliteti dele jedno jednostavno pravilo prstoreda. **Desna ruka: palac na C i F,
    četvrti prst na B.** **Leva ruka: 3 2 1 4 3 2 1 3** u sva tri, četvrti prst na 4. stupnju.

    | tonalitet | snizilice | desna ruka | leva ruka (naviše) |
    |---|---|---|---|
    | B-dur | B Es | 2 1 2 3 1 2 3 4 | 3 2 1 4 3 2 1 3 |
    | Es-dur | B Es As | 3 1 2 3 4 1 2 3 | 3 2 1 4 3 2 1 3 |
    | As-dur | B Es As Des | 3 4 1 2 3 1 2 3 | 3 2 1 4 3 2 1 3 |

    - Ruka nikad ne počinje palcem: palac na crnoj dirki je nezgodan, pa prstored počinje
      iz sredine obrasca.
    - Podsetnik: u srpskom je B♭ prosto **B**, E♭ je **Es**, A♭ je **As**, D♭ je **Des**.
