id: K-024
track: K
order: 24
title: {en: "Seventh-chord inversions at the keys (ii65, V43, V42)", sr: "Obrtaji septakorda za klavirom (ii65, V43, V42)"}
prereqs: [T-038, K-023]
minutes: 15
tags: [keys, harmony, inversions, voice-leading, figured-bass]
explain:
  en: |
    In figured bass (T-038) the inversions of a seventh chord are named by intervals above the
    bass: **6/5** (3rd in the bass), **4/3** (5th in the bass), **4/2** (7th in the bass). At the
    keyboard the point of inversions is the **bass line**: they let the bass move by step
    instead of jumping between roots. Three of them do most of the work.

    | numeral | in C | bass note | typical job |
    |---|---|---|---|
    | V43 | G7 over D | 2 | passing between I and I6 (bass 1–2–3) |
    | ii65 | Dm7 over F | 4 | predominant, bass 4 steps up to 5 |
    | V42 | G7 over F | 4 (the 7th) | bass 4 falls to 3, so it goes to **I6** |

    **Phrase 1**, a bass that climbs C–D–E–F–G and then cadences:

    ```abc
    X:1
    L:1/4
    K:C
    [C,Gce] [D,GBf] [E,Gce] [F,Acd] | [G,GBdf]2 [C,Gce]2 |]
    ```

    I – V43 – I6 – ii65 – V7 – I. Look at the right hand: G stays put for most of the phrase,
    and every other note moves by a step. The 7th of V43 (F) falls to E; the 7th of ii65 (C)
    falls to B. Sevenths **resolve down by step**, whatever inversion they are in.

    **Phrase 2**, where the 7th is in the bass:

    ```abc
    X:1
    L:1/4
    K:C
    [C,Gce] [F,Acf] [F,GBd] [E,Gce] |]
    ```

    I – IV – V42 – I6. The bass F is held from IV into V42 and then falls to E. Because the
    bass of V42 is the dissonant 7th, V42 almost always goes to I6, never to root-position I.

    The hand feels these as small adjustments of one position, which is why inversions are
    what pianists actually play in accompaniments, hymns and pop ballads with a walking bass.
  sr: |
    U generalbasu (T-038) obrtaji septakorda se imenuju po intervalima iznad basa:
    **kvintsekstakord 6/5** (terca u basu), **terckvartakord 4/3** (kvinta u basu),
    **sekundakord 4/2** (septima u basu). Za klavirom je smisao obrtaja **bas linija**:
    omogućavaju da bas ide za korak umesto da skače između osnovnih tonova. Tri obrtaja rade
    najveći deo posla.

    | oznaka | u C-duru | ton u basu | tipična uloga |
    |---|---|---|---|
    | V43 | G7 iznad D | 2 | prolaz između I i I6 (bas 1–2–3) |
    | ii65 | Dm7 iznad F | 4 | predominanta, bas ide korakom 4–5 |
    | V42 | G7 iznad F | 4 (septima) | bas 4 pada na 3, pa ide u **I6** |

    **Fraza 1**, bas koji se penje C–D–E–F–G i onda pravi kadencu:

    ```abc
    X:1
    L:1/4
    K:C
    [C,Gce] [D,GBf] [E,Gce] [F,Acd] | [G,GBdf]2 [C,Gce]2 |]
    ```

    I – V43 – I6 – ii65 – V7 – I. Pogledaj desnu ruku: G stoji skoro celu frazu, a svaki drugi
    ton se pomera za korak. Septima od V43 (F) pada na E; septima od ii65 (C) pada na H.
    Septime se **razrešavaju za korak naniže**, u kom god obrtaju bile.

    **Fraza 2**, sa septimom u basu:

    ```abc
    X:1
    L:1/4
    K:C
    [C,Gce] [F,Acf] [F,GBd] [E,Gce] |]
    ```

    I – IV – V42 – I6. Bas F se zadržava iz IV u V42 i onda pada na E. Pošto je bas sekundakorda
    disonantna septima, V42 skoro uvek ide u I6, nikad u I u osnovnom položaju.

    Ruka ovo oseća kao male pomake jednog položaja; zato su obrtaji ono što pijanisti zaista
    sviraju u pratnjama, horalima i pop baladama sa basom koji korača.
exercises:
  - id: K-024-1
    type: mcq
    prompt: {en: "In C, D in the bass with G, B and F above it. Which numeral?", sr: "U C-duru, D u basu, iznad njega G, H i F. Koja oznaka?"}
    options: ["V43", "V65", "V42", "ii65"]
    answer: 0
    checks:
      - chord: {notes: [D3, G4, B4, F5], root: G, quality: "7", inversion: 2}
      - interval: {from: D3, to: G3, is: P4}
      - interval: {from: D3, to: F3, is: m3}
  - id: K-024-2
    type: mcq
    prompt: {en: "V42 has the chord's 7th in the bass. Where does that bass note normally go?", sr: "V42 ima septimu akorda u basu. Kuda taj ton basa obično ide?"}
    options:
      - {en: "Down a step, to the 3rd of I (so the next chord is I6)", sr: "Za korak naniže, na tercu od I (pa je sledeći akord I6)"}
      - {en: "Up a step, to the 5th of I", sr: "Za korak naviše, na kvintu od I"}
      - {en: "Down a fifth, to the tonic", sr: "Kvintu naniže, na toniku"}
      - {en: "It stays and becomes the root of I", sr: "Ostaje i postaje osnovni ton od I"}
    answer: 0
    checks:
      - chord: {notes: [F3, G4, B4, D5], root: G, quality: "7", inversion: 3}
      - chord: {notes: [E3, G4, C5, E5], root: C, quality: maj, inversion: 1}
      - semitones: {from: E3, to: F3, is: 1}
