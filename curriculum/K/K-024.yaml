    type: midi-play
    prompt: {en: "Phrase 1 in C: I – V43 – I6 – ii65 – V7 – I as in the first example, one chord per beat at ♩=60.", sr: "Fraza 1 u C-duru: I – V43 – I6 – ii65 – V7 – I kao u prvom primeru, jedan akord po dobi, ♩=60."}
