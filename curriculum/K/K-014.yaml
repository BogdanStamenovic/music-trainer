id: K-014
track: K
order: 14
title: {en: "Minor scales: harmonic and melodic in G, C, F#, B", sr: "Molske lestvice: harmonska i melodijska u g, c, fis i h-molu"}
prereqs: [K-010]
minutes: 15
tags: [keys, scales, minor]
explain:
  en: |
    In K-010 you raised the 7th of natural minor to get a leading tone: **harmonic minor**. That
    creates a new problem: between the 6th and the raised 7th there is now an **augmented 2nd**
    (three half steps, e.g. E♭–F♯ in G minor). It sounds "exotic" and is awkward to sing.

    **Melodic minor** fixes it by raising the 6th as well, but only on the way **up** (where the
    melody heads for the tonic and needs the leading tone). On the way **down** there is nothing
    to lead to, so it returns to natural minor.

    | key | signature | harmonic: raise 7 | melodic up: raise 6 and 7 |
    |---|---|---|---|
    | G minor | B♭ E♭ | F♯ | E, F♯ |
    | C minor | B♭ E♭ A♭ | B | A, B |
    | F♯ minor | F♯ C♯ G♯ | **E♯** | D♯, E♯ |
    | B minor | F♯ C♯ | A♯ | G♯, A♯ |

    Spelling matters: the leading tone of F♯ minor is **E♯**, not F. Every letter appears once
    in a scale, and F♯ is already the tonic. On the keyboard E♯ is the white key F.

    Fingering (one octave, ascending):

    | key | right hand | left hand |
    |---|---|---|
    | G minor | 1 2 3 1 2 3 4 5 | 5 4 3 2 1 3 2 1 |
    | C minor | 1 2 3 1 2 3 4 5 | 5 4 3 2 1 3 2 1 |
    | F♯ minor | 3 4 1 2 3 1 2 3 | 4 3 2 1 3 2 1 4 |
    | B minor | 1 2 3 1 2 3 4 5 | 4 3 2 1 4 3 2 1 |

    The table is for harmonic minor. Melodic minor ascending uses the same fingering, except
    F♯ melodic, where D♯ is black: right hand 3 4 1 2 3 4 1 2 (thumbs on A and E♯).
    The rule behind the F♯ fingering: thumbs only on white keys. Practise slowly with a click;
    unevenness shows first at the thumb crossing and at the augmented 2nd.
  sr: |
    U K-010 povisio si 7. stupanj prirodnog mola da dobiješ vođicu: **harmonski mol**. To stvara
    novi problem: između 6. i povišenog 7. stupnja sada je **prekomerna sekunda** (tri
    polustepena, npr. Es–Fis u g-molu). Zvuči "egzotično" i nezgodno se peva.

    **Melodijski mol** to rešava povišenjem i 6. stupnja, ali samo **uzlazno** (gde melodija ide
    ka tonici i treba joj vođica). **Silazno** nema kuda da vodi, pa se vraća na prirodni mol.

    | tonalitet | predznaci | harmonski: povisi 7 | melodijski uzlazno: povisi 6 i 7 |
    |---|---|---|---|
    | g-mol | B Es | Fis | E, Fis |
    | c-mol | B Es As | H | A, H |
    | fis-mol | Fis Cis Gis | **Eis** | Dis, Eis |
    | h-mol | Fis Cis | Ais | Gis, Ais |

    Pravopis je važan: vođica fis-mola je **Eis**, a ne F. Svako slovo se u lestvici javlja
    jednom, a Fis je već tonika. Na klavijaturi je Eis bela dirka F.

    Prstored (jedna oktava, uzlazno):

    | tonalitet | desna ruka | leva ruka |
    |---|---|---|
    | g-mol | 1 2 3 1 2 3 4 5 | 5 4 3 2 1 3 2 1 |
    | c-mol | 1 2 3 1 2 3 4 5 | 5 4 3 2 1 3 2 1 |
    | fis-mol | 3 4 1 2 3 1 2 3 | 4 3 2 1 3 2 1 4 |
    | h-mol | 1 2 3 1 2 3 4 5 | 4 3 2 1 4 3 2 1 |

    Tabela važi za harmonski mol. Melodijski mol uzlazno ima isti prstored, osim fis-mola
    melodijskog, gde je Dis crna dirka: desna ruka 3 4 1 2 3 4 1 2 (palčevi na A i Eis).
    Pravilo iza prstoreda za fis-mol: palac samo na belim dirkama. Vežbaj polako uz metronom;
    neravnina se prvo čuje kod podmetanja palca i na prekomernoj sekundi.
exercises:
  - id: K-014-1
    type: generated
    prompt: {en: "Spell the harmonic minor scale", sr: "Napiši harmonsku molsku lestvicu"}
    count: 3
    gen: {kind: scale-build, types: [harmonic-minor], tonics: [G, C, "F#", B], answer: name}
    checks:
      - keysig: {key: G, mode: minor, is: -2}
      - keysig: {key: C, mode: minor, is: -3}
      - keysig: {key: "F#", mode: minor, is: 3}
      - keysig: {key: B, mode: minor, is: 2}
      - scale: {tonic: G, type: harmonic-minor, is: [G, A, Bb, C, D, Eb, "F#"]}
      - scale: {tonic: C, type: harmonic-minor, is: [C, D, Eb, F, G, Ab, B]}
      - scale: {tonic: "F#", type: harmonic-minor, is: ["F#", "G#", A, B, "C#", D, "E#"]}
      - scale: {tonic: B, type: harmonic-minor, is: [B, "C#", D, E, "F#", G, "A#"]}
      - scale: {tonic: G, type: melodic-minor, is: [G, A, Bb, C, D, E, "F#"]}
      - scale: {tonic: C, type: melodic-minor, is: [C, D, Eb, F, G, A, B]}
      - scale: {tonic: "F#", type: melodic-minor, is: ["F#", "G#", A, B, "C#", "D#", "E#"]}
      - scale: {tonic: B, type: melodic-minor, is: [B, "C#", D, E, "F#", "G#", "A#"]}
  - id: K-014-2
    type: mcq
    prompt: {en: "In G harmonic minor, what is the interval E♭–F♯?", sr: "U harmonskom g-molu, koji je interval Es–Fis?"}
    options:
      - {en: "minor 3rd", sr: "mala terca"}
      - {en: "augmented 2nd", sr: "prekomerna sekunda"}
      - {en: "major 2nd", sr: "velika sekunda"}
      - {en: "diminished 3rd", sr: "smanjena terca"}
    answer: 1
    checks:
      - interval: {from: Eb4, to: "F#4", is: A2}
      - semitones: {from: Eb4, to: "F#4", is: 3}
  - id: K-014-3
    type: generated
    prompt: {en: "Harmonic minor, right hand, ♩=80", sr: "Harmonski mol, desna ruka, ♩=80"}
    count: 4
    gen: {kind: scale-build, types: [harmonic-minor], tonics: [G, C, "F#", B], answer: play, tempo: 80}
  - id: K-014-4
    type: generated
    prompt: {en: "Melodic minor ascending (raised 6th and 7th), ♩=80", sr: "Melodijski mol uzlazno (povišeni 6. i 7. stupanj), ♩=80"}
    count: 3
    gen: {kind: scale-build, types: [melodic-minor], tonics: [G, C, "F#", B], answer: play, tempo: 80}
  - id: K-014-5
    type: generated
    prompt: {en: "Melodic minor descending (comes down as natural minor)", sr: "Melodijski mol silazno (silazi kao prirodni mol)"}
    count: 3
    gen: {kind: scale-build, types: [melodic-minor], tonics: [G, C, "F#", B], answer: play, descending: true}
  - id: K-014-6
    type: midi-play
    prompt: {en: "Left hand: F♯ harmonic minor from F♯2 (fingers 4 3 2 1 3 2 1 4).", sr: "Leva ruka: fis-mol harmonski od Fis2 (prsti 4 3 2 1 3 2 1 4)."}
    mode: sequence
    derive: {scale: {tonic: "F#2", type: harmonic-minor}}
    showNotes: false
  - id: K-014-7
    type: mcq
    prompt: {en: "The leading tone of F♯ minor is spelled…", sr: "Vođica fis-mola se piše…"}
    options: ["F", "E#", "E", "D#"]
    answer: 1
    checks:
      - interval: {from: "E#4", to: "F#4", is: m2}
