id: K-039
track: K
order: 39
title: {en: "Dorian: the scale and a ii–V vamp", sr: "Dorski modus: lestvica i ii–V vamp"}
prereqs: [K-033]
minutes: 13
tags: [keys, modes, dorian, comping]
explain:
  en: |
    Play the white keys from D to D. That is **D dorian**: D E F G A B C D. Compare it with
    D natural minor (D E F G A **B♭** C D): one note differs. Dorian is **minor with a raised
    6th**. That B♮ is the whole character of the mode: minor, but brighter and less sad than
    natural minor. You know it from "Scarborough Fair", "Oye Como Va", a lot of funk and
    almost every modal jazz tune.

    | degree | 1 | 2 | ♭3 | 4 | 5 | **6** | ♭7 |
    |---|---|---|---|---|---|---|---|
    | D dorian | D | E | F | G | A | **B** | C |
    | D natural minor | D | E | F | G | A | B♭ | C |

    **The vamp.** A dorian tune often sits on two chords for a long time: **Dm7 – G7**. In
    D dorian these are i7 and IV7, and the G7 is where the B lives (its 3rd). The same two
    chords are ii7 – V7 in C major, which is why players call it a "ii–V vamp"; but because
    G7 never resolves to C, the ear keeps hearing **D** as home.

    A left-hand-plus-right-hand voicing that moves as little as possible:

    | | Dm7 | G7 |
    |---|---|---|
    | left hand | D3 | G2 |
    | right hand | C4 F4 A4 | B3 F4 G4 |

    C drops a half step to B (7th of Dm7 → 3rd of G7), F stays (3rd → 7th), A drops to G.
    Comp it in the **Charleston rhythm**: a chord on beat 1, the next one on the "and" of 2,
    and leave beats 3 and 4 empty.

    ```abc
    X:1
    M:4/4
    L:1/8
    K:Ddor
    "Dm7"[D,CFA]3 [D,CFA] z4 | "G7"[G,,B,FG]3 [G,,B,FG] z4 |]
    ```

    The empty half-bar is the point: it leaves space for a melody (yours, in K-040).
  sr: |
    Odsviraj bele dirke od D do D. To je **D dorski**: D E F G A H C D. Uporedi ga sa
    prirodnim d-molom (D E F G A **B** C D): razlikuje se jedan ton. Dorski je **mol sa
    povišenim 6. stupnjem**. To H je ceo karakter modusa: mol, ali svetliji i manje tužan od
    prirodnog mola. Znaš ga iz "Scarborough Fair", "Oye Como Va", mnogo fanka i skoro svake
    modalne džez teme.

    | stupanj | 1 | 2 | ♭3 | 4 | 5 | **6** | ♭7 |
    |---|---|---|---|---|---|---|---|
    | D dorski | D | E | F | G | A | **H** | C |
    | prirodni d-mol | D | E | F | G | A | B | C |

    **Vamp.** Dorska pesma često dugo stoji na dva akorda: **Dm7 – G7**. U D dorskom to su
    i7 i IV7, a u G7 živi H (njegova terca). Ista dva akorda su ii7 – V7 u C-duru, zato ga
    svirači zovu "ii–V vamp"; ali pošto se G7 nikad ne razreši u C, uho i dalje čuje **D**
    kao kuću.

    Raspored za levu i desnu ruku koji se pomera što manje:

    | | Dm7 | G7 |
    |---|---|---|
    | leva ruka | D3 | G2 |
    | desna ruka | C4 F4 A4 | H3 F4 G4 |

    C pada za polustepen na H (septima od Dm7 → terca od G7), F ostaje (terca → septima), A
    pada na G. Prati ga u **čarlston ritmu**: akord na prvu dobu, sledeći na "i" posle druge
    dobe, a treća i četvrta doba ostaju prazne.

    ```abc
    X:1
    M:4/4
    L:1/8
    K:Ddor
    "Dm7"[D,CFA]3 [D,CFA] z4 | "G7"[G,,B,FG]3 [G,,B,FG] z4 |]
    ```

    Prazna polovina takta je poenta: ostavlja mesto za melodiju (tvoju, u K-040).
exercises:
  - id: K-039-1
    type: mcq
    prompt: {en: "D dorian and D natural minor differ in one note. Which?", sr: "D dorski i prirodni d-mol se razlikuju u jednom tonu. Kojem?"}
    options:
      - {en: "The 6th: B in dorian, B♭ in natural minor", sr: "6. stupanj: H u dorskom, B u prirodnom molu"}
      - {en: "The 7th: C♯ in dorian, C in natural minor", sr: "7. stupanj: Cis u dorskom, C u prirodnom molu"}
      - {en: "The 3rd: F♯ in dorian, F in natural minor", sr: "3. stupanj: Fis u dorskom, F u prirodnom molu"}
      - {en: "The 2nd: E♭ in dorian, E in natural minor", sr: "2. stupanj: Es u dorskom, E u prirodnom molu"}
    answer: 0
    checks:
      - scale: {tonic: D, type: dorian, is: [D, E, F, G, A, B, C]}
      - scale: {tonic: D, type: natural-minor, is: [D, E, F, G, A, Bb, C]}
      - interval: {from: D4, to: B4, is: M6}
