id: K-040
track: K
order: 40
title: {en: "Improvising in D dorian over Dm7–G7", sr: "Improvizacija u D dorskom preko Dm7–G7"}
prereqs: [K-039]
minutes: 15
tags: [keys, improvisation, modes, dorian]
explain:
  en: |
    Over the vamp from K-039 every white key is "in the scale", so wrong notes are not the
    problem. The problem is that seven safe notes with no direction sound like noodling. Three
    things give a dorian line its shape:

    **1. Land on the guide tones.** The two chords share F; they differ in one half step,
    **C (7th of Dm7) → B (3rd of G7)**. Aim for C or F at the start of a Dm7 bar and for **B**
    at the start of a G7 bar, and the line follows the harmony even with no left hand.

    **2. Feature the 6th.** B over Dm7 is the dorian colour note (the 6th). Holding it over
    Dm7 is what makes the line sound dorian rather than plain minor. Over G7, B is simply the
    3rd.

    **3. Treat C over G7 as a passing note.** C is a 4th above G and a half step above B, the
    3rd. Held on a G7 downbeat it clashes with the chord's B; passing through it is fine.

    | note | over Dm7 | over G7 |
    |---|---|---|
    | D | root | 5th |
    | F | 3rd | 7th |
    | A | 5th | 9th (colour) |
    | C | 7th | 4th: pass through, do not land |
    | **B** | **6th: the dorian colour** | **3rd: the landing note** |
    | E, G | 9th, 11th (colour) | 13th, root |

    A two-bar model phrase: up the Dm7 arpeggio, then B on the G7 downbeat.

    ```abc
    X:1
    M:4/4
    L:1/8
    K:Ddor
    "Dm7"D E F A c2 A F | "G7"B2 A G F2 D2 |]
    ```

    Same plan as K-028: play two bars, leave two bars of rest, answer yourself.
  sr: |
    Preko vampa iz K-039 svaka bela dirka je "u lestvici", pa pogrešni tonovi nisu problem.
    Problem je što sedam sigurnih tonova bez pravca zvuči kao bauljanje. Tri stvari daju
    dorskoj liniji oblik:

    **1. Sleti na ključne tonove.** Dva akorda dele F; razlikuju se u jednom polustepenu,
    **C (septima od Dm7) → H (terca od G7)**. Ciljaj C ili F na početku takta sa Dm7 i **H**
    na početku takta sa G7, i linija prati harmoniju i bez leve ruke.

    **2. Istakni sekstu.** H preko Dm7 je dorski ton boje (seksta). Držanje tog tona preko
    Dm7 čini da linija zvuči dorski, a ne kao običan mol. Preko G7, H je prosto terca.

    **3. C preko G7 je prolaznica.** C je kvarta iznad G i polustepen iznad H, terce. Držano
    na prvoj dobi G7 sudara se sa H u akordu; prolaziti kroz njega je u redu.

    | ton | preko Dm7 | preko G7 |
    |---|---|---|
    | D | osnovni ton | kvinta |
    | F | terca | septima |
    | A | kvinta | nona (boja) |
    | C | septima | kvarta: prođi, ne sleći |
    | **H** | **seksta: dorska boja** | **terca: ton za sletanje** |
    | E, G | nona, undecima (boja) | tercdecima, osnovni ton |

    Model fraza od dva takta: naviše kroz arpeđo Dm7, pa H na prvu dobu G7.

    ```abc
    X:1
    M:4/4
    L:1/8
    K:Ddor
    "Dm7"D E F A c2 A F | "G7"B2 A G F2 D2 |]
    ```

    Isti plan kao u K-028: dva takta sviraš, dva takta pauza, pa sam sebi odgovoriš.
