id: E-032
track: E
order: 34
title: {en: "Pop progressions by ear (I–V–vi–IV family)", sr: "Pop progresije po sluhu (porodica I–V–vi–IV)"}
prereqs: [E-031, E-016]
minutes: 14
tags: [ear, harmony, progressions, pop]
explain:
  en: |
    I – V – vi – IV (in C: C G Am F) is the loop under a long list of hits: "Let It Be" (verse),
    "With or Without You", "Don't Stop Believin'", "Someone Like You". You met it in E-016. This
    lesson is about its **family**: the same four chords in another order, small substitutions, and
    one borrowed chord.

    **1. Rotations.** A loop has no fixed start. Start the same cycle on a different chord and the
    mood changes:

    | start | in C | feel | example |
    |---|---|---|---|
    | I – V – vi – IV | C G Am F | bright, anthem | "Let It Be" verse |
    | vi – IV – I – V | Am F C G | sadder, minor-sounding | "Zombie" (Em C G D in G) |
    | IV – I – V – vi | F C G Am | floating, never quite home | |

    To tell the rotations apart, ask **which chord sounds like home** and where it falls. In
    vi – IV – I – V the home chord is third, so the loop sounds like it starts away from home.

    **2. Inversions in pop.** I – **V6** – vi – IV puts B in the bass: the bass walks C B A, then
    jumps to F. Pianists and bass players do this all the time.

    **3. The borrowed ♭VII.** In C, B♭ major is not in the key, but rock uses it constantly:
    I – ♭VII – IV – I (C B♭ F C), as in the coda of "Hey Jude" or the opening of "Sweet Child o'
    Mine" (D C G D in D). It sounds like a major-key song with a bluesy, Mixolydian tilt. The bass
    falls a whole step from 1, where V would leap down a fourth.

    How to listen: **bass first** (hum it), **then find the minor chord** (vi is the only one in the
    loop), **then home**: which chord could end the song?
  sr: |
    I – V – vi – IV (u C-duru: C G a F) je petlja ispod dugog spiska hitova: „Let It Be" (strofa),
    „With or Without You", „Don't Stop Believin'", „Someone Like You". Upoznao si je u E-016. Ova
    lekcija je o njenoj **porodici**: ista četiri akorda drugim redom, male zamene i jedan pozajmljeni
    akord.

    **1. Rotacije.** Petlja nema stalan početak. Počni isti krug na drugom akordu i raspoloženje se
    menja:

    | početak | u C-duru | osećaj | primer |
    |---|---|---|---|
    | I – V – vi – IV | C G a F | svetlo, himna | „Let It Be", strofa |
    | vi – IV – I – V | a F C G | tužnije, zvuči molski | „Zombie" (e C G D u G-duru) |
    | IV – I – V – vi | F C G a | lebdi, nikad sasvim kod kuće | |

    Da razlikuješ rotacije, pitaj **koji akord zvuči kao kuća** i gde pada. U vi – IV – I – V kućni
    akord je treći, pa petlja zvuči kao da počinje daleko od kuće.

    **2. Obrtaji u popu.** I – **V6** – vi – IV stavlja H u bas: bas hoda C H A, pa skače na F.
    Pijanisti i basisti to rade stalno.

    **3. Pozajmljeni ♭VII.** U C-duru B-dur nije u tonalitetu, ali ga rok stalno koristi:
    I – ♭VII – IV – I (C B F C), kao u kodi „Hey Jude" ili na početku „Sweet Child o' Mine" (D C G D
    u D-duru). Zvuči kao durska pesma sa bluzerskim, miksolidijskim nagibom. Bas pada za ceo stepen
    od 1, tamo gde bi V skočio kvartu naniže.

    Kako da slušaš: **prvo bas** (otpevuši ga), **onda nađi molski akord** (vi je jedini u petlji),
    **onda kuću**: kojim akordom bi pesma mogla da se završi?
