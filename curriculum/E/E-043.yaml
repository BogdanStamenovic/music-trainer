id: E-043
track: E
order: 45
title: {en: "Rhythm dictation: 6/8 and swing feel", sr: "Ritmički diktat: 6/8 i sving"}
prereqs: [E-042, E-031]
minutes: 13
tags: [ear, rhythm, dictation, compound-meter, swing]
explain:
  en: |
    Two kinds of rhythm split the beat into **three** instead of two.

    **6/8** has two beats per bar, each a dotted quarter split into three eighths. Count it
    "**1** la li **2** la li". The cells to know:

    ```abc
    X:1
    M:6/8
    L:1/8
    K:C clef=perc
    "^dotted quarter" B3 "^three eighths" B B B | "^long-short" B2 B "^short-long" B B2 | "^siciliano" B3/2 B/ B B3 |]
    ```

    The **long-short** cell (quarter + eighth) is the lilt of jigs, lullabies and folk ballads. If
    you hear a rhythm that rocks rather than marches, think 6/8.

    **Swing** is the same idea inside 4/4. Jazz and blues write plain eighths but play them
    **long-short**, the first of each pair about twice as long as the second. That is a quarter +
    eighth inside an eighth-note *triplet*, which is why swing is often written as 12/8 in
    textbooks: each beat is a 6/8 half-bar.

    How this app handles it: the grader compares your taps to written onsets, so a swung pair is
    represented as **2/3 + 1/3 of a beat** (the triplet long-short). Real players vary the ratio
    (closer to even at fast tempos, sharper in a shuffle); here 2:1 is the target, and the grader
    fits your timing to it. Notation stays hidden for swing items, because swing is written as
    plain eighths.

    Do not confuse swing with the **dotted eighth + sixteenth** (3:1): sharper and jerkier, the
    "march" or "Scotch" snap.
  sr: |
    Dve vrste ritma dele dobu na **tri** umesto na dva.

    **6/8** ima dve dobe u taktu, svaka je četvrtina s tačkom podeljena na tri osmine. Broji
    „**1** la li **2** la li". Ćelije koje treba znati:

    ```abc
    X:1
    M:6/8
    L:1/8
    K:C clef=perc
    "^četvrtina s tačkom" B3 "^tri osmine" B B B | "^dugo-kratko" B2 B "^kratko-dugo" B B2 | "^siciliana" B3/2 B/ B B3 |]
    ```

    Ćelija **dugo-kratko** (četvrtina + osmina) je ljuljanje igara, uspavanki i narodnih balada. Ako
    čuješ ritam koji se njiše umesto da maršira, misli na 6/8.

    **Sving** je ista ideja unutar 4/4. Džez i bluz pišu obične osmine, ali ih sviraju **dugo-kratko**:
    prva u paru traje oko dvaput duže od druge. To je četvrtina + osmina unutar osminske *triole*, pa
    se sving u udžbenicima često piše kao 12/8: svaka doba je polovina takta 6/8.

    Kako aplikacija to radi: ocenjivač poredi tvoje udare sa zapisanim početcima tonova, pa je par u
    svingu predstavljen kao **2/3 + 1/3 dobe** (dugo-kratko u trioli). Pravi muzičari menjaju odnos
    (bliže ravnom u brzom tempu, oštrije u šafl ritmu); ovde je cilj 2:1, a ocenjivač tvoj ritam
    poredi sa tim. Note su skrivene za sving primere, jer se sving piše kao obične osmine.

    Ne mešaj sving sa **osminom s tačkom + šesnaestinom** (3:1): oštrije i trzavije, „marš" ili
    „škotski" udar.
