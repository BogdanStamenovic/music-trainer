    prompt: {en: "ii (minor) or V/V (major) before the V?", sr: "ii (molski) ili V/V (durski) pre V?"}
    count: 6
    gen: {kind: progression-ear, keys: [C, G, F, D], type: major, options: [[I, ii, V, I], [I, V/V, V, I]], tempo: 60}
    checks:
      - chord: {notes: [D3, F#3, A3], root: D, quality: maj}
      - chord: {notes: [D3, F3, A3], root: D, quality: min}
      - chord: {notes: [D3, F#4, C5, D5], root: D, quality: "7"}
      - interval: {from: F#4, to: G4, is: m2}
      - interval: {from: C5, to: B4, is: m2}
      - roman: {key: C, degree: 2, is: "ii"}
      - roman: {key: G, degree: 5, is: "V"}
