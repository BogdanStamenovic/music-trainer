id: E-029
track: E
order: 31
title: {en: "Hearing V/V before V", sr: "Čuti V/V pre V"}
prereqs: [E-028, T-043]
minutes: 13
tags: [ear, harmony, secondary-dominants]
explain:
  en: |
    In C major the chord on 2 is D minor (D F A). Raise the F to **F#** and it becomes D major:
    **V/V**, "five of five", the dominant of G. F# is the leading tone of G, so for a moment G sounds
    like a tonic that you are being pulled into. Then G (V) goes home to C as usual.

    ```abc
    X:1
    L:1/2
    K:C
    [C,EGc] [D,^FAc] [G,,GBd] [C,Gce] |]
    ```

    I – V7/V – V – I. Follow the lowest note of the right hand: **E – F# – G**. That half step F# → G
    is the fingerprint of V/V.

    What to listen for:

    1. **A major chord where ii should be minor.** The bass is the same (2 → 5), so the bass alone
       will not tell you. The colour does: V/V is bright and pushes forward; ii is soft.
    2. **A chromatic note rising by half step.** The F# is not in the C scale. Hum the inner voice and
       you will hear it climb into G.
    3. **Where it goes.** V/V almost always goes to V (often through a cadential pause there) and then
       to I. The arrival on V feels stronger than usual, like a half cadence with an exclamation mark.

    With the seventh (V7/V, D F# A C) the C falls to B while the F# rises to G: the same two-way pull
    as V7 – I, now aimed at V.
  sr: |
    U C-duru akord na 2. stupnju je d-mol (D F A). Povisi F u **Fis** i dobijaš D-dur: **V/V**,
    „dominanta dominante" (dvostruka dominanta), dominanta od G. Fis je vođica ka G, pa na trenutak G
    zvuči kao tonika ka kojoj te vuče. Onda G (V) ide kući na C kao i obično.

    ```abc
    X:1
    L:1/2
    K:C
    [C,EGc] [D,^FAc] [G,,GBd] [C,Gce] |]
    ```

    I – V7/V – V – I. Prati najdublji ton desne ruke: **E – Fis – G**. Taj polustepen Fis → G je
    otisak prsta za V/V.

    Šta da slušaš:

    1. **Durski akord tamo gde bi ii bio molski.** Bas je isti (2 → 5), pa sam bas neće reći. Boja hoće:
       V/V je svetao i gura napred; ii je mek.
    2. **Hromatski ton koji se penje polustepenom.** Fis nije u C-dur lestvici. Otpevuši unutrašnji
       glas i čućeš kako se penje u G.
    3. **Kuda ide.** V/V skoro uvek ide na V (često sa zastankom na njemu), pa onda na I. Dolazak na V
       zvuči jače nego inače, kao polukadenca sa uzvičnikom.

    Sa septimom (V7/V, D Fis A C) C pada na H, dok se Fis penje na G: isto dvostruko privlačenje kao
    V7 – I, sada usmereno ka V.
