      - chord: {notes: [G3, B3, D4, F4], root: G, quality: "7"}
      - chord: {notes: [E3, G#3, B3, D4], root: E, quality: "7"}
      - interval: {from: B3, to: F4, is: d5}
      - interval: {from: B3, to: C4, is: m2}
      - interval: {from: E4, to: F4, is: m2}
      - interval: {from: C3, to: G3, is: P5}
      - interval: {from: G3, to: C4, is: P4}
      - roman: {key: C, degree: 5, is: "V"}
