id: E-020
track: E
order: 20
title: {en: "Bass line + chords: hear V7 resolving", sr: "Bas linija + akordi: čuj razrešenje V7"}
prereqs: [E-019, E-016, T-020]
minutes: 14
tags: [ear, harmony, bass]
explain:
  en: |
    V7 is V with one more note: in C, G–B–D plus **F**. That F is scale degree 4, and together with
    the leading tone B it forms a **tritone** (B–F). The tritone is what makes V7 sound like it
    *must* move, and both notes have an obvious way out:

    ```abc
    X:1
    L:1/2
    K:C
    [G,FB] [C,Ec] |]
    ```

    - **B rises a half step to C** (7 → 8).
    - **F falls a half step to E** (4 → 3).
    - **The bass falls a fifth (or rises a fourth), G to C** (5 → 1).

    So V7 – I is two half steps closing in plus the strongest bass move there is. To hear it:

    1. **Bass first.** Hum the lowest notes. 5 → 1 is the "full stop"; 5 → 6 (V7 – vi) is the deceptive
       step up you met in E-016; 4 → 1 is the softer plagal "amen" (IV – I).
    2. **Plain V or V7?** Listen to the top of the V chord. V7 has an extra edge, a rub in the
       middle of the chord, and the resolution feels more urgent. Plain V sounds cleaner and more open.
    3. **Follow one inner voice.** Hum the F of V7 and feel it sink to E. Once you can hear that
       single half step, V7 is unmistakable.

    In minor the same V7 appears (E–G#–B–D in A minor): the major V with its leading tone is what
    makes minor cadences work.
  sr: |
    V7 je V sa još jednim tonom: u C-duru, G–H–D plus **F**. To F je 4. stupanj, i zajedno sa
    vođicom H gradi **tritonus** (H–F). Tritonus čini da V7 zvuči kao da *mora* da se pomeri, a oba
    tona imaju očigledan izlaz:

    ```abc
    X:1
    L:1/2
    K:C
    [G,FB] [C,Ec] |]
    ```

    - **H se penje pola stepena na C** (7 → 8).
    - **F pada pola stepena na E** (4 → 3).
    - **Bas pada za kvintu (ili se penje za kvartu), G u C** (5 → 1).

    Dakle V7 – I su dva polustepena koja se zatvaraju, plus najjači pokret basa koji postoji. Kako da
    ga čuješ:

    1. **Prvo bas.** Otpevuši najdublje tonove. 5 → 1 je „tačka"; 5 → 6 (V7 – vi) je varljiv korak
       naviše iz E-016; 4 → 1 je mekši plagalni „amin" (IV – I).
    2. **Obično V ili V7?** Slušaj vrh akorda V. V7 ima dodatnu oštrinu, trenje u sredini akorda, a
       razrešenje deluje hitnije. Obično V zvuči čistije i otvorenije.
    3. **Prati jedan unutrašnji glas.** Otpevuši F iz V7 i oseti kako tone na E. Kad čuješ taj jedan
       polustepen, V7 više ne možeš da pomešaš.

    U molu se pojavljuje isti V7 (E–Gis–H–D u a-molu): durski V sa vođicom je ono što čini da molske
    kadence funkcionišu.
