  - id: E-045-1
    type: generated
    prompt: {en: "12 bars compressed (one chord per bar): quick change or not?", sr: "12 taktova sažeto (jedan akord po taktu): brza promena ili ne?"}
    count: 6
    gen: {kind: progression-ear, keys: [C, F, G, Bb], type: major, options: [[I7, IV7, I7, I7, IV7, IV7, I7, I7, V7, IV7, I7, V7], [I7, I7, I7, I7, IV7, IV7, I7, I7, V7, IV7, I7, V7]], tempo: 96, smooth: true}
    checks:
      - numeral: {key: C, is: "I7", notes: [C3, E3, G3, Bb3]}
      - numeral: {key: C, is: "IV7", notes: [F3, A3, C4, Eb4]}
      - numeral: {key: C, is: "V7", notes: [G3, B3, D4, F4]}
      - chord: {notes: [C3, E3, G3, Bb3], root: C, quality: "7"}
      - interval: {from: C3, to: Bb3, is: m7}
