    type: practice
    prompt: {en: "Put on any 12-bar blues recording (search \"12 bar blues\" plus an artist you like). Count bars out loud through two choruses. Mark: quick change or not, what bars 9–10 do, and what the turnaround sounds like. Then play along in the record's key.", sr: "Pusti bilo koji snimak bluza od 12 taktova (potraži „12 bar blues” i izvođača koga voliš). Broji taktove naglas kroz dva kruga. Zabeleži: brza promena ili ne, šta rade taktovi 9–10 i kako zvuči turnaround. Onda sviraj uz snimak u njegovom tonalitetu."}
