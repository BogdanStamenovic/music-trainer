id: E-045
track: E
order: 45
title: {en: "Blues progression by ear (quick change, turnaround)", sr: "Bluz progresija po sluhu (brza promena, turnaround)"}
prereqs: [E-044, T-066]
minutes: 14
tags: [ear, harmony, blues]
explain:
  en: |
    The 12-bar blues uses three chords, all **dominant sevenths**: I7, IV7, V7. Even the tonic has
    the ♭7 (C7 in C: C E G B♭). That is a large part of the blues sound: home itself is a little
    restless.

    | bars 1–4 | bars 5–8 | bars 9–12 |
    |---|---|---|
    | I7 – I7 – I7 – I7 | IV7 – IV7 – I7 – I7 | V7 – IV7 – I7 – V7 |

    By ear, three places tell versions apart:

    1. **The quick change.** Bar 2 jumps to IV7 and comes back in bar 3: I7 – **IV7** – I7 – I7.
       If the music leaves home almost at once, it is a quick change.
    2. **Bars 9–10.** Usually V7 – IV7 (the bass steps *down* from 5 to 4). Older and rock versions
       stay on V7 for two bars; jazz versions use ii7 – V7.
    3. **The turnaround (bars 11–12).** The last bar has V7 so the form can start again. Played
       twice as fast it becomes I7 – IV7 – I7 – V7, or the jazz version I7 – VI7 – ii7 – V7, where
       VI7 is V7/ii from E-034.

    Above all: **count bars**. Say "1-2-3-4, 2-2-3-4, 3-2-3-4…" and note the bar number at each
    change. The first IV7 in bar 5 means a standard 12-bar; in bar 2, a quick change; the form
    might not be 12 bars at all (exercise 6).

    In exercises 1–3 the progression is compressed: **one chord per bar, one beat each**. Count the
    chords as bars.
  sr: |
    Bluz od 12 taktova koristi tri akorda, svi su **dominantni septakordi**: I7, IV7, V7. Čak i tonika
    ima ♭7 (C7 u C-duru: C E G B). To je velik deo zvuka bluza: sama kuća je pomalo nemirna.

    | taktovi 1–4 | taktovi 5–8 | taktovi 9–12 |
    |---|---|---|
    | I7 – I7 – I7 – I7 | IV7 – IV7 – I7 – I7 | V7 – IV7 – I7 – V7 |

    Po sluhu, tri mesta razlikuju verzije:

    1. **Brza promena** (quick change). Takt 2 skače na IV7 i vraća se u 3. taktu: I7 – **IV7** –
       I7 – I7. Ako muzika napusti kuću skoro odmah, to je brza promena.
    2. **Taktovi 9–10.** Obično V7 – IV7 (bas silazi *korakom* sa 5 na 4). Starije i rok verzije ostaju
       na V7 dva takta; džez verzije koriste ii7 – V7.
    3. **Turnaround (taktovi 11–12).** Poslednji takt ima V7 da bi forma mogla ponovo da počne.
       Sviran dvostruko brže postaje I7 – IV7 – I7 – V7, ili džez verzija I7 – VI7 – ii7 – V7, gde je
       VI7 zapravo V7/ii iz E-034.

    Iznad svega: **broji taktove**. Govori „1-2-3-4, 2-2-3-4, 3-2-3-4…" i zapamti broj takta na
    svakoj promeni. Prvi IV7 u 5. taktu znači standardni bluz od 12 taktova; u 2. taktu, brzu
    promenu; a forma možda uopšte nema 12 taktova (vežba 6).

    U vežbama 1–3 progresija je sažeta: **jedan akord po taktu, po jedna doba**. Broji akorde kao
    taktove.
