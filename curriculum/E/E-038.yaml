id: E-038
track: E
order: 40
title: {en: "Secondary dominants in progressions (V/V, V/vi, V/ii)", sr: "Sporedne dominante u progresijama (V/V, V/vi, V/ii)"}
prereqs: [E-034]
minutes: 14
tags: [ear, harmony, secondary-dominants]
explain:
  en: |
    In E-029 and E-034 the secondary dominants were in root position and always resolved. In real
    music two things change, and both change what you hear.

    **1. Inversions make a chromatic bass line.** Put the secondary dominant in first inversion
    (figure 65) and its **3rd**, the new leading tone, is in the bass. The bass then rises a half
    step into the target: C – **C♯** – D – **F♯** – G. A bass that climbs by half steps is the
    sound of V65/ii and V65/V. With the **7th** in the bass (figure 42) it goes the other way:
    C – **B♭** – A, the V42/IV falling into IV6.

    ```abc
    X:1
    M:4/4
    L:1/4
    K:C
    "^I"[C,EGc] "^V65/ii"[^C,EGA] "^ii"[D,DFA] "^V65/V"[^F,CDA] | "^V"[G,B,DG]4 |]
    ```

    **2. In pop they often do not resolve.** A major II (D major in C) is V/V by spelling, but in
    songs it very often goes to **IV** instead of V: I – II – IV – I. A major III (E major) may
    resolve to vi as expected, or slide up to **IV**. The ear clue is still the same: *a major
    chord where the key has a minor one*, with its sharp (F♯, G♯). Then follow the bass to see
    where it goes.

    Order of listening: (1) the bass: steps or leaps, chromatic or not; (2) which chord is major
    when it should be minor; (3) where it goes next.
  sr: |
    U E-029 i E-034 sporedne dominante su bile u osnovnom položaju i uvek su se razrešavale. U
    pravoj muzici menjaju se dve stvari, i obe menjaju ono što čuješ.

    **1. Obrtaji prave hromatsku bas liniju.** Stavi sporednu dominantu u prvi obrtaj (kvintsekst
    akord, oznaka 65) i njena **terca**, nova vođica, je u basu. Bas se onda penje polustepenom u
    cilj: C – **Cis** – D – **Fis** – G. Bas koji se penje polustepenima je zvuk V65/ii i V65/V. Sa
    **septimom** u basu (sekundakord, oznaka 42) ide na drugu stranu: C – **B** – A, V42/IV koji
    pada u IV6.

    ```abc
    X:1
    M:4/4
    L:1/4
    K:C
    "^I"[C,EGc] "^V65/ii"[^C,EGA] "^ii"[D,DFA] "^V65/V"[^F,CDA] | "^V"[G,B,DG]4 |]
    ```

    **2. U popu se često ne razrešavaju.** Durski II (D-dur u C-duru) je po građi V/V, ali u pesmama
    vrlo često ide na **IV** umesto na V: I – II – IV – I. Durski III (E-dur) može da se razreši na
    vi kako se očekuje, ili da sklizne naviše na **IV**. Trag za sluh je i dalje isti: *durski akord
    tamo gde tonalitet ima molski*, sa svojom povisilicom (Fis, Gis). Onda prati bas da vidiš kuda
    ide.

    Redosled slušanja: (1) bas: koraci ili skokovi, hromatski ili ne; (2) koji akord je durski, a
    trebalo bi da je molski; (3) kuda ide posle.
