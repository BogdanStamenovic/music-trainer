    prompt: {en: "Hold B–D–F–A♭ in the right hand and play its four resolutions: to C major (B up), E♭ major (D up), F♯ major (F up, as E♯), A minor (A♭ up, as G♯). Play each pair twice and sing the note that rises.", sr: "Drži H–D–F–As desnom rukom i odsviraj četiri razrešenja: na C-dur (H naviše), Es-dur (D naviše), Fis-dur (F naviše, kao Eis), a-mol (As naviše, kao Gis). Svaki par odsviraj dvaput i otpevaj ton koji se penje."}
