id: E-039
track: E
order: 39
title: {en: "The diminished seventh by ear", sr: "Smanjeni septakord po sluhu"}
prereqs: [E-038, T-060]
minutes: 13
tags: [ear, harmony, seventh-chords]
explain:
  en: |
    The **diminished seventh chord** (°7) is three minor thirds stacked: B – D – F – A♭. From A♭
    back up to B is *also* three semitones. So every neighbour is the same distance apart, and the
    chord divides the octave into four equal parts.

    What that does to your ear:

    - **No note sounds like the root.** In a dominant seventh you can hear the bottom; in a °7
      every note is equally tense. It contains **two tritones** (B–F and D–A♭), where V7 has one.
      That is the "suspense" sound of silent films and dramatic Romantic piano music.
    - **Inversions sound alike.** Move any note to the top and you get the same stack of minor
      thirds. That is why there are only **three** different °7 sounds on the whole keyboard.
    - **It wants to resolve, but in four directions.** Any of its four notes can be heard as a
      leading tone. Rise a half step from B and you land on C; from D on E♭; from F on F♯ (spelled
      as E♯); from A♭ (spelled G♯) on A. Same keys, four new tonics.

    ```abc
    X:1
    M:4/4
    L:1/2
    K:C
    "^vii°7 of C"[B,DF_A] [C,CEG] | "^vii°7 of a"[B,DF^G] [A,CEA] | "^vii°7 of E♭"[_CDF_A] [_E,_EG_B] |]
    ```

    Where you meet it: **vii°7 → i** in minor (G♯°7 → A minor, the raised 7 of harmonic minor at the
    bottom), and as a **secondary** chord, **vii°7/V** (F♯°7 → G in C), which does the job of V7/V
    with one more half step pulling.

    By ear: compare it with V7 (one tritone, a clear root), with the half-diminished ø7 (B–D–F–A,
    softer: its top note is a half step higher, A instead of A♭) and with the plain diminished triad (three notes,
    thinner).
  sr: |
    **Smanjeni septakord** (°7) su tri male terce naslagane jedna na drugu: H – D – F – As. Od As
    nagore do H je *takođe* tri polustepena. Zato su svi susedni tonovi na istom rastojanju, a
    akord deli oktavu na četiri jednaka dela.

    Šta to radi sluhu:

    - **Nijedan ton ne zvuči kao osnovni.** U dominantnom septakordu čuješ dno; u °7 je svaki ton
      podjednako napet. Sadrži **dva tritonusa** (H–F i D–As), a V7 ima jedan. To je zvuk „napetosti"
      iz nemih filmova i dramatične romantičarske klavirske muzike.
    - **Obrtaji zvuče isto.** Premesti bilo koji ton na vrh i dobiješ isti niz malih terci. Zato na
      celoj klavijaturi postoje samo **tri** različita zvuka °7.
    - **Hoće da se razreši, ali u četiri pravca.** Svaki od četiri tona može da se čuje kao vođica.
      Popni se polustepenom od H i stižeš na C; od D na Es; od F na Fis (napisano kao Eis); od As
      (napisano kao Gis) na A. Iste dirke, četiri nove tonike.

    ```abc
    X:1
    M:4/4
    L:1/2
    K:C
    "^vii°7 od C"[B,DF_A] [C,CEG] | "^vii°7 od a"[B,DF^G] [A,CEA] | "^vii°7 od Es"[_CDF_A] [_E,_EG_B] |]
    ```

    Gde ga srećeš: **vii°7 → i** u molu (Gis°7 → a-mol, povišeni 7. stupanj harmonskog mola na dnu), i
    kao **sekundarni** akord, **vii°7/V** (Fis°7 → G u C-duru), koji radi posao V7/V sa još jednim
    polustepenom koji vuče.

    Po sluhu: uporedi ga sa V7 (jedan tritonus, jasan osnovni ton), sa polusmanjenim ø7 (H–D–F–A,
    mekši: gornji ton mu je za polustepen viši, A umesto As) i sa običnim smanjenim kvintakordom (tri tona, tanji).
