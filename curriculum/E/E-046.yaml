id: E-046
track: E
order: 48
title: {en: "Review: modulating progressions", sr: "Ponavljanje: progresije koje moduliraju"}
prereqs: [E-045, E-036, E-037]
minutes: 15
tags: [ear, harmony, modulation, review]
explain:
  en: |
    Everything from E-035 to E-037 in one checklist. Run it on every item:

    1. **Lock the first tonic** after the opening cadence. Hum it.
    2. **Listen for the new accidental and which way it resolves.**

       | from major | new note | goes to |
       |---|---|---|
       | dominant key (V) | ♯4 (F♯ in C), rises | G |
       | relative minor (vi) | ♯5 (G♯ in C), rises | A minor |
       | subdominant key (IV) | ♭7 (B♭ in C), falls | F |

       | from minor | what changes | goes to |
       |---|---|---|
       | relative major (III) | the raised 7 (G♯ in A minor) *disappears* | C |
       | dominant key (v) | ♯4 (D♯ in A minor), rises | E minor |

    3. **Hum the last root** and compare it with your first tonic: name the distance as a degree
       of the old key (5, 6, 4 in major; 3, 5 in minor).
    4. **Visit or move?** One secondary dominant and back is a tonicization; a cadence that stays
       is a modulation.

    The exercises mix all of them, in new keys for this skill (A♭ major, G minor,
    C minor), so you have to hear the relationship, not remember the notes.
  sr: |
    Sve od E-035 do E-037 u jednom spisku. Primeni ga na svaki primer:

    1. **Zaključaj prvu toniku** posle početne kadence. Otpevuši je.
    2. **Slušaj novi predznak i na koju stranu se razrešava.**

       | iz dura | novi ton | ide u |
       |---|---|---|
       | tonalitet dominante (V) | ♯4 (Fis u C-duru), penje se | G |
       | paralelni mol (vi) | ♯5 (Gis u C-duru), penje se | a-mol |
       | tonalitet subdominante (IV) | ♭7 (B u C-duru), pada | F |

       | iz mola | šta se menja | ide u |
       |---|---|---|
       | paralelni dur (III) | povišeni 7. stupanj (Gis u a-molu) *nestaje* | C |
       | tonalitet dominante (v) | ♯4 (Dis u a-molu), penje se | e-mol |

    3. **Otpevuši poslednji osnovni ton** i uporedi ga sa prvom tonikom: imenuj razmak kao stupanj
       starog tonaliteta (5, 6, 4 u duru; 3, 5 u molu).
    4. **Poseta ili selidba?** Jedna sporedna dominanta pa nazad je tonikalizacija; kadenca koja
       ostaje je modulacija.

    Vežbe mešaju sve, u novim tonalitetima za ovu veštinu (As-dur, g-mol, c-mol),
    pa moraš da čuješ odnos, a ne da pamtiš tonove.
