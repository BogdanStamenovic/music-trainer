id: E-005
track: E
order: 7
title: {en: "Scale degrees 1 to 5 in major", sr: "Stupnjevi 1 do 5 u duru"}
prereqs: [E-048, T-007]
minutes: 12
tags: [ear, degrees]
explain:
  en: |
    This is the core skill of playing by ear: hearing a note **as a function of the key**, not
    as an absolute pitch. Every exercise first plays **I – IV – V – I** (in C: C – F – G – C) to set
    the key, then one note. Which step of the scale is it?

    | degree | name | feels like |
    |---|---|---|
    | 1 | tonic | home, at rest |
    | 2 | supertonic | wants to fall to 1 |
    | 3 | mediant | sweet, stable, the "colour" of major |
    | 4 | subdominant | leans down to 3 |
    | 5 | dominant | strong, open, wants to go home |

    Tips:

    - After the note, **sing down the scale to the tonic** (5–4–3–2–1). The number of notes you
      sing is the answer. Slow, but it always works; speed comes later.
    - 1, 3 and 5 are the notes of the tonic chord: they feel **stable**. 2 and 4 feel **unfinished**.
    - Keys change between exercises, but the answer is the same kind of thing: the feeling of 3 is
      the same in C and in D. That is why this transfers to songs.
  sr: |
    Ovo je osnovna veština sviranja po sluhu: da ton čuješ **kao funkciju u tonalitetu**, a ne kao
    apsolutnu visinu. Svaka vežba prvo pusti **I – IV – V – I** (u C-duru: C – F – G – C) da
    postavi tonalitet, pa jedan ton. Koji je to stupanj lestvice?

    | stupanj | naziv | osećaj |
    |---|---|---|
    | 1 | tonika | kuća, mir |
    | 2 | supertonika | hoće da padne na 1 |
    | 3 | medijanta | slatko, stabilno, „boja" dura |
    | 4 | subdominanta | naginje se naniže ka 3 |
    | 5 | dominanta | jako, otvoreno, hoće kući |

    Saveti:

    - Posle tona **otpevaj lestvicu naniže do tonike** (5–4–3–2–1). Broj otpevanih tonova je
      odgovor. Sporo, ali uvek radi; brzina dolazi kasnije.
    - 1, 3 i 5 su tonovi toničnog akorda: osećaju se **stabilno**. 2 i 4 zvuče **nedovršeno**.
    - Tonaliteti se menjaju, ali odgovor je iste vrste: 3. stupanj zvuči isto u C-duru i u D-duru.
      Zato se ovo prenosi na pesme.
