id: E-036
track: E
order: 38
title: {en: "Modulation to the dominant by ear", sr: "Modulacija u tonalitet dominante po sluhu"}
prereqs: [E-035, T-054]
minutes: 14
tags: [ear, harmony, modulation]
explain:
  en: |
    The most common modulation in major goes up a fifth, to the **dominant key** (C → G). It is
    the smoothest move there is: the two scales differ by **one note**. C major has F, G major has
    F♯. Everything else is shared, so four chords belong to both keys and any of them can be the
    pivot:

    | chord | in C | in G |
    |---|---|---|
    | C | I | IV |
    | Em | iii | vi |
    | G | V | I |
    | Am | vi | ii |

    What your ear gets:

    - **♯4 rising to 5.** F♯ is the new leading tone. It shows up in the new V7 (D7) and in the
      melody, and it goes up to G. In E-030 you heard ♯4 as a passing colour; here it keeps coming
      and keeps resolving.
    - **The music brightens and rises.** Going to the sharp side sounds like a lift.
    - **The old tonic changes job.** After the move, C is degree **4** of G: it no longer sounds
      like rest, it leans down to B. If you hum C over the final G chord, it feels unfinished.
    - **Visit or move?** One D7 → G followed by G7 → C is a visit (tonicization). A cadence in G,
      then *more* G (another ii–V–I in G), is a move.

    ```abc
    X:1
    M:4/4
    L:1/4
    K:C
    E G c B | A c B A | G ^F A ^F | G4 |]
    ```

    The melody of exercise 4: bars 1–2 in C, then F♯ twice in bar 3 and an ending on G. Sing the
    last note and then sing C: which one is home?

    In minor keys the dominant key is minor (A minor → E minor) and the clue is the same: ♯4 of the
    old key (D♯) becomes the new leading tone.
  sr: |
    Najčešća modulacija u duru ide kvintu naviše, u **tonalitet dominante** (C → G). To je
    najglađi mogući prelaz: dve lestvice se razlikuju u **jednom tonu**. C-dur ima F, G-dur ima
    Fis. Sve ostalo je zajedničko, pa četiri akorda pripadaju oba tonaliteta i svaki od njih može
    biti zajednički akord (pivot):

    | akord | u C | u G |
    |---|---|---|
    | C | I | IV |
    | e | iii | vi |
    | G | V | I |
    | a | vi | ii |

    Šta sluh dobija:

    - **♯4 koja se penje na 5.** Fis je nova vođica. Pojavljuje se u novoj V7 (D7) i u melodiji, i ide
      naviše na G. U E-030 si čuo ♯4 kao prolaznu boju; ovde se stalno vraća i stalno razrešava.
    - **Muzika se razvedri i podigne.** Prelaz na stranu povisilica zvuči kao uzdizanje.
    - **Stara tonika menja posao.** Posle prelaza C je **4.** stupanj G-dura: više ne zvuči kao
      odmor, već se naginje naniže ka H. Ako otpevušiš C preko završnog G akorda, zvuči nedovršeno.
    - **Poseta ili selidba?** Jedan D7 → G pa G7 → C je poseta (tonikalizacija). Kadenca u G, pa *još*
      G (još jedan ii–V–I u G), je selidba.

    ```abc
    X:1
    M:4/4
    L:1/4
    K:C
    E G c B | A c B A | G ^F A ^F | G4 |]
    ```

    Melodija iz 4. vežbe: taktovi 1–2 u C-duru, pa dvaput Fis u 3. taktu i završetak na G. Otpevaj
    poslednji ton pa otpevaj C: koji je kuća?

    U molu je tonalitet dominante molski (a-mol → e-mol), a trag je isti: ♯4 starog tonaliteta (Dis)
    postaje nova vođica.
