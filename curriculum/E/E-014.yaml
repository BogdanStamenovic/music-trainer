id: E-014
track: E
order: 14
title: {en: "Scale degrees in minor", sr: "Stupnjevi u molu"}
prereqs: [E-013, T-010]
minutes: 14
tags: [ear, degrees, minor]
explain:
  en: |
    In minor the key is set with **i – iv – V – i** (in A minor: Am – Dm – E – Am). The V is major
    because it borrows the raised 7th (G#) from harmonic minor: that is what makes the cadence
    sound final.

    Compared with major, three degrees change, and each one changes how it feels:

    | degree | in A minor | vs. major | feel |
    |---|---|---|---|
    | 3 | C | a half step lower (m3 above 1) | the dark colour of minor; stable |
    | 6 | F | a half step lower | sits a half step above 5 and **leans down onto it hard** |
    | 7 natural | G | a whole step under 8 | relaxed, folk/modal; does not need to resolve |
    | 7 raised | G# | a half step under 8 (harmonic minor) | leading tone, pulls up to 8 |

    So in minor there are **two strong half-step pulls**: 6 falls to 5 (F–E) and raised 7
    rises to 8 (G#–A). Between them, 6 to raised 7 is an augmented 2nd (F–G#), the "Middle
    Eastern" sound of harmonic minor.

    Telling the two 7ths apart: after the cadence, does the note **want to go up at once** (G#,
    raised) or could it sit there or fall to 6 or 5 (G, natural)? The cadence itself uses G#, so a G
    natural afterwards sounds slightly surprising, which is a clue in itself.

    Strategy from E-013 still holds: sing by step to the nearest stable note (1, 3, 5, 8) and
    count. Remember that in minor **1–3 is a minor third**: sing "1–2–3" and it should sound
    like the start of a minor scale.
  sr: |
    U molu se tonalitet postavlja sa **i – iv – V – i** (u a-molu: a – d – E – a). V je durski jer
    pozajmljuje povišeni 7. stupanj (Gis) iz harmonskog mola: zbog toga kadenca zvuči završeno.

    U poređenju sa durom menjaju se tri stupnja, i svaki menja osećaj:

    | stupanj | u a-molu | prema duru | osećaj |
    |---|---|---|---|
    | 3 | C | pola stepena niže (mala terca iznad 1) | tamna boja mola; stabilan |
    | 6 | F | pola stepena niže | stoji pola stepena iznad 5 i **jako se naginje na njega** |
    | 7 prirodni | G | ceo stepen ispod 8 | opušten, narodni/modalni zvuk; ne mora da se razreši |
    | 7 povišeni | Gis | pola stepena ispod 8 (harmonski mol) | vođica, vuče naviše na 8 |

    Dakle, u molu postoje **dve polustepene vuče**: 6 pada na 5 (F–E), a povišeni 7 se penje na 8
    (Gis–A). Između njih, od 6 do povišenog 7 je prekomerna sekunda (F–Gis), „orijentalni" zvuk
    harmonskog mola.

    Kako da razlikuješ dva sedma stupnja: posle kadence, da li ton **odmah hoće naviše** (Gis,
    povišeni) ili može da ostane ili da padne na 6 ili 5 (G, prirodni)? Sama kadenca koristi Gis,
    pa G posle nje zvuči malo iznenađujuće, i to je već trag.

    Strategija iz E-013 i dalje važi: otpevaj korakom do najbližeg stabilnog tona (1, 3, 5, 8) i
    broj. Zapamti da je u molu **1–3 mala terca**: otpevaj „1–2–3" i treba da zvuči kao početak
    molske lestvice.
