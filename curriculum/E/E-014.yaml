    prompt: {en: "The tonic triad in minor: 1, 3, 5, 8", sr: "Tonični kvintakord u molu: 1, 3, 5, 8"}
    count: 6
    gen: {kind: degree-ear, tonics: [A], type: natural-minor, degrees: [1, 3, 5]}
    checks:
      - scale: {tonic: A, type: natural-minor, is: [A, B, C, D, E, F, G]}
      - scale: {tonic: A, type: harmonic-minor, is: [A, B, C, D, E, F, G#]}
      - interval: {from: A4, to: C5, is: m3}
      - interval: {from: E4, to: F4, is: m2}
      - interval: {from: G#4, to: A4, is: m2}
      - interval: {from: G4, to: A4, is: M2}
      - interval: {from: F4, to: G#4, is: A2}
      - roman: {key: A, type: harmonic-minor, degree: 5, is: "V"}
      - roman: {key: A, type: harmonic-minor, degree: 4, is: "iv"}
      - roman: {key: A, type: harmonic-minor, degree: 1, is: "i"}
