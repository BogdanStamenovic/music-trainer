id: E-040
track: E
order: 42
title: {en: "Longer melodic dictation (2 phrases)", sr: "Duži melodijski diktat (2 rečenice)"}
prereqs: [E-039, E-030]
minutes: 15
tags: [ear, melody, dictation]
explain:
  en: |
    Up to now dictations were one phrase, 6–8 notes: short enough to hold in your head whole.
    Two phrases (14–20 notes) are not. The way through is the one composers use to build them:
    the **period**.

    - **Antecedent phrase** (prednja rečenica): ends *open*, on a half cadence: the melody stops on
      degree **5, 2 or 7**, over V.
    - **Consequent phrase** (zadnja rečenica): ends *closed*, on **1**.
    - In a **parallel** period the second phrase *starts like the first*. Then you only need to learn
      phrase 1 plus a new ending. In a **contrasting** period phrase 2 starts somewhere else.

    ```abc
    X:1
    M:4/4
    L:1/8
    K:D
    D2 F2 A2 F2 | G2 B2 A4 | D2 F2 A2 F2 | G2 E C D4 |]
    ```

    Exercise 1: phrase 1 stops on A (5, open); phrase 2 starts the same and turns at bar 4 to land
    on D (1, closed).

    The order of work, for every item:

    1. **Listen once without playing.** Sing back what you can.
    2. **Map the structure:** where phrase 1 ends (which degree), and whether phrase 2 starts the
       same way.
    3. **Landmarks first:** first note, highest note, and the two cadence notes.
    4. **Fill in** between landmarks as degrees, with the rhythm. Long notes are at phrase ends.
    5. **Play it all**, compare, fix one bar at a time.

    The exercises play the tonic first, then the melody. Timing is graded after pitches.
  sr: |
    Do sada su diktati bili jedna rečenica, 6–8 tonova: dovoljno kratko da se zapamti u celini. Dve
    rečenice (14–20 tonova) nisu. Rešenje je isto ono čime ih kompozitori grade: **period**.

    - **Prednja rečenica** (antecedent): završava se *otvoreno*, na polukadenci: melodija stane na
      **5., 2. ili 7.** stupnju, preko V.
    - **Zadnja rečenica** (konsekvent): završava se *zatvoreno*, na **1**.
    - U **paralelnom** periodu druga rečenica *počinje kao prva*. Onda treba da naučiš samo prvu
      rečenicu i novi završetak. U **kontrastnom** periodu druga rečenica počinje drugačije.

    ```abc
    X:1
    M:4/4
    L:1/8
    K:D
    D2 F2 A2 F2 | G2 B2 A4 | D2 F2 A2 F2 | G2 E C D4 |]
    ```

    Vežba 1: prva rečenica staje na A (5, otvoreno); druga počinje isto i u 4. taktu skreće da
    stigne na D (1, zatvoreno).

    Redosled rada, za svaki primer:

    1. **Slušaj jednom bez sviranja.** Otpevaj šta možeš.
    2. **Mapiraj strukturu:** gde se završava prva rečenica (koji stupanj) i da li druga počinje isto.
    3. **Prvo orijentiri:** prvi ton, najviši ton i dva kadencirajuća tona.
    4. **Popuni** između orijentira, kao stupnjeve, sa ritmom. Dugi tonovi su na krajevima rečenica.
    5. **Odsviraj sve**, uporedi, ispravljaj takt po takt.

    Vežbe prvo sviraju toniku, pa melodiju. Ritam se ocenjuje posle visina.
