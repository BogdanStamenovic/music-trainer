id: E-027
track: E
order: 27
title: {en: "Minor progressions by ear (i–iv–V–i, i–VI–III–VII)", sr: "Molske progresije po sluhu (i–iv–V–i, i–VI–III–VII)"}
prereqs: [E-026, E-020, T-039]
minutes: 14
tags: [ear, harmony, progressions, minor]
explain:
  en: |
    Minor keys have two harmonic worlds, and you can hear which one a piece lives in.

    **Classical minor** uses the raised 7th (harmonic minor): the dominant is **major V** with a
    leading tone. In a minor: Am – Dm – **E** – Am. That G# is the sound of a minor-key cadence in
    Bach, Mozart and most film scores.

    **Natural minor** (the scale of most rock and pop in minor) keeps G natural. Its chords are
    **i, iv, v, VI, III, VII**: three major chords (VI, III, VII) next to the minor tonic. The best-known
    loop is **i – VI – III – VII**: in a minor, Am – F – C – G. The VII (G) goes back to Am without a
    leading tone; it sounds like the tonic is reached by a step, not pulled in.

    How to tell them apart:

    1. **Listen to the chord before i.** Major V with G#: a sharp, urgent pull (half step up into A).
       Minor v or major VII with G: a softer, modal arrival.
    2. **Count the major chords.** i – iv – V – i has one bright chord (V). i – VI – III – VII has
       three, so it sounds brighter overall, almost like the relative major (C) with a sad start.
    3. **Bass of i – VI – III – VII:** A down to F (a third), up to C (a fourth), down to G (a fourth),
       and A again. Hum it: A F C G.

    ```abc
    X:1
    L:1/2
    K:Am
    [A,,EAc] [F,,FAc] [C,EGc] [G,,DGB] | [A,,EAc] [D,DFA] [E,EB^G] [A,,EAc] |]
    ```

    First bar: i – VI – III – VII (natural minor). Second: i – iv – V – i (with G#).
  sr: |
    Molski tonaliteti imaju dva harmonska sveta, i možeš da čuješ u kome živi neko delo.

    **Klasični mol** koristi povišeni 7. stupanj (harmonski mol): dominanta je **durski V** sa
    vođicom. U a-molu: a – d – **E** – a. To Gis je zvuk molske kadence kod Baha, Mocarta i u većini
    filmske muzike.

    **Prirodni mol** (lestvica većine roka i popa u molu) zadržava G. Njegovi akordi su
    **i, iv, v, VI, III, VII**: tri durska akorda (VI, III, VII) pored molske tonike. Najpoznatija petlja
    je **i – VI – III – VII**: u a-molu, a – F – C – G. VII (G) se vraća na a bez vođice; zvuči kao da
    se do tonike stiže korakom, a ne da je privučena.

    Kako da ih razlikuješ:

    1. **Slušaj akord pre i.** Durski V sa Gis: oštro, hitno privlačenje (polustepen naviše u A).
       Molski v ili durski VII sa G: mekši, modalni dolazak.
    2. **Prebroj durske akorde.** i – iv – V – i ima jedan svetao akord (V). i – VI – III – VII ima
       tri, pa zvuči svetlije, skoro kao paralelni dur (C) sa tužnim početkom.
    3. **Bas od i – VI – III – VII:** A naniže do F (terca), naviše do C (kvarta), naniže do G
       (kvarta), pa opet A. Otpevuši: A F C G.

    ```abc
    X:1
    L:1/2
    K:Am
    [A,,EAc] [F,,FAc] [C,EGc] [G,,DGB] | [A,,EAc] [D,DFA] [E,EB^G] [A,,EAc] |]
    ```

    Prvi takt: i – VI – III – VII (prirodni mol). Drugi: i – iv – V – i (sa Gis).
