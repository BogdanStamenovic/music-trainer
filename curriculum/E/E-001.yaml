id: E-001
track: E
order: 1
title: {en: "Find the note", sr: "Nađi ton"}
prereqs: [T-001]
minutes: 10
tags: [ear, echo]
explain:
  en: |
    Playing by ear starts with one skill: **hear a note, find it on the keys**. You do not need
    perfect pitch. You need a reference (a note or chord you already know) and the habit of
    measuring from it.

    How to practise it:

    - **Sing or hum the note first**, quietly. If you can sing it, you can find it; if you cannot,
      replay it before touching the keys.
    - **Guess, then correct.** Is it higher or lower than the reference? Close or far? Then press.
      Every key you press counts, so search in your head, not on the keyboard.
    - Everything today stays between **C4 (middle C) and C5**, white keys for the first exercises.

    The first exercises play a short chord pattern in C major (C – F – G – C) before the note.
    It sets "home" in your ear, so the note sounds like a position *in the key*, not a random pitch.
    That is the real trick of playing by ear, and lesson E-005 builds on it.

    ```abc
    X:1
    L:1/4
    K:C
    C D E F G A B c |]
    ```
  sr: |
    Sviranje po sluhu počinje jednom veštinom: **čuješ ton, nađeš ga na klavijaturi**. Ne treba ti
    apsolutni sluh. Treba ti oslonac (ton ili akord koji već znaš) i navika da meriš od njega.

    Kako da vežbaš:

    - **Prvo otpevaj ili otpevuši ton**, tiho. Ako možeš da ga otpevaš, možeš i da ga nađeš; ako ne
      možeš, pusti ga ponovo pre nego što dodirneš dirke.
    - **Pogodi, pa ispravi.** Da li je viši ili niži od oslonca? Blizu ili daleko? Tek onda pritisni.
      Svaka pritisnuta dirka se računa, zato traži u glavi, ne po klavijaturi.
    - Danas je sve između **C4 (srednje C) i C5**, u prvim vežbama samo bele dirke.

    Prve vežbe pre tona puste kratak niz akorada u C-duru (C – F – G – C). On u uhu postavi
    „kuću", pa ton čuješ kao mesto *u tonalitetu*, a ne kao nasumičnu visinu. To je pravi trik
    sviranja po sluhu, i lekcija E-005 se nadovezuje na njega.

    ```abc
    X:1
    L:1/4
    K:C
    C D E F G A B c |]
    ```
