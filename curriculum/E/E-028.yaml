id: E-028
track: E
order: 30
title: {en: "Seventh chords in progressions (ii7–V7–Imaj7, vi7)", sr: "Septakordi u progresijama (ii7–V7–Imaj7, vi7)"}
prereqs: [E-027, E-022]
minutes: 14
tags: [ear, harmony, progressions, sevenths, jazz]
explain:
  en: |
    Add a seventh to every diatonic triad in a major key and you get a fixed pattern of qualities.
    In C:

    | I | ii | iii | IV | V | vi | vii |
    |---|---|---|---|---|---|---|
    | Cmaj7 | Dm7 | Em7 | Fmaj7 | G7 | Am7 | Bø7 |
    | maj7 | m7 | m7 | maj7 | **7** | m7 | ø7 |

    Two consequences you can use by ear:

    1. **Only V7 is a dominant seventh.** If you hear that tense, bluesy "7" sound inside a major
       key, it is V7 (or a borrowed chord, later). Imaj7 and IVmaj7 sound soft and dreamy; the m7
       chords sound mellow.
    2. **Chords whose roots are a third apart share three notes.** Am7 is A C E G and Cmaj7 is C E G B. So vi7 can
       sound almost like I. **The bass decides**: A in the bass is vi7, C in the bass is I. When two
       seventh chords sound alike, hum the bass.

    The common jazz loop is the **turnaround I – vi – ii – V** with sevenths:
    Cmaj7 – Am7 – Dm7 – G7. Its bass falls by fifths from A: A → D → G → C. Push it one step further
    back and you get **iii – vi – ii – V – I** (E A D G C): every root a fifth below the previous one.
    That chain of fifths is the backbone of countless standards.

    ```abc
    X:1
    L:1/2
    K:C
    [C,EGB] [A,,EGc] | [D,FAc] [G,,FBd] | [C,EGB]2 |]
    ```

    When you hear a progression of seventh chords, work as before: **bass first** (falling fifths or
    steps?), then **quality** of each chord (maj7, m7 or 7), then name it.
  sr: |
    Dodaj septimu svakom kvintakordu u durskom tonalitetu i dobićeš stalan raspored vrsta. U C-duru:

    | I | ii | iii | IV | V | vi | vii |
    |---|---|---|---|---|---|---|
    | Cmaj7 | Dm7 | Em7 | Fmaj7 | G7 | Am7 | Hø7 |
    | maj7 | m7 | m7 | maj7 | **7** | m7 | ø7 |

    Dve posledice koje možeš da koristiš po sluhu:

    1. **Samo V7 je dominantni septakord.** Ako u durskom tonalitetu čuješ taj napeti, bluzerski
       zvuk „7", to je V7 (ili pozajmljeni akord, kasnije). Imaj7 i IVmaj7 zvuče meko i sanjivo; m7
       akordi zvuče blago.
    2. **Akordi čiji su osnovni tonovi na razmaku terce dele tri tona.** Am7 je A C E G, a Cmaj7 je C E G H. Zato vi7 može da zvuči
       skoro kao I. **Bas odlučuje**: A u basu je vi7, C u basu je I. Kad dva septakorda zvuče slično,
       otpevuši bas.

    Uobičajena džez petlja je **turnaround I – vi – ii – V** sa septimama:
    Cmaj7 – Am7 – Dm7 – G7. Bas pada po kvintama od A: A → D → G → C. Pomeri je još jedan korak
    unazad i dobijaš **iii – vi – ii – V – I** (E A D G C): svaki osnovni ton je kvintu ispod
    prethodnog. Taj lanac kvinti je kičma bezbrojnih standarda.

    ```abc
    X:1
    L:1/2
    K:C
    [C,EGB] [A,,EGc] | [D,FAc] [G,,FBd] | [C,EGB]2 |]
    ```

    Kad čuješ progresiju septakorada, radi kao i do sada: **prvo bas** (kvinte naniže ili koraci?),
    onda **vrsta** svakog akorda (maj7, m7 ili 7), onda ime.
