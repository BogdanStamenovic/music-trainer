id: E-009
track: E
order: 11
title: {en: "Bass lines: I, IV, V and vi", sr: "Bas linije: I, IV, V i vi"}
prereqs: [E-008, T-012]
minutes: 13
tags: [ear, bass, harmony]
explain:
  en: |
    To accompany a song by ear you mostly need its **bass line**: the roots of the chords. Most
    pop and folk songs use the chords on degrees **1, 4 and 5** (I, IV, V), and very often **6** (vi).

    In C major the roots are **C, F, G** and **A**: I = C major, IV = F major, V = G major,
    vi = A minor.

    How to hear them:

    - The first bass note is always **I** here. Lock it in as home.
    - **V** is the strongest pull back home; **IV** feels like moving *away*, softer.
    - From I, **up a 4th** gets you to IV and **up a 5th** to V (E-003). Bass lines also often go
      **down**: C down to G is a 4th down, and it is still V.
    - **vi** is a minor 3rd below I (C down to A). It sounds like a darker relative of I.
    - The grading accepts any octave, so play where it feels comfortable (left hand, low).
  sr: |
    Za pratnju pesme po sluhu uglavnom ti treba njena **bas linija**: osnovni tonovi akorada.
    Većina pop i narodnih pesama koristi akorde na stupnjevima **1, 4 i 5** (I, IV, V), a vrlo
    često i **6** (vi).

    U C-duru osnovni tonovi su **C, F, G** i **A**: I = C-dur, IV = F-dur, V = G-dur, vi = a-mol.

    Kako da ih čuješ:

    - Prvi ton u basu je ovde uvek **I**. Utvrdi ga kao kuću.
    - **V** (dominanta) najjače vuče nazad kući; **IV** (subdominanta) zvuči kao *odlazak*, mekše.
    - Od I, **kvarta naviše** dovodi do IV, a **kvinta naviše** do V (E-003). Bas linije često idu i
      **naniže**: od C kvartu naniže do G je i dalje V.
    - **vi** je mala terca ispod I (od C naniže do A). Zvuči kao tamniji rođak od I.
    - Ocenjivanje prihvata bilo koju oktavu, pa sviraj gde ti je udobno (levom rukom, nisko).
