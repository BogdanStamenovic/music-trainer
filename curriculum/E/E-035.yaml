id: E-035
track: E
order: 37
title: {en: "Hearing a modulation: where is home now?", sr: "Čuti modulaciju: gde je sada kuća?"}
prereqs: [E-034, T-052]
minutes: 14
tags: [ear, harmony, modulation]
explain:
  en: |
    "Home" (the tonic) is not a note the music announces. You decide it by ear: it is the chord the
    music comes back to and rests on, and a **cadence** (V7 → I) is what nails it down. That is
    why a key can change: if the music cadences somewhere else and *stays there*, your ear accepts
    a new home. That is a **modulation**.

    E-034 was the short version: a secondary dominant points at a chord (V7/V → V) and the music
    then goes straight back home. That is **tonicization**, a visit. A modulation is a move: a new
    accidental appears, a cadence lands on the new tonic, and the old key does not come back right
    away.

    ```abc
    X:1
    M:4/4
    L:1/4
    K:C
    "^I"[C,EGc] "^IV"[F,FAc] "^V7"[G,FBd] "^I"[C,Ecg] | "^vi = ii in G"[A,Ace] "^V7 in G"[D,Ac^f] "^I in G"[G,GBd]2 |]
    ```

    Play it. Bar 1 makes C home. Then A minor, a chord that belongs to *both* C major and G major
    (vi in C, ii in G): the **pivot**. D7 brings in **F♯** and resolves to G. Hold the last chord:
    G no longer sounds like V waiting to go to C; it sounds finished. Home moved up a fifth.

    The method, for every exercise:

    1. **Lock the first tonic.** After the opening cadence, hum the tonic and keep it in your head.
    2. **Listen for the new accidental.** F♯ in C (towards G), G♯ in C (towards A minor), B♭ in C
       (towards F). A sharp that keeps resolving *up* is a new leading tone.
    3. **At the end, hum the root of the last chord.** Same pitch as your first tonic? You are home.
       Different? Name it as a degree of the old key: **5** = the dominant key, **6** = the relative
       minor, **4** = the subdominant key.
    4. **Visit or move?** If the old key's V7 → I comes back afterwards, it was a visit.
  sr: |
    „Kuća" (tonika) nije ton koji muzika najavljuje. Određuješ je sluhom: to je akord na koji se
    muzika vraća i na kome se odmara, a **kadenca** (V7 → I) je ono što je učvrsti. Zato tonalitet
    može da se promeni: ako muzika napravi kadencu negde drugde i *tamo ostane*, sluh prihvata novu
    kuću. To je **modulacija**.

    E-034 je bila kratka verzija: sporedna dominanta pokazuje na akord (V7/V → V) i muzika se
    odmah vraća kući. To je **tonikalizacija**, poseta. Modulacija je selidba: pojavi se novi
    predznak, kadenca padne na novu toniku, a stari tonalitet se ne vraća odmah.

    ```abc
    X:1
    M:4/4
    L:1/4
    K:C
    "^I"[C,EGc] "^IV"[F,FAc] "^V7"[G,FBd] "^I"[C,Ecg] | "^vi = ii u G"[A,Ace] "^V7 u G"[D,Ac^f] "^I u G"[G,GBd]2 |]
    ```

    Odsviraj. Prvi takt čini C kućom. Zatim a-mol, akord koji pripada *i* C-duru *i* G-duru (vi u C,
    ii u G): to je **zajednički akord (pivot)**. D7 donosi **Fis** i razrešava se na G. Zadrži
    poslednji akord: G više ne zvuči kao V koja čeka da ode na C; zvuči završeno. Kuća se pomerila
    kvintu naviše.

    Metod, za svaku vežbu:

    1. **Zaključaj prvu toniku.** Posle početne kadence otpevuši toniku i zadrži je u glavi.
    2. **Slušaj novi predznak.** Fis u C-duru (ka G), Gis u C-duru (ka a-molu), B u C-duru (ka F).
       Povisilica koja se stalno razrešava *naviše* je nova vođica.
    3. **Na kraju otpevuši osnovni ton poslednjeg akorda.** Ista visina kao prva tonika? Kod kuće si.
       Drugačija? Imenuj je kao stupanj starog tonaliteta: **5** = tonalitet dominante, **6** =
       paralelni mol, **4** = tonalitet subdominante.
    4. **Poseta ili selidba?** Ako se posle toga vrati V7 → I starog tonaliteta, bila je poseta.
