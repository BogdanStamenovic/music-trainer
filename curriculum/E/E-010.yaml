id: E-010
track: E
order: 10
title: {en: "Melodic dictation with leaps", sr: "Melodijski diktat sa skokovima"}
prereqs: [E-009]
minutes: 14
tags: [ear, melody, echo]
explain:
  en: |
    Real melodies do not only step: they **leap**, and most leaps land on notes of the **tonic
    chord** (degrees 1, 3, 5 and the octave 8). In C major that is C, E, G, C.

    ```abc
    X:1
    L:1/4
    K:C
    C E G c | G E C2 |]
    ```

    The melodies here are 5 or 6 notes long. That is too long to hold note by note, so:

    1. **Sing the whole melody** back first. Replay it as often as you need.
    2. Find the **first note** against the tonic (degree, E-005).
    3. Hear the **shape**: steps vs leaps. A leap here is always between tonic-chord notes, so a
       leap up from 1 lands on 3 or 5, and a leap up from 5 lands on 8.
    4. Then play it in one go, in the given octave.

    The second and third exercises use degrees 1-2-3-5-6 (the major pentatonic): every leap is
    1↔3 or 3↔5, everything else is a step.
  sr: |
    Prave melodije ne idu samo u koracima: one **skaču**, a većina skokova pada na tonove
    **toničnog akorda** (stupnjeve 1, 3, 5 i oktavu 8). U C-duru to su C, E, G, C.

    ```abc
    X:1
    L:1/4
    K:C
    C E G c | G E C2 |]
    ```

    Ovde su melodije duge 5 ili 6 tonova. To je predugo da se pamti ton po ton, zato:

    1. Prvo **otpevaj celu melodiju**. Puštaj je koliko god treba.
    2. Nađi **prvi ton** u odnosu na toniku (stupanj, E-005).
    3. Čuj **oblik**: koraci ili skokovi. Skok je ovde uvek između tonova toničnog akorda, pa skok
       naviše sa 1 pada na 3 ili 5, a skok naviše sa 5 pada na 8.
    4. Onda je odsviraj u jednom dahu, u zadatoj oktavi.

    Druga i treća vežba koriste stupnjeve 1-2-3-5-6 (durska pentatonika): svaki skok je 1↔3 ili
    3↔5, sve ostalo su koraci.
