    gen: {kind: degree-ear, tonics: [C], type: major, degrees: [5, 6, 7, 8]}
    checks:
      - scale: {tonic: C, type: major, is: [C, D, E, F, G, A, B]}
      - semitones: {from: E4, to: F4, is: 1}
      - semitones: {from: B4, to: C5, is: 1}
      - semitones: {from: A4, to: B4, is: 2}
      - roman: {key: C, degree: 6, is: "vi"}
