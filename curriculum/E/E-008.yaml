id: E-008
track: E
order: 10
title: {en: "Diminished and augmented triads", sr: "Smanjeni i povećani kvintakord"}
prereqs: [E-007, T-011]
minutes: 12
tags: [ear, chords]
explain:
  en: |
    Two more triad qualities complete the set of four. Built on C:

    ```abc
    X:1
    L:1/2
    K:C
    [CEG] [C_EG] [C_E_G] [CE^G] |]
    ```

    | quality | notes on C | thirds (bottom, top) | sound |
    |---|---|---|---|
    | major | C–E–G | M3 + m3 | bright, stable |
    | minor | C–E♭–G | m3 + M3 | dark, stable |
    | diminished | C–E♭–G♭ | m3 + m3 | tense, squeezed, wants to resolve (horror-film suspense) |
    | augmented | C–E–G♯ | M3 + M3 | floating, dreamy, unresolved ("dream sequence") |

    Tips:

    - First ask: **stable or unstable?** Major and minor are at rest; diminished and augmented are not.
    - Then: **squeezed or stretched?** Diminished is minor with the top pulled *down*; augmented is
      major with the top pushed *up*. Listen to the top note.
    - In this app and in most music, diminished triads are far more common than augmented ones
      (the vii° chord of every major key is diminished).
  sr: |
    Još dve vrste kvintakorda dopunjuju skup od četiri. Na C:

    ```abc
    X:1
    L:1/2
    K:C
    [CEG] [C_EG] [C_E_G] [CE^G] |]
    ```

    | vrsta | tonovi na C | terce (donja, gornja) | zvuk |
    |---|---|---|---|
    | durski | C–E–G | M3 + m3 | svetlo, stabilno |
    | molski | C–Es–G | m3 + M3 | tamno, stabilno |
    | smanjeni | C–Es–Ges | m3 + m3 | napeto, stisnuto, traži razrešenje (napetost iz horor filma) |
    | povećani | C–E–Gis | M3 + M3 | lebdeće, sanjivo, nerazrešeno („scena sna") |

    Saveti:

    - Prvo pitanje: **stabilno ili nestabilno?** Dur i mol miruju; smanjeni i povećani ne.
    - Zatim: **stisnuto ili razvučeno?** Smanjeni je mol kome je gornji ton spušten; povećani je
      dur kome je gornji ton podignut. Slušaj gornji ton.
    - I ovde i u većini muzike smanjeni kvintakord je mnogo češći od povećanog (akord vii° u
      svakom duru je smanjeni).
