id: E-012
track: E
order: 12
title: {en: "Harmonic intervals and compound intervals (9ths, 10ths)", sr: "Harmonski i složeni intervali (none, decime)"}
prereqs: [E-011]
minutes: 14
tags: [ear, intervals]
explain:
  en: |
    **Harmonic** means both notes sound together. You lose the motion that made melodic intervals
    easy, so you judge the **blend** instead:

    | blend | intervals | what you hear |
    |---|---|---|
    | hollow, open | P4, P5, P8 | almost one sound; the octave fuses completely |
    | sweet, full | m3, M3, m6, M6 | the "harmony" sound of thirds and sixths |
    | rough, rubbing | m2, M7 | a fast beating, the notes fight |
    | mild rub | M2, m7 | dissonant but soft, like a jazz chord tone |
    | restless | A4 (tritone) | neither consonant nor harsh, wants to move |

    Then split it: **hum the lower note, then the upper**, which turns it back into a melodic
    interval you already know. Within a family, size decides: a 6th is wider than a 3rd, a 7th
    wider than a 2nd.

    **Compound intervals** are larger than an octave. A **9th** is an octave plus a 2nd, a **10th**
    an octave plus a 3rd. They keep the colour of the simple interval but sound more open, because
    the notes are far apart. On the keyboard a major 10th is C3–E4, the left-hand stretch you use in
    ballad and stride accompaniment.

    ```abc
    X:1
    L:1/2
    K:C
    [C_d] [Cd] | [C_e] [Ce] |]
    ```

    Above: m9 (C4–Db5), M9 (C4–D5), m10 (C4–Eb5), M10 (C4–E5). To name a compound interval:
    find the simple interval (fold the top note down an octave in your head) and **add 7** to the
    number: a 2nd becomes a 9th, a 3rd a 10th. The quality stays the same.
  sr: |
    **Harmonski** znači da oba tona zvuče zajedno. Gubiš pokret koji je melodijske intervale činio
    lakim, pa umesto toga procenjuješ **stapanje**:

    | stapanje | intervali | šta čuješ |
    |---|---|---|
    | šuplje, otvoreno | č4, č5, č8 | skoro jedan zvuk; oktava se potpuno stapa |
    | slatko, puno | m3, v3, m6, v6 | „harmonski" zvuk terci i seksti |
    | grubo, trlja | m2, v7 | brzo treperenje, tonovi se bore |
    | blago trlja | v2, m7 | disonantno ali meko, kao ton džez akorda |
    | nemirno | povećana kvarta (tritonus) | ni konsonantno ni oštro, hoće da se pomeri |

    Onda ga razloži: **otpevuši donji ton, pa gornji**, i interval postaje melodijski, a te već
    znaš. Unutar porodice odlučuje veličina: seksta je šira od terce, septima šira od sekunde.

    **Složeni intervali** su veći od oktave. **Nona** je oktava plus sekunda, **decima** oktava plus
    terca. Zadržavaju boju prostog intervala, ali zvuče otvorenije jer su tonovi daleko. Na
    klavijaturi velika decima je C3–E4, raspon leve ruke iz balada i strajd pratnje.

    ```abc
    X:1
    L:1/2
    K:C
    [C_d] [Cd] | [C_e] [Ce] |]
    ```

    Gore: mala nona (C4–Des5), velika nona (C4–D5), mala decima (C4–Es5), velika decima
    (C4–E5). Kako da imenuješ složen interval: nađi prosti (u glavi spusti gornji ton za
    oktavu) i broju **dodaj 7**: sekunda postaje nona, terca decima. Vrsta ostaje ista.
