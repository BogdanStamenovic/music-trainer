id: E-034
track: E
order: 34
title: {en: "Review: progressions with secondary dominants", sr: "Ponavljanje: progresije sa sekundarnim dominantama"}
prereqs: [E-033, E-029, T-044]
minutes: 15
tags: [ear, harmony, secondary-dominants, review]
explain:
  en: |
    V/V was the first **secondary dominant**. Any major or minor chord in the key can get its own:
    take the chord you want to land on, build a major triad (or dominant 7th) a fifth above it, and
    play it just before. In C:

    | secondary | chord | chromatic note | resolves to |
    |---|---|---|---|
    | V7/ii | A7 (A C# E G) | C# rises to D | Dm |
    | V7/iii | B7 (B D# F# A) | D# rises to E | Em |
    | V7/IV | C7 (C E G B♭) | B♭ falls to A | F |
    | V7/V | D7 (D F# A C) | F# rises to G | G |
    | V7/vi | E7 (E G# B D) | G# rises to A | Am |

    Three things give them away by ear:

    1. **A major (or dominant 7th) chord where the key has a minor one.** In C, A, E and D should be
       minor; hearing them major is the alarm bell. (V7/IV is the odd one: C is already major, the
       clue is the B♭ that makes it a dominant seventh.)
    2. **A chromatic note that resolves by half step**, exactly like ♯4 and ♭7 in E-030: sharps go up,
       flats go down.
    3. **The bass then falls a fifth** (or rises a fourth) into the target chord, just as V goes to I.

    Chained together they make the sound of ragtime, gospel and old jazz: **I – VI7 – II7 – V7 – I**
    (C A7 D7 G7 C), where each chord is the dominant of the next. In roman numerals as functions:
    I – V7/ii – V7/V – V7 – I.

    ```abc
    X:1
    L:1/2
    K:C
    [C,EGc] [A,,EG^c] | [D,^FAc] [G,,FBd] | [C,EGc]2 |]
    ```

    For each exercise: bass first, then "which chord is major that should be minor?", then name the
    target.
  sr: |
    V/V je bila prva **sekundarna dominanta**. Svaki durski ili molski akord u tonalitetu može da
    dobije svoju: uzmi akord na koji hoćeš da stigneš, sagradi durski kvintakord (ili dominantni
    septakord) kvintu iznad njega i odsviraj ga neposredno pre. U C-duru:

    | sekundarna | akord | hromatski ton | razrešava se na |
    |---|---|---|---|
    | V7/ii | A7 (A Cis E G) | Cis se penje na D | d |
    | V7/iii | H7 (H Dis Fis A) | Dis se penje na E | e |
    | V7/IV | C7 (C E G B) | B pada na A | F |
    | V7/V | D7 (D Fis A C) | Fis se penje na G | G |
    | V7/vi | E7 (E Gis H D) | Gis se penje na A | a |

    Tri stvari ih otkrivaju po sluhu:

    1. **Durski (ili dominantni septakord) tamo gde tonalitet ima molski.** U C-duru A, E i D treba da
       budu molski; kad ih čuješ kao durske, to je zvono za uzbunu. (V7/IV je izuzetak: C je već
       durski, a trag je B koje ga pravi dominantnim septakordom.)
    2. **Hromatski ton koji se razrešava polustepenom**, tačno kao ♯4 i ♭7 u E-030: povisilice idu
       naviše, snizilice naniže.
    3. **Bas onda pada za kvintu** (ili se penje za kvartu) u ciljni akord, kao što V ide na I.

    Povezane u lanac daju zvuk regtajma, gospela i starog džeza: **I – VI7 – II7 – V7 – I**
    (C A7 D7 G7 C), gde je svaki akord dominanta sledećeg. U rimskim brojevima kao funkcije:
    I – V7/ii – V7/V – V7 – I.

    ```abc
    X:1
    L:1/2
    K:C
    [C,EGc] [A,,EG^c] | [D,^FAc] [G,,FBd] | [C,EGc]2 |]
    ```

    Za svaku vežbu: prvo bas, pa „koji akord je durski, a trebalo bi da je molski?", pa imenuj cilj.
