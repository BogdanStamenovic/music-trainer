id: E-044
track: E
order: 46
title: {en: "Third song by ear (public-domain), with chords", sr: "Treća pesma po sluhu (javni domen), sa akordima"}
prereqs: [E-043, E-033]
minutes: 15
tags: [ear, melody, song, harmony]
# Tune: "Jingle Bells", chorus. James Lord Pierpont, published 1857; the chorus melody sung today
# settled in the late 19th century. Public domain. Common C major version, 4/4, no pickup.
explain:
  en: |
    *Versions differ:* some songbooks dot "fun" in bar 5 (F F F. F). The app grades the plain
    quarter-note version below; if you learned the other, play the version written here.

    Third song: the chorus of **Jingle Bells** (James Lord Pierpont, 1857). Same method as E-021 and
    E-033 for the melody; new today is finding the **chords by ear**, one per bar.

    Landmarks for the melody:

    - **Key**: C major; it ends on **C4**. **First note**: E4, degree 3, repeated: "Jin-gle bells"
      is three E's.
    - **Form**: four 4-bar phrases, **A B A C**. Phrase 3 is phrase 1 again; phrases 2 and 4 start
      the same (F F F F | F E E E E) and end differently: phrase 2 stops on **G** (open, a half
      cadence), phrase 4 falls G G F D to **C** (closed).
    - **The big leap**: from "jin-gle" to "all", G4 falls to C4, a fifth down, and climbs back by step.

    ```abc
    X:1
    M:4/4
    L:1/4
    K:C
    E E E2 | E E E2 | E G C3/2 D/ | E4 | F F F F | F E E E/E/ | E D D E | D2 G2 |]
    ```

    **Chords by ear**, one per bar, using what you already know:

    1. **Long notes and the first beat decide.** Bar 4 is a whole E: C major (C E G) holds it, and
       the tonic is right for the end of a phrase.
    2. **Try I, IV, V first.** Bar 5 repeats F: of I, IV and V, only **IV** (F A C) has F as a
       chord tone *and* sounds stable under it.
    3. **The end of a phrase tells you the cadence.** Phrase 2 ends on D and G: that is V, a half
       cadence. Phrase 4 ends on C: V7 → I.
    4. **Then look for colour.** In bar 7, D7 (V7/V, from E-034) leads strongly into G7; many
       arrangements use it. The plain G7 works too, just less pull.
  sr: |
    *Verzije se razlikuju:* neke pesmarice stavljaju tačku na „fun" u 5. taktu (F F F. F). Aplikacija
    ocenjuje jednostavnu verziju u četvrtinama ispod; ako znaš drugu, odsviraj verziju napisanu
    ovde.

    Treća pesma: refren pesme **Jingle Bells** (Džejms Lord Pirpont, 1857). Isti metod kao u E-021 i
    E-033 za melodiju; novo je pronalaženje **akorda po sluhu**, jedan po taktu.

    Orijentiri za melodiju:

    - **Tonalitet**: C-dur; završava se na **C4**. **Prvi ton**: E4, 3. stupanj, ponovljen: „Jin-gle
      bells" su tri E.
    - **Forma**: četiri rečenice od po 4 takta, **A B A C**. Treća rečenica je opet prva; druga i
      četvrta počinju isto (F F F F | F E E E E) i završavaju se različito: druga staje na **G**
      (otvoreno, polukadenca), četvrta silazi G G F D na **C** (zatvoreno).
    - **Veliki skok**: od „jin-gle" do „all" melodija pada sa G4 na C4, kvintu naniže, pa se vraća korakom.

    ```abc
    X:1
    M:4/4
    L:1/4
    K:C
    E E E2 | E E E2 | E G C3/2 D/ | E4 | F F F F | F E E E/E/ | E D D E | D2 G2 |]
    ```

    **Akordi po sluhu**, jedan po taktu, sa onim što već znaš:

    1. **Dugi tonovi i prva doba odlučuju.** Takt 4 je celo E: C-dur (C E G) ga drži, a tonika
       odgovara kraju rečenice.
    2. **Prvo probaj I, IV, V.** Takt 5 ponavlja F: od I, IV i V samo **IV** (F A C) ima F kao ton
       akorda *i* zvuči stabilno ispod njega.
    3. **Kraj rečenice otkriva kadencu.** Druga rečenica se završava na D i G: to je V, polukadenca.
       Četvrta se završava na C: V7 → I.
    4. **Onda traži boju.** U 7. taktu D7 (V7/V, iz E-034) snažno vodi u G7; mnogi aranžmani ga
       koriste. Obično G7 takođe radi, samo sa manje privlačenja.
