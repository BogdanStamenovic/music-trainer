  - id: E-044-1
    type: midi-echo
    prompt: {en: "Phrase 1, \"Jingle bells, jingle bells, jingle all the way\" (C major, starts on E4). Sing it, then play it back.", sr: "Rečenica 1, „Jingle bells, jingle bells, jingle all the way” (C-dur, počinje na E4). Otpevaj je, pa odsviraj."}
    mode: sequence
    expect: [E4, E4, E4, E4, E4, E4, E4, G4, C4, D4, E4]
    beats: [1, 1, 2, 1, 1, 2, 1, 1, 1.5, 0.5, 4]
    tempo: 100
    octave: exact
    checks:
      - scale: {tonic: C, type: major, is: [C, D, E, F, G, A, B]}
      - interval: {from: C4, to: G4, is: P5}
      - interval: {from: C4, to: E4, is: M3}
