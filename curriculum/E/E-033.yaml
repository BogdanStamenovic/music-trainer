    type: midi-echo
    prompt: {en: "Phrases 3 and 4 in one go, from memory if you can.", sr: "Fraze 3 i 4 u komadu, napamet ako možeš."}
    mode: sequence
    expect: [B4, D5, D5, B4, G4, B4, A4, G4, E4, D4, D4, G4, B4, G4, B4, A4, G4]
    beats: [0.5, 0.5, 2, 0.5, 0.5, 2, 1, 2, 1, 2, 1, 2, 0.5, 0.5, 2, 1, 3]
