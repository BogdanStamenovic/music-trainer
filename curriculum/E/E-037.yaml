id: E-037
track: E
order: 37
title: {en: "Relative minor/major by ear", sr: "Paralelni mol i dur po sluhu"}
prereqs: [E-035, T-055]
minutes: 14
tags: [ear, harmony, modulation, minor]
explain:
  en: |
    C major and A minor share a key signature and all seven notes. So when music moves between
    them, nothing new appears in the signature, and every diatonic chord is a possible pivot (ii in
    C is iv in A minor, IV in C is VI in A minor). What tells you the key changed is **which note
    acts as the leading tone** and **where the cadence lands**.

    **Major → relative minor (C → A minor).** Listen for **G♯**: degree 5 of C, raised, rising to A.
    It arrives in E7 (V7 of A minor) and in the melody. The colour darkens, and the last chord is
    minor and sounds final.

    ```abc
    X:1
    M:4/4
    L:1/4
    K:C
    E G c G | F A d c | B ^G E ^G | A4 |]
    ```

    **Minor → relative major (A minor → C).** The opposite: the G♯ that minor needs for its V7
    **disappears**, G natural comes back inside G7, and G7 resolves to C. Nothing sharp, nothing
    new: the music simply brightens and settles on the major chord built on degree 3.

    **The trap: the deceptive cadence.** V7 → vi (E-024) also lands on A minor, but it is one chord:
    the music keeps going in C and cadences there. A modulation brings **E7** (with G♯) and lands on
    A minor *twice*, or stays there.

    Method: lock the first tonic, listen for G♯ arriving (or leaving), hum the last root and name
    it as a degree of the old key: 6 in major = the relative minor, 3 in minor = the relative major.
  sr: |
    C-dur i a-mol imaju isti predznak i svih sedam tonova. Zato, kad muzika prelazi između njih, u
    predznaku se ne pojavljuje ništa novo, a svaki dijatonski akord može biti pivot (ii u C-duru je
    iv u a-molu, IV u C-duru je VI u a-molu). Ono što otkriva promenu tonaliteta je **koji ton radi
    kao vođica** i **gde pada kadenca**.

    **Dur → paralelni mol (C → a-mol).** Slušaj **Gis**: 5. stupanj C-dura, povišen, penje se na A.
    Stiže u E7 (V7 a-mola) i u melodiji. Boja potamni, a poslednji akord je molski i zvuči završno.

    ```abc
    X:1
    M:4/4
    L:1/4
    K:C
    E G c G | F A d c | B ^G E ^G | A4 |]
    ```

    **Mol → paralelni dur (a-mol → C).** Obrnuto: Gis koji molu treba za V7 **nestaje**, G se vraća
    u G7, a G7 se razrešava na C. Ništa povišeno, ništa novo: muzika se jednostavno razvedri i smiri
    na durskom akordu na 3. stupnju.

    **Zamka: varljiva kadenca.** V7 → vi (E-024) takođe stiže na a-mol, ali je to jedan akord:
    muzika nastavlja u C-duru i tamo pravi kadencu. Modulacija donosi **E7** (sa Gis) i stiže na a-mol
    *dvaput*, ili tamo ostaje.

    Metod: zaključaj prvu toniku, slušaj kad Gis stiže (ili odlazi), otpevuši poslednji osnovni ton i
    imenuj ga kao stupanj starog tonaliteta: 6 u duru = paralelni mol, 3 u molu = paralelni dur.
