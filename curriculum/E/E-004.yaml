id: E-004
track: E
order: 4
title: {en: "Major or minor chord?", sr: "Durski ili molski akord?"}
prereqs: [E-003, T-011]
minutes: 11
tags: [ear, chords]
explain:
  en: |
    A major and a minor triad on the same root differ by **one note, one half step**: the
    middle one (the third). C major is C–E–G, C minor is C–E♭–G.

    ```abc
    X:1
    L:1/2
    K:C
    [CEG] [C_EG] |]
    ```

    - Major sounds **bright, settled**; minor sounds **darker, more inward**. That is a cliché,
      and it works.
    - Do not listen to the whole chord as one blob. **Sing the middle note.** Then sing the root
      under it: four half steps (major third) means major, three (minor third) means minor.
      That is E-002 again.
    - Inversions move the notes around but do not change the quality. In the second exercise the
      lowest note is not always the root: listen for the overall colour.
  sr: |
    Durski i molski kvintakord na istom osnovnom tonu razlikuju se u **jednom tonu, za jedan
    polustepen**: srednjem (terci). C-dur je C–E–G, c-mol je C–Es–G.

    ```abc
    X:1
    L:1/2
    K:C
    [CEG] [C_EG] |]
    ```

    - Dur zvuči **svetlo, smireno**; mol **tamnije, zatvorenije**. To je kliše, ali radi.
    - Ne slušaj ceo akord kao jednu mrlju. **Otpevaj srednji ton.** Pa ispod njega osnovni ton:
      četiri polustepena (velika terca) znači dur, tri (mala terca) znači mol. To je opet E-002.
    - Obrtaji premeštaju tonove, ali ne menjaju vrstu akorda. U drugoj vežbi najniži ton nije
      uvek osnovni: slušaj ukupnu boju.
