title: {en: "Sing: an evening song (legato, 8 bars)", sr: "Pevaj: večernja pesma (legato, 8 taktova)"}
minutes: 25
prereqs: [V-009, V-024]
melody:
  title: {en: "Evening Song", sr: "Večernja pesma"}
  source: "Original melody written for music-trainer (2026); free to use."
  key: G major
  meter: 3/4
  tempo: 66
  notes: [B4, A4, G4, E4, D4, E4, G4, A4, B4, A4, G4, A4, B4, A4, F#4, G4]
