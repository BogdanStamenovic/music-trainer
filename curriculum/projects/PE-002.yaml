brief:
  en: |
    The app plays **"Happy Birthday"**. **Play it back on the piano, right hand, any key.**
    You know the tune, but you have probably never had to find its notes: it is harder than it
    sounds, which is why it is here.

    ### What makes it tricky

    - **It starts before the bar** (a **pickup**, *anacrusis*): "Hap-py" comes before the first
      strong beat, which falls on "**birth**-". The meter is **3/4**, a waltz feel.
    - **"Hap-py" is long-short** (a dotted eighth and a sixteenth), every time it appears.
    - **The leaps grow each line:** the first line ends with a leap of a **fourth** ("to **you**"),
      the second with a **fifth**, and the third begins with a full **octave** ("happy **birth**-day", the note on "birth" an octave above "hap-").
    - The third line ("dear ...") leaps to the **highest note** and then comes down.

    ### Strategies

    1. **Sing it** with the playback, then alone, until it is secure.
    2. **Find the first note** anywhere you like. Starting on G and playing in C major is easy;
       so is starting on C and playing in F major.
    3. **Use the tonic as an anchor.** Find the note the song ends on: that is the tonic (*do*).
       Then ask, line by line, where each line ends compared to it.
    4. **Line by line.** Four lines; lines 1 and 2 begin the same way. Measure each leap against
       intervals you know: the octave sounds like the same note higher.
    5. **Keep the waltz pulse** (ONE two three) while you play, and keep "Hap-py"
       in the right proportion: long, then very short.

    ### How it is graded

    - **Pitch (60%):** your intervals against the melody's, in any key.
    - **Rhythm (20%):** relative note lengths at any steady tempo, including the dotted pickups.
    - **Rubric (20%):** the criteria below.
  sr: |
    Aplikacija pušta **„Srećan rođendan”** („Happy Birthday”). **Odsviraj ga na klaviru, desnom
    rukom, u bilo kom tonalitetu.** Melodiju znaš, ali verovatno nikad nisi morao da nađeš
    njene tonove: teža je nego što zvuči, i zato je ovde.

    ### Šta je nezgodno

    - **Počinje pre takta** (**predtakt**, *anakruza*): „Hap-py” dolazi pre prve jake dobe,
      koja pada na „**birth**-”. Takt je **3/4**, kao valcer.
    - **„Hap-py” je dugo-kratko** (osmina s tačkom i šesnaestina), svaki put kad se pojavi.
    - **Skokovi rastu iz stiha u stih:** prvi stih se završava skokom za **kvartu**, drugi za
      **kvintu**, a treći počinje skokom za celu **oktavu**.
    - Treći stih (sa imenom) skače do **najvišeg tona**, pa silazi.

    ### Strategije

    1. **Otpevaj** uz reprodukciju, pa sam, dok ne bude sigurno.
    2. **Nađi prvi ton** gde god hoćeš. Lako je početi na G i svirati u C-duru; isto tako i
       početi na C i svirati u F-duru.
    3. **Tonika kao sidro.** Nađi ton na kom se pesma završava: to je tonika (*do*). Onda za
       svaki stih pitaj gde se završava u odnosu na nju.
    4. **Stih po stih.** Četiri stiha; prvi i drugi počinju isto. Svaki skok uporedi sa
       intervalima koje znaš: oktava zvuči kao isti ton, samo više.
    5. **Drži valcerski puls** (JED-na dva tri) dok sviraš, i neka „Hap-py” bude u pravoj
       srazmeri: dugo, pa vrlo kratko.

    ### Kako se ocenjuje

    - **Intonacija (60%):** tvoji intervali prema intervalima melodije, u bilo kom tonalitetu.
    - **Ritam (20%):** odnosi trajanja u bilo kom ravnomernom tempu, uključujući punktirane
      predtakte.
    - **Rubrika (20%):** kriterijumi ispod.
rubric:
  - id: flow
    weight: 1
    label: {en: "Musical flow", sr: "Muzički tok"}
    top:
      en: "One unbroken take in a steady waltz pulse; it sounds like someone playing the song at a party, not working it out."
      sr: "Jedan neprekinut snimak u ravnomernom valcerskom pulsu; zvuči kao da neko svira pesmu na proslavi, a ne da je odgoneta."
  - id: phrasing
    weight: 1
    label: {en: "Phrasing", sr: "Fraziranje"}
    top:
      en: "Each line is shaped as a phrase leading to its long note; the octave leap and the high point of line 3 are played as the climax."
      sr: "Svaki stih je oblikovan kao fraza koja vodi ka svom dugom tonu; skok za oktavu i vrhunac trećeg stiha odsvirani su kao kulminacija."
  - id: process
    weight: 1
    label: {en: "Method and self-correction", sr: "Postupak i samoispravljanje"}
    top:
      en: "Your notes name the intervals you heard (fourth, fifth, octave), what you got wrong first and how you corrected it."
      sr: "U beleškama imenuješ intervale koje si čuo (kvarta, kvinta, oktava), šta si prvo pogrešio i kako si ispravio."
