title: {en: "Sing: the year in one song (review)", sr: "Pevaj: godina u jednoj pesmi (pregled)"}
minutes: 45
prereqs: [V-017, V-019, V-023, V-024]
melody:
  title: {en: "Year's End Waltz", sr: "Valcer za kraj godine"}
  source: "Original melody written for music-trainer (2026); free to use."
  key: Bb major
  meter: 3/4
  tempo: 96
  notes: [F4, Bb4, D5, C5, Bb4, A4, Bb4, G4, Eb4, F4, F4, Bb4, D5, D5, C5, Bb4, A4, G4, G4, C5, A4, Bb4, D4, D5, C5, Bb4, A4, G4, A4, Bb4, C5, D5, C5, Bb4, A4, Bb4, G4, Eb4, G4, F4, A4, Bb4]
  beats: [1, 1, 1, 1.5, 0.5, 1, 1, 1, 1, 3, 1, 1, 1, 1, 0.5, 0.5, 0.5, 0.5, 1, 1, 1, 3, 1, 2, 1, 1, 1, 1.5, 0.5, 1, 3, 1, 0.5, 0.5, 1, 1, 1, 1, 1, 1, 1, 3]
