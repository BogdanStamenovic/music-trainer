title: {en: "Sing: a minor ballad with a chromatic turn (clean tone)", sr: "Pevaj: balada u molu sa hromatskim obrtom (čist ton)"}
minutes: 40
prereqs: [V-018, V-024]
melody:
  title: {en: "Ballad in E minor", sr: "Balada u e-molu"}
  source: "Original melody written for music-trainer (2026); free to use."
  key: E minor
  meter: 4/4
  tempo: 66
  notes: [E4, G4, B4, A4, G4, F#4, E4, C5, B4, A4, G4, F#4, E4, G4, B4, C5, D5, B4, C5, B4, A4, F#4, G4, A4, C5, F4, A4, G4, F#4, D#4, B4, A4, G4, F#4, E4]
  beats: [1, 1, 1.5, 0.5, 1, 1, 2, 1, 1, 1, 1, 4, 1, 1, 1.5, 0.5, 2, 2, 1, 1, 1, 1, 4, 1, 1, 1.5, 0.5, 1, 1, 2, 1.5, 0.5, 1, 1, 4]
