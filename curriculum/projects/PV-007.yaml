title: {en: "Sing: a barcarolle across an octave", sr: "Pevaj: barkarola kroz oktavu"}
minutes: 40
prereqs: [V-016, V-017, V-025]
melody:
  title: {en: "Barcarolle", sr: "Barkarola"}
  source: "Original melody written for music-trainer (2026); free to use."
  key: D major
  meter: 6/8
  tempo: 69
  notes: [F#4, A4, D5, C#5, B4, A4, F#4, G4, E4, A4, G4, F#4, E4, D4, F#4, A4, D5, D5, C#5, B4, A4, G4, B4, A4, E4, D4, B4, A4, G4, F#4, E4, F#4, G4, B4, A4, G4, F#4, E4, A4, D4, D5, C#5, B4, A4, F#4, F#4, G4, E4, D4]
  beats: [1, 0.5, 1, 0.5, 1, 0.5, 1.5, 1, 0.5, 1, 0.5, 1.5, 1.5, 1, 0.5, 1, 0.5, 1, 0.5, 1, 0.5, 1, 0.5, 1, 0.5, 3, 1, 0.5, 1, 0.5, 1, 0.5, 1, 0.5, 1, 0.5, 1, 0.5, 3, 1.5, 1.5, 1, 0.5, 1, 0.5, 1, 0.5, 1.5, 3]
