minutes: 90
prereqs: [T-020, K-020, C-003]
composition:
  key: C major
  meter: 4/4
  bars: 12
  range: [C4, E5]
  chords: [I7, IV7, I7, I7, IV7, IV7, I7, I7, V7, IV7, I7, I7]
