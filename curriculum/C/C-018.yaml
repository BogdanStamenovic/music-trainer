      - {en: "The riff transposed up a 4th to follow the chord", sr: "Rif transponovan za kvartu naviše da prati akord"}
      - {en: "Silence: the singer rests through the IV chord", sr: "Tišina: pevač pauzira kroz akord IV"}
    answer: 0
  - id: C-018-4
