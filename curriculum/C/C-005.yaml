    prompt: {en: "What changed from bar 1 to bar 3?", sr: "Šta se promenilo od takta 1 do takta 3?"}
    options:
      - {en: "the rhythm: every value is halved (diminution)", sr: "ritam: svako trajanje je prepolovljeno (diminucija)"}
      - {en: "the pitches: it is a sequence", sr: "tonovi: to je sekvenca"}
      - {en: "the rhythm: it is dotted", sr: "ritam: punktiran je"}
