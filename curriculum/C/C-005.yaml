  - id: C-005-1
    type: mcq
    abc: "X:1\nM:4/4\nL:1/8\nK:G\nG2 A2 B4 | G3 A B4 | G A B2 z4 | G4 A4 | B8 |]"
    prompt: {en: "Where is the motif (bar 1) in augmentation?", sr: "Gde je motiv (takt 1) u augmentaciji?"}
    options:
      - {en: "bar 2", sr: "takt 2"}
      - {en: "bar 3", sr: "takt 3"}
      - {en: "bars 4–5", sr: "taktovi 4–5"}
      - {en: "nowhere", sr: "nigde"}
    answer: 2
  - id: C-005-2
