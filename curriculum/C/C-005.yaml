id: C-005
track: C
order: 5
prereqs: [C-004]
title: {en: "Rhythmic variation of a motif", sr: "Ritmička varijacija motiva"}
minutes: 14
tags: [composition, melody, rhythm]
explain:
  en: |
    A motif is pitches *and* rhythm. Change only the pitches and you get a sequence (C-002).
    Change only the **rhythm** and keep the pitches, and you get a variation that the ear still
    links to the original, because the notes are the same, while it sounds fresh.

    The standard moves, on the motif G–A–B in G major (quarter, quarter, half):

    ```abc
    X:1
    M:4/4
    L:1/8
    K:G
    "^motif"G2 A2 B4 | "^dotted"G3 A B4 | "^diminution"G A B2 z4 | "^syncopated"z G2 A2 B3 | "^augmentation"G4 A4 | B8 |]
    ```

    | move | what changes | effect |
    |---|---|---|
    | **dotting** | even notes become long–short | more swing, more push |
    | **diminution** | all values halved | faster, urgent, often used near a climax |
    | **augmentation** | all values doubled | broad, solemn, good for an ending |
    | **displacement / syncopation** | the motif starts off the beat | surprise; the accent moves |
    | **splitting / joining** | one long note becomes two short repeated ones, or the reverse | fits new words, adds energy |

    **Why it works.** The ear tracks pitch shape and rhythm separately. Keep one and change the
    other, and the listener gets "same but different", which is exactly what a melody needs to hold
    attention for 8 bars. Change both at once and it is a new idea.

    **Combine with what you know.** A sequence *with* a rhythmic change (motif in bar 1, the same
    shape a step higher and dotted in bar 2) is how real melodies move forward.

    **At the keyboard:** play G–A–B five times in a row, each time with a different rhythm from the
    table, without stopping. Then do it with your own motif.
  sr: |
    Motiv čine tonovi *i* ritam. Promeni samo tonove i dobiješ sekvencu (C-002).
    Promeni samo **ritam**, a tonove zadrži, i dobiješ varijaciju koju uho i dalje vezuje za original,
    jer su tonovi isti, a zvuči sveže.

    Standardni postupci, na motivu G–A–H u G-duru (četvrtina, četvrtina, polovina):

    ```abc
    X:1
    M:4/4
    L:1/8
    K:G
    "^motiv"G2 A2 B4 | "^tačkasti ritam"G3 A B4 | "^diminucija"G A B2 z4 | "^sinkopa"z G2 A2 B3 | "^augmentacija"G4 A4 | B8 |]
    ```

    | postupak | šta se menja | efekat |
    |---|---|---|
    | **punktiranje (tačkasti ritam)** | jednake note postaju dugo–kratko | više zamaha, više potiska |
    | **diminucija** | sva trajanja prepolovljena | brže, hitnije, često pred kulminacijom |
    | **augmentacija** | sva trajanja udvostručena | široko, svečano, dobro za završetak |
    | **pomeranje / sinkopa** | motiv počinje van dobe | iznenađenje; akcenat se pomera |
    | **deljenje / spajanje** | jedan dug ton postaje dva kratka ponovljena, ili obrnuto | odgovara novim rečima, dodaje energiju |

    **Zašto to radi.** Uho prati oblik tonova i ritam odvojeno. Zadrži jedno, promeni drugo, i
    slušalac dobija „isto, a drugačije", što je baš ono što melodiji treba da zadrži pažnju 8 taktova.
    Promeni oba odjednom i to je nova ideja.

    **Kombinuj sa onim što znaš.** Sekvenca *sa* ritmičkom promenom (motiv u taktu 1, isti oblik
    stupanj više i punktiran u taktu 2) je način na koji prave melodije idu napred.

    **Za klavirom:** odsviraj G–A–H pet puta zaredom, svaki put drugim ritmom iz tabele, bez
    zaustavljanja. Onda isto sa svojim motivom.
