    prompt: {en: "A minor, i – iv – V – i. Which notes make the V chord?", sr: "a-mol, i – iv – V – i. Koji tonovi čine akord V?"}
    options:
      - {en: "E G♯ B", sr: "E Gis H"}
      - {en: "E G B", sr: "E G H"}
      - {en: "D F A", sr: "D F A"}
      - {en: "G B D", sr: "G H D"}
    answer: 0
    checks:
      - roman: {key: A, type: harmonic-minor, degree: 5, is: "V"}
      - chord: {notes: [E4, "G#4", B4], root: E, quality: maj}
      - chord: {notes: [D4, F4, A4], root: D, quality: min}
