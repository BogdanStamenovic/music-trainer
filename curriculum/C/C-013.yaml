id: C-013
track: C
order: 13
prereqs: [C-012, C-010]
title: {en: "A melody in minor over i–iv–V", sr: "Melodija u molu nad i–iv–V"}
minutes: 15
tags: [composition, melody, minor, harmony]
explain:
  en: |
    C-010 gave you the minor scale with its leading tone. Now the melody gets a chord under it.
    In minor the three main chords are:

    | numeral | A minor | D minor | what it adds |
    |---|---|---|---|
    | **i** | A C E | D F A | home |
    | **iv** | D F A | G B♭ D | the **6th degree** (F, B♭): dark, heavy |
    | **V** | E G♯ B | A C♯ E | the **leading tone** (G♯, C♯): pull to the tonic |

    **Rule of thumb: chord tones on the strong beats** (1 and 3 in 4/4), anything stepwise in
    between. The listener hears the harmony through the notes that land on the beat.

    **The danger spot is the change iv → V.** The 6th degree belongs to iv, the raised 7th to V,
    and they are an augmented 2nd apart (F → G♯). A melody that jumps from the top of iv straight
    to the leading tone stumbles exactly at the chord change. Better moves:

    - **6 → 5**: F → E. The 6th sinks a half step into the 5th of V. This "sigh" is the most
      typical minor-key gesture there is.
    - **1 → 7** or **3 → 2**: A → G♯, C → B. A step into a chord tone of V.
    - Let V carry the leading tone in a later beat, after a chord tone.

    ```abc
    X:1
    M:4/4
    L:1/8
    K:Am
    "^i"A2 B2 c2 e2 | "^iv"f2 e2 d2 c2 | "^V"B2 ^G2 E2 ^G2 | "^i"A8 |]
    ```

    Beats 1 and 3: A, c (i), f, d (iv), B, E (V), A. In between: passing notes (B in bar 1,
    e and c in bar 2) or other chord tones (e in bar 1, G♯ in bar 3). Bar 2 → 3 goes c → B: no augmented 2nd at the chord change.

    **Why V and not v:** a minor v (E G B) has no leading tone, so the final i does not sound
    like an arrival. In a minor melody, V is where G♯ belongs; elsewhere the natural G is
    usually smoother (C-010).

    **At the keyboard:** left hand i – iv – V – i in A minor, one chord per bar. Right hand:
    improvise, but play only chord tones on beats 1 and 3. Then the same in D minor.
  sr: |
    U C-010 si dobio molsku lestvicu sa vođicom. Sada melodija dobija akord ispod sebe. U molu
    su tri glavna akorda:

    | stupanj | a-mol | d-mol | šta donosi |
    |---|---|---|---|
    | **i** | A C E | D F A | kuća |
    | **iv** | D F A | G B D | **šesti stupanj** (F, B): tamno, teško |
    | **V** | E Gis H | A Cis E | **vođicu** (Gis, Cis): vuče ka tonici |

    **Pravilo: akordski tonovi na jakim dobama** (1 i 3 u 4/4), između njih bilo šta postupno.
    Slušalac čuje harmoniju kroz tonove koji padaju na dobu.

    **Opasno mesto je promena iv → V.** Šesti stupanj pripada iv, povišeni sedmi pripada V, a
    između njih je prekomerna sekunda (F → Gis). Melodija koja sa vrha iv skoči pravo na vođicu
    posrne baš na promeni akorda. Bolji potezi:

    - **6 → 5**: F → E. Šesti stupanj tone za polustepen na kvintu akorda V. Ovaj „uzdah“ je
      najtipičniji molski gest koji postoji.
    - **1 → 7** ili **3 → 2**: A → Gis, C → H. Korak na akordski ton dominante.
    - Neka V donese vođicu na kasnijoj dobi, posle akordskog tona.

    ```abc
    X:1
    M:4/4
    L:1/8
    K:Am
    "^i"A2 B2 c2 e2 | "^iv"f2 e2 d2 c2 | "^V"B2 ^G2 E2 ^G2 | "^i"A8 |]
    ```

    Dobe 1 i 3: A, c (i), f, d (iv), H, E (V), A. Između njih: prolaznice (H u taktu 1, e i c
    u taktu 2) ili drugi akordski tonovi (e u taktu 1, Gis u taktu 3). Prelaz iz
    takta 2 u takt 3 ide c → H: nema prekomerne sekunde na promeni akorda.

    **Zašto V, a ne v:** molski v (E G H) nema vođicu, pa završno i ne zvuči kao dolazak. U
    molskoj melodiji Gis pripada akordu V; drugde je prirodno G obično glatkije (C-010).

    **Za klavirom:** leva ruka i – iv – V – i u a-molu, jedan akord po taktu. Desna ruka
    improvizuje, ali na 1. i 3. dobi svira samo akordske tonove. Zatim isto u d-molu.
