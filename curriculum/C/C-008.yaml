      sr: "F-dur (B). Napiši bas (V:2) ispod ove melodije, dve polovine po taktu, uglavnom suprotnim kretanjem. Počni na F, završi na F ispod G → F, izbegni paralelne kvinte i oktave. Obrtaji su dobrodošli (na primer B-dur akord sa D u basu)."
    given: "X:1\nM:4/4\nL:1/8\nK:F\nV:1\nA4 B4 | c4 A4 | B4 G4 | F8 |]\nV:2 clef=bass\n"
    key: F major
