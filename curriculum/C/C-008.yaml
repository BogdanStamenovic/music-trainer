id: C-008
track: C
order: 8
prereqs: [C-007, T-034]
title: {en: "A bass line under a melody (contrary motion)", sr: "Basova linija ispod melodije (suprotno kretanje)"}
minutes: 15
tags: [composition, harmony, bass, voice-leading]
explain:
  en: |
    In C-007 the bass played only roots, one per bar. A real bass line is a **second melody**:
    with the top line it forms the **outer voices**, the two lines the ear follows most closely.
    How the two move against each other matters as much as which chords they spell.

    | motion | melody | bass | effect |
    |---|---|---|---|
    | **contrary** | up | down (or the reverse) | the two lines stay independent: the best default |
    | **oblique** | moves | holds (or the reverse) | calm, always safe |
    | **similar** | up | up, by a different interval | fine, used sparingly |
    | **parallel** | up | up, by the same interval | fine in 3rds, 6ths and 10ths; **never** in perfect 5ths or octaves |

    **Why no parallel 5ths and octaves?** A perfect 5th or octave blends so well that two voices
    moving in parallel 5ths or octaves fuse into one thickened line: you lose a voice. In 3rds and
    6ths the voices still sound like two.

    **Three habits that make a good bass:**

    1. **Contrary motion first.** When the melody rises, let the bass fall, and the reverse.
    2. **3rds, 6ths and 10ths on the strong beats**, octaves and 5ths mainly at the start and the
       end. (A 4th against the bass sounds unstable: keep it to weak beats.)
    3. **Use inversions to get steps.** The bass does not have to play roots: a first-inversion
       chord (I6, V6) puts the 3rd in the bass and turns leaps into steps. End with **5 → 1** in the
       bass under **2 → 1** or **7 → 1** in the melody.

    ```abc
    X:1
    M:4/4
    L:1/8
    K:C
    V:1
    G2 F2 E2 G2 | A2 G2 F2 A2 | G2 F2 D2 B,2 | C8 |]
    V:2 clef=bass
    "I"C,8 | "IV"F,,4 "ii"D,4 | "V6"B,,4 "V"G,,4 | "I"C,8 |]
    ```

    Bar 1 → 2: melody up (G → A), bass down (C → F): contrary. In bar 2 the melody falls to F
    while the bass climbs to D: contrary again, a 10th. Bar 3 starts on **V6** (B in the bass, a
    6th under G) and then moves to the root G, so the phrase ends 5 → 1 in the bass under 7 → 1 in
    the melody. Count the intervals on beats 1 and 3: 5th, 3rd, 3rd, 3rd, 6th, 5th, octave. Never
    the same perfect interval twice in a row.

    **At the keyboard:** play the melody in the right hand and only the bass in the left. Then try
    the bad version: copy the melody an octave or two lower in the left hand. That is parallel
    octaves for the whole phrase: one line, not two.
  sr: |
    U C-007 bas je svirao samo osnovne tonove, jedan po taktu. Prava basova linija je **druga
    melodija**: sa gornjom linijom čini **spoljne glasove**, dve linije koje uho najpažljivije
    prati. Kako se kreću jedna prema drugoj važno je koliko i koje akorde ispisuju.

    | kretanje | melodija | bas | efekat |
    |---|---|---|---|
    | **suprotno** | gore | dole (ili obrnuto) | linije ostaju samostalne: najbolji izbor |
    | **pobočno** | kreće se | stoji (ili obrnuto) | mirno, uvek bezbedno |
    | **istosmerno** | gore | gore, za drugi interval | u redu, umereno |
    | **paralelno** | gore | gore, za isti interval | u redu u tercama, sekstama i decimama; **nikad** u čistim kvintama ili oktavama |

    **Zašto nema paralelnih kvinti i oktava?** Čista kvinta ili oktava se toliko dobro stapa da se
    dva glasa koja idu u paralelnim kvintama ili oktavama spajaju u jednu zadebljanu liniju:
    gubiš glas. U tercama i sekstama glasovi i dalje zvuče kao dva.

    **Tri navike za dobar bas:**

    1. **Prvo suprotno kretanje.** Kad melodija ide gore, neka bas ide dole, i obrnuto.
    2. **Terce, sekste i decime na jakim dobama**, oktave i kvinte uglavnom na početku i na kraju.
       (Kvarta prema basu zvuči nestabilno: drži je na slabim dobama.)
    3. **Obrtaji daju korake.** Bas ne mora da svira osnovne tonove: sekstakord (I6, V6) stavlja
       tercu u bas i pretvara skokove u korake. Završi sa **5 → 1** u basu ispod **2 → 1** ili
       **7 → 1** u melodiji.

    ```abc
    X:1
    M:4/4
    L:1/8
    K:C
    V:1
    G2 F2 E2 G2 | A2 G2 F2 A2 | G2 F2 D2 B,2 | C8 |]
    V:2 clef=bass
    "I"C,8 | "IV"F,,4 "ii"D,4 | "V6"B,,4 "V"G,,4 | "I"C,8 |]
    ```

    Takt 1 → 2: melodija gore (G → A), bas dole (C → F): suprotno. U taktu 2 melodija pada na F
    dok se bas penje na D: opet suprotno, decima. Takt 3 počinje sa **V6** (H u basu, sekstu
    ispod G), pa prelazi na osnovni ton G, tako da se fraza završava sa 5 → 1 u basu ispod 7 → 1 u
    melodiji. Prebroj intervale na prvoj i trećoj dobi: kvinta, terca, terca, terca, seksta, kvinta,
    oktava. Nikad isti čist interval dvaput zaredom.

    **Za klavirom:** sviraj melodiju desnom rukom, a levom samo bas. Onda probaj lošu verziju:
    prepiši melodiju oktavu ili dve niže u levoj ruci. To su paralelne oktave kroz celu frazu:
    jedna linija, ne dve.
