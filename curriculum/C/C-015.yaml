id: C-015
track: C
order: 15
prereqs: [C-014, T-044]
title: {en: "Writing over a given progression with a secondary dominant", sr: "Pisanje nad zadatim nizom sa sporednom dominantom"}
minutes: 15
tags: [composition, melody, harmony, secondary-dominant]
explain:
  en: |
    A secondary dominant (T-043, T-044) borrows the dominant of another chord: in C major,
    **V7/V** is D7 (D F♯ A C) and leads to G; **V7/vi** is E7 (E G♯ B D) and leads to Am. Each
    brings **one chromatic note**, and that note is the leading tone of its target.

    | in C | chord | chromatic note | goes to | target |
    |---|---|---|---|---|
    | V7/V | D7 | F♯ | G | V (G) |
    | V7/vi | E7 | G♯ | A | vi (Am) |
    | V7/ii | A7 | C♯ | D | ii (Dm) |

    When the progression is **given** (a co-writer's chords, a lead sheet), the melody has two
    jobs over the secondary dominant:

    1. **Do not fight it.** The natural version of the chromatic note (F over D7, G over E7) on
       a strong beat is a clash a half step wide. Over D7, use D, F♯, A, C.
    2. **Use it.** The chromatic note is the most colourful note in the bar. Putting it in the
       melody and letting it rise a half step into the next chord makes the melody **lead** the
       harmony instead of just sitting on it.

    ```abc
    X:1
    M:4/4
    L:1/4
    K:C
    "^C"c B G E | "^E7"B d B ^G | "^Am"A c e c | "^D7"d c A ^F | "^G7"G B d B | "^C"c4 |]
    ```

    G♯ ends bar 2 and rises to A on the downbeat of Am; F♯ ends bar 4 and rises to G. The
    chromatic note sits **just before** its resolution, where the ear expects the step.

    It is fine if the melody holds a common tone over the secondary dominant instead (A or C
    over D7) and leaves F♯ to the accompaniment. What is not fine is F natural.

    **About the grading:** in these exercises the "all notes in the key" check is off, because
    the chromatic note is the point. The bass is given, and the parallels check still runs.

    **At the keyboard:** play C – E7 – Am – D7 – G7 – C with the left hand. With the right,
    find the chromatic note in each secondary dominant and play it into its resolution.
  sr: |
    Sporedna dominanta (T-043, T-044) pozajmljuje dominantu nekog drugog akorda: u C-duru je
    **V7/V** D7 (D Fis A C) i vodi u G; **V7/vi** je E7 (E Gis H D) i vodi u a-mol. Svaka donosi
    **jedan hromatski ton**, i taj ton je vođica akorda u koji ide.

    | u C | akord | hromatski ton | ide na | cilj |
    |---|---|---|---|---|
    | V7/V | D7 | Fis | G | V (G) |
    | V7/vi | E7 | Gis | A | vi (a-mol) |
    | V7/ii | A7 | Cis | D | ii (d-mol) |

    Kad je niz akorda **zadat** (akordi koautora, lead sheet), melodija nad sekundarnom
    dominantom ima dva zadatka:

    1. **Ne svađaj se sa njom.** Prirodna verzija hromatskog tona (F nad D7, G nad E7) na jakoj
       dobi je sudar širok polustepen. Nad D7 koristi D, Fis, A, C.
    2. **Iskoristi je.** Hromatski ton je najživopisniji ton u taktu. Kad ga staviš u melodiju i
       pustiš da se popne za polustepen u sledeći akord, melodija **vodi** harmoniju, a ne samo
       sedi na njoj.

    ```abc
    X:1
    M:4/4
    L:1/4
    K:C
    "^C"c B G E | "^E7"B d B ^G | "^a-mol"A c e c | "^D7"d c A ^F | "^G7"G B d B | "^C"c4 |]
    ```

    Gis završava takt 2 i penje se na A na prvoj dobi a-mola; Fis završava takt 4 i penje se na
    G. Hromatski ton stoji **neposredno pre** razrešenja, gde uho očekuje korak.

    U redu je i da melodija nad sporednom dominantom zadrži zajednički ton (A ili C nad D7), a
    Fis prepusti pratnji. Nije u redu F.

    **O ocenjivanju:** u ovim vežbama je provera „svi tonovi u tonalitetu“ isključena, jer je
    hromatski ton poenta. Bas je zadat, a provera paralela i dalje radi.

    **Za klavirom:** levom rukom sviraj C – E7 – a-mol – D7 – G7 – C. Desnom pronađi hromatski
    ton u svakoj sporednoj dominanti i odsviraj ga u njegovo razrešenje.
