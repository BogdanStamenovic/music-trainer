id: C-004
track: C
order: 4
prereqs: [C-003, T-014]
title: {en: "A melody over I–IV–V–I", sr: "Melodija nad I–IV–V–I"}
minutes: 15
tags: [composition, melody, harmony]
explain:
  en: |
    So far the melody came first. Now turn it around: take a chord progression and write a line
    that **fits** it. One chord per bar, **I – IV – V – I** in C major:

    | bar | chord | chord tones |
    |---|---|---|
    | 1 | I | C E G |
    | 2 | IV | F A C |
    | 3 | V | G B D |
    | 4 | I | C E G |

    **Chord tones on the strong beats.** In 4/4, beats 1 and 3 are strong. Put a note of the bar's
    chord there and the melody and the harmony agree where the ear checks hardest.

    **Steps in between.** On the weak beats and eighths, connect the chord tones by step. A note
    that is not in the chord but sits between two chord tones (E–**D**–C over I) is a *passing tone*;
    one that steps away and back (C–**D**–C) is a *neighbour tone*. They give the line motion without
    clashing, because they are short and they go somewhere.

    **Move by the nearest chord tone when the chord changes.** From G over I, the closest note of IV is
    A (a step) or F: no need to jump to the root. Melodies that follow the nearest chord tones are
    smooth and singable, and they avoid parallel 5ths and octaves with the bass.

    **The ending.** Bar 3 (V) gives you 2 (D) and 7 (B); bar 4 (I) lands on 1. That is a full
    authentic cadence, in the melody *and* the harmony.

    ```abc
    X:1
    M:4/4
    L:1/8
    K:C
    V:1
    "I"E2 D2 C2 G2 | "IV"A2 G2 F2 A2 | "V"B2 A2 G2 D2 | "I"C8 |]
    V:2 clef=bass
    C,8 | F,,8 | G,,8 | C,8 |]
    ```

    Check it: beats 1 and 3 are E C, A F, B G, C: all chord tones. D (bar 1) and G (bar 2) are passing
    tones. **At the keyboard:** hold the chords in the left hand and improvise the right hand with only
    chord tones on beats 1 and 3, anything stepwise in between. Do that for a minute before you write.

    The rule checker does not know which chords you imagine (it checks key, range, leaps, the ending
    and, with two voices, parallels), so listening against the chords is your job. To type two voices
    instead of recording them, write them as in the example: a `V:1` line for the melody, a `V:2` line
    for the bass (`F,,` is F2, two octaves below the `F` above middle C).
  sr: |
    Do sada je melodija bila prva. Sada obrnuto: uzmi niz akorada i napiši liniju koja mu
    **odgovara**. Jedan akord po taktu, **I – IV – V – I** u C-duru:

    | takt | akord | tonovi akorda |
    |---|---|---|
    | 1 | I | C E G |
    | 2 | IV | F A C |
    | 3 | V | G H D |
    | 4 | I | C E G |

    **Tonovi akorda na jakim dobama.** U 4/4 jake su prva i treća doba. Stavi tu ton akorda tog takta,
    i melodija i harmonija se slažu tamo gde uho najstrože proverava.

    **Koraci između.** Na slabim dobama i osminama poveži tonove akorda postupno. Ton koji nije u
    akordu, a stoji između dva tona akorda (E–**D**–C nad I), je *prolaznica*; ton koji odstupi
    korakom i vrati se (C–**D**–C) je *skretnica (pomoćni ton)*. Daju liniji kretanje bez sudara,
    jer su kratki i nekud idu.

    **Kad se akord promeni, idi na najbliži ton akorda.** Sa G nad I najbliži ton IV je A (korak)
    ili F: nema potrebe skakati na osnovni ton. Melodije koje prate najbliže tonove akorda su glatke
    i pevljive, i izbegavaju paralelne kvinte i oktave sa basom.

    **Završetak.** Takt 3 (V) ti daje 2 (D) i 7 (H); takt 4 (I) se spušta na 1. To je potpuna
    autentična kadenca, i u melodiji *i* u harmoniji.

    ```abc
    X:1
    M:4/4
    L:1/8
    K:C
    V:1
    "I"E2 D2 C2 G2 | "IV"A2 G2 F2 A2 | "V"B2 A2 G2 D2 | "I"C8 |]
    V:2 clef=bass
    C,8 | F,,8 | G,,8 | C,8 |]
    ```

    Proveri: na prvoj i trećoj dobi su E C, A F, H G, C: sve tonovi akorda. D (takt 1) i G (takt 2) su
    prolaznice. **Za klavirom:** drži akorde u levoj ruci i improvizuj desnom samo tonovima akorda
    na prvoj i trećoj dobi, a između bilo šta postupno. Radi to minut pre nego što počneš da pišeš.

    Provera pravila ne zna koje akorde zamišljaš (proverava tonalitet, opseg, skokove, završetak
    i, sa dva glasa, paralele), pa je slušanje uz akorde tvoj posao. Ako dva glasa kucaš umesto da ih
    snimiš, piši ih kao u primeru: red `V:1` za melodiju, red `V:2` za bas (`F,,` je F2, dve oktave ispod
    `F` iznad srednjeg C).
