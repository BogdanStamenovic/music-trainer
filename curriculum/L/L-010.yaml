  - id: L-010-2
    type: mcq
    prompt: {en: "Which line shows sevdah through an image instead of naming it?", sr: "Koji stih pokazuje sevdah kroz sliku umesto da ga imenuje?"}
    options:
      - "Ostavih ti đul na pendžeru"
      - "Tužan sam bez tebe, mila"
      - "Ljubav boli, srce pati"
      - "Ne mogu da živim više"
    answer: 0
  - id: L-010-3
    type: mcq
    prompt: {en: "Why should each half of an osmerac line make sense on its own?", sr: "Zašto svaka polovina osmerca treba da ima smisla sama za sebe?"}
    options:
      - {en: "Singers repeat half-lines and breathe at the cesura", sr: "Pevači ponavljaju polustihove i dišu na cezuri"}
      - {en: "Each half must rhyme with the other half", sr: "Svaka polovina mora da se rimuje sa drugom"}
      - {en: "The second half is always spoken, not sung", sr: "Druga polovina se uvek govori, ne peva"}
      - {en: "It does not matter: the cesura is only for poets", sr: "Nije bitno: cezura je samo za pesnike"}
    answer: 0
    checks:
      - chord: {notes: [D4, F4, A4], root: D, quality: min}
      - chord: {notes: [G3, Bb3, D4], root: G, quality: min}
      - chord: {notes: [A3, C#4, E4], root: A, quality: maj}
      - roman: {key: D, type: harmonic-minor, degree: 1, is: "i"}
      - roman: {key: D, type: harmonic-minor, degree: 4, is: "iv"}
      - roman: {key: D, type: harmonic-minor, degree: 5, is: "V"}
  - id: L-010-4
    type: mcq
    prompt: {en: "Which set of images belongs to the traditional world of starogradska and sevdalinka?", sr: "Koji skup slika pripada tradicionalnom svetu starogradske i sevdalinke?"}
    options:
      - {en: "avlija, pendžer, đul, fenjer", sr: "avlija, pendžer, đul, fenjer"}
      - {en: "metro, screen, message, neon", sr: "metro, ekran, poruka, neon"}
      - {en: "battle, sword, horse, tsar", sr: "boj, sablja, konj, car"}
      - {en: "highway, motel, pickup truck, whiskey", sr: "autoput, motel, pikap, viski"}
    answer: 0
  - id: L-010-5
    type: mcq
    prompt: {en: "Šantić's “Sinoć, kad se vratih iz topla hamama” (Emina, 1902): how many syllables, and so which line type?", sr: "Šantićev stih „Sinoć, kad se vratih iz topla hamama” (Emina, 1902): koliko slogova, pa koja je to vrsta stiha?"}
    options:
      - {en: "8: osmerac", sr: "8: osmerac"}
      - {en: "10: deseterac", sr: "10: deseterac"}
      - {en: "12: dvanaesterac (6 + 6)", sr: "12: dvanaesterac (6 + 6)"}
      - {en: "14: four-beat long line", sr: "14: dugi stih sa četiri naglaska"}
    answer: 2
    keepOrder: true
    checks:
      - syllables: {text: "Sinoć, kad se vratih iz topla hamama", lang: sr, is: 12}
      - syllables: {text: "Sinoć, kad se vratih", lang: sr, is: 6}
      - syllables: {text: "prođoh pokraj bašte staroga imama", lang: sr, is: 12}
      - syllables: {text: "prođoh pokraj bašte", lang: sr, is: 6}
  - id: L-010-6
    type: write
    prompt:
      en: "Starogradska or sevdalinka, in Serbian: write one 4-line stanza in osmerac (cesura after the 4th syllable), rhymed aabb or abab, built around one central object (a window, a gate, a rose, a lantern...). The words tuga, bol and srce are not allowed. Mark the cesura with | and count each line."
      sr: "Starogradska ili sevdalinka, na srpskom: napiši jednu strofu od 4 stiha u osmercu (cezura posle 4. sloga), sa rimom aabb ili abab, izgrađenu oko jednog središnjeg predmeta (pendžer, kapija, ruža, fenjer...). Reči tuga, bol i srce nisu dozvoljene. Cezuru obeleži sa | i prebroj svaki stih."
    language: sr
    lines: [4, 4]
    rubric:
      - id: meter
        label: {en: "Osmerac 4 + 4", sr: "Osmerac 4 + 4"}
        top: {en: "Every line has exactly 8 syllables, a word ends after syllable 4, and each half-line makes sense if repeated alone.", sr: "Svaki stih ima tačno 8 slogova, reč se završava posle 4. sloga, i svaki polustih ima smisla ako se ponovi sam."}
      - id: image
        label: {en: "The image carries the feeling", sr: "Slika nosi osećanje"}
        top: {en: "One object stands at the centre and its state (closed, wilting, burning out) shows the emotion; no line names the emotion.", sr: "Jedan predmet je u središtu, a njegovo stanje (zatvoren, vene, dogoreva) pokazuje osećanje; nijedan stih ne imenuje osećanje."}
      - id: rhyme
        label: {en: "Rhyme and sound", sr: "Rima i zvuk"}
        top: {en: "The rhyme scheme holds with feminine rhymes (two syllables match); open vowels sit on the stressed syllables 3 and 7 where possible.", sr: "Shema rime je održana ženskim rimama (poklapaju se dva sloga); otvoreni samoglasnici su na naglašenim slogovima 3 i 7 gde god je moguće."}
