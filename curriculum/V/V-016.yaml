id: V-016
track: V
order: 16
title: {en: "Crossing the break: lip trills and sirens through the passaggio", sr: "Prelaz preko loma: treperenje usnama i sirene kroz passaggio"}
prereqs: [V-015]
minutes: 10
tags: [voice, register]
explain:
  en: |
    The **passaggio** (Italian for "passage"; Serbian: *prelaz*) is the zone where the chest feel hands over to the head feel. In an untrained voice
    the handover is often sudden: the **break** or crack.

    Why it cracks: one set of muscles makes the vocal folds shorter and thicker (the heavy, chest-like setting), another stretches them longer and thinner
    (the light, head-like setting). Going up, the light setting has to take over gradually. If you keep the heavy setting too long, usually by getting louder,
    it gives way all at once: crack.

    So the rule is: **approaching the break, get lighter, not louder.** Let the sound thin out a little before you reach it.

    The tools are **semi-occluded** sounds: a **lip trill**, "ng", "oo", a hum. Partly closing the lips or the mouth creates a small back-pressure of air
    that helps the folds stay balanced and takes load off the throat. That is why singing teachers use them for exactly this job.

    - A slide where the break is still audible is fine. A smooth slide with a small "bump" is progress.
    - The break moves a little from day to day; do not hunt for it.
    - Do not practise cracking on purpose. Let it happen, go lighter, carry on.

    The app checks the pitch where each slide lands; the smoothness is for you to judge.

    **Stop if anything hurts, scratches or you get hoarse.**
  sr: |
    **Passaggio** (ital. „prolaz”; srp. **prelaz**) je zona u kojoj grudni osećaj predaje mesto glavnom. Kod neškolovanog glasa
    ta predaja je često nagla: **lom** ili pucanje.

    Zašto puca: jedna grupa mišića čini glasnice kraćim i debljim (teže, grudno podešavanje), druga ih isteže, pa su duže i tanje
    (lako, glavno podešavanje). Naviše, lako podešavanje treba postepeno da preuzme. Ako predugo zadržiš teško podešavanje, obično pojačavanjem,
    ono popusti odjednom: pucanje.

    Zato je pravilo: **kad se približavaš lomu, idi lakše, ne glasnije.** Pusti da se zvuk malo istanji pre nego što stigneš do njega.

    Alati su **poluzatvoreni** zvuci (engl. *semi-occluded*): **treperenje usnama**, „ng”, „u”, pevušenje. Delimično zatvorene usne stvaraju mali povratni pritisak vazduha
    koji pomaže glasnicama da ostanu u ravnoteži i rasterećuje grlo. Zato ih pedagozi pevanja koriste baš za ovaj posao.

    - Klizanje na kome se lom još čuje je u redu. Glatko klizanje sa malom „grbom” je napredak.
    - Lom se malo pomera iz dana u dan; ne juri ga.
    - Ne vežbaj pucanje namerno. Pusti da se desi, idi lakše, nastavi.

    Aplikacija proverava visinu na kojoj se svako klizanje završava; glatkoću procenjuješ ti.

    **Prekini ako nešto boli, grebe ili osetiš promuklost.**
exercises:
  - id: V-016-1
    type: checkin
    prompt:
      en: "Check-in: hum softly for 10 seconds. How does your voice feel?"
      sr: "Provera: tiho pevuši 10 sekundi. Kako ti je glas?"
  - id: V-016-2
    type: practice
    minutes: 2
    prompt:
      en: "Warm-up: 4 low breaths, 3 light owl hoots sliding down, then lip trills along with the five notes up and down."
      sr: "Zagrevanje: 4 niska udaha, 3 lagana huktanja uz klizanje naniže, pa treperenje usnama uz pet tonova gore i dole."
    play: {notes: [C4, D4, E4, F4, G4, F4, E4, D4, C4], mode: melodic, tempo: 100}
    checks:
      - interval: {from: C4, to: D4, is: M2}
      - interval: {from: D4, to: E4, is: M2}
      - interval: {from: E4, to: F4, is: m2}
      - interval: {from: F4, to: G4, is: M2}
  - id: V-016-3
    type: practice
    minutes: 2
    prompt:
      en: "Lip-trill sirens: 5 slow slides from low to high and back through your comfortable range. Keep the trill going through the break; if it stops, use less air and less volume, not more."
      sr: "Sirene treperenjem usana: 5 sporih klizanja odozdo naviše i nazad kroz udoban opseg. Neka treperenje traje kroz lom; ako stane, manje vazduha i tiše, ne više."
  - id: V-016-4
    type: sing-phrase
    prompt:
      en: "Lip trill 1-5-8-5-1: slide between the notes on a lip trill (or 'oo' if the trill will not start), landing on each one. Lighter as you go up."
      sr: "Treperenje usnama 1-5-8-5-1: klizi između tonova na treperenju usana (ili na „u” ako treperenje ne kreće), sleti na svaki. Što više, to lakše."
    notes: [C4, G4, C5, G4, C4]
    beats: [1.5, 1.5, 2, 1.5, 2]
    tempo: 60
    tolerance: 75
    pass: 0.75
    checks:
      - interval: {from: C4, to: G4, is: P5}
      - interval: {from: C4, to: C5, is: P8}
  - id: V-016-5
    type: sing-phrase
    prompt:
      en: "The same 1-5-8-5-1 shape on 'goo'. The 'g' gives a clean start; let the top note float."
      sr: "Isti oblik 1-5-8-5-1 na „gu”. „G” daje čist početak; pusti gornji ton da lebdi."
    notes: [G3, D4, G4, D4, G3]
    beats: [1.5, 1.5, 2, 1.5, 2]
    tempo: 60
    tolerance: 75
    pass: 0.75
    checks:
      - interval: {from: G3, to: D4, is: P5}
      - interval: {from: G3, to: G4, is: P8}
  - id: V-016-6
    type: sing-phrase
    prompt:
      en: "Arpeggio 1-3-5-8-5-3-1 on 'ng' (as at the end of 'sing'), smooth slides, thinning out toward the top."
      sr: "Razloženi akord 1-3-5-8-5-3-1 na „ng”, glatka klizanja, sve tanje prema vrhu."
    notes: [C4, E4, G4, C5, G4, E4, C4]
    beats: [1, 1, 1, 2, 1, 1, 2]
    tempo: 60
    tolerance: 75
    pass: 0.75
    checks:
      - chord: {notes: [C4, E4, G4], root: C, quality: maj, inversion: 0}
      - interval: {from: C4, to: C5, is: P8}
  - id: V-016-7
    type: practice
    minutes: 1
    prompt:
      en: "Self-check: one slow 'oo' siren up and down. Rate: did going lighter near the break make it smoother than it was in lesson 6?"
      sr: "Samoprocena: jedna spora sirena na „u” gore i dole. Oceni: da li je laganije pevanje blizu loma učinilo prelaz glađim nego u 6. lekciji?"
