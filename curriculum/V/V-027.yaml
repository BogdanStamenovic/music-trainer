id: V-027
track: V
order: 27
title: {en: "Review: a full short song on \"la\", then with words", sr: "Ponavljanje: cela kratka pesma na „la”, pa sa rečima"}
prereqs: [V-026]
minutes: 12
tags: [voice, song, review]
explain:
  en: |
    A whole song, start to finish: **"Twinkle, Twinkle, Little Star"**. The tune is the French "Ah! vous dirai-je, maman" (18th century, the one Mozart wrote variations on);
    the English words are by Jane Taylor (1806). Both are public domain.

    ```abc
    X:1
    T:Twinkle, Twinkle, Little Star
    M:4/4
    L:1/4
    Q:1/4=112
    K:C
    C C G G | A A G2 | F F E E | D D C2 |
    G G F F | E E D2 | G G F F | E E D2 |
    C C G G | A A G2 | F F E E | D D C2 |]
    ```

    It is short (12 bars) but uses almost everything from this block:

    | skill | where |
    |---|---|
    | form | **A B A**: bars 1-4, a new 4-bar section (5-8, the same 2 bars twice), then bars 1-4 again |
    | a leap | the **perfect 5th** up at the very start (C to G): hear the G before you sing it |
    | breath | a quick, silent catch breath at the end of every half note (every 2 bars) |
    | pure vowels | hold "ah" in "st**ar**" and "**are**"; in "h**igh**" and "sk**y**" hold "ah" and add the "i" at the last moment |
    | legato | each 2-bar line connected, even volume, the top note A not louder |

    Order: each section on "la", then the whole song on "la", then the whole song **with words**:

    *Twin-kle, twin-kle, lit-tle star, how I won-der what you are. Up a-bove the world so high, like a dia-mond in the sky. Twin-kle, twin-kle, lit-tle star, how I won-der what you are.*

    One syllable per note. Sing in whatever octave is comfortable; the notes are fitted to your range.

    **Stop if anything hurts, scratches or you get hoarse.**
  sr: |
    Cela pesma, od početka do kraja: **„Twinkle, Twinkle, Little Star”**. Melodija je francuska „Ah! vous dirai-je, maman” (18. vek, ona na koju je Mocart napisao varijacije);
    engleske reči je napisala Džejn Tejlor (1806). Obe su javno dobro.

    ```abc
    X:1
    T:Twinkle, Twinkle, Little Star
    M:4/4
    L:1/4
    Q:1/4=112
    K:C
    C C G G | A A G2 | F F E E | D D C2 |
    G G F F | E E D2 | G G F F | E E D2 |
    C C G G | A A G2 | F F E E | D D C2 |]
    ```

    Kratka je (12 taktova), ali koristi skoro sve iz ovog bloka:

    | veština | gde |
    |---|---|
    | oblik | **A B A**: taktovi 1-4, novi deo od 4 takta (5-8, ista 2 takta dva puta), pa opet taktovi 1-4 |
    | skok | **čista kvinta** naviše na samom početku (od C do G): čuj G pre nego što ga otpevaš |
    | dah | brz, tih udah na kraju svake polovine (na svaka 2 takta) |
    | čisti samoglasnici | drži „a” u „st**ar**” i „**are**”; u „h**igh**” i „sk**y**” drži „a”, a „i” dodaj u poslednjem trenutku |
    | legato | svaki red od 2 takta povezan, ravnomerna jačina, gornje A ne glasnije |

    Redosled: svaki deo na „la”, pa cela pesma na „la”, pa cela pesma **sa rečima**:

    *Twin-kle, twin-kle, lit-tle star, how I won-der what you are. Up a-bove the world so high, like a dia-mond in the sky. Twin-kle, twin-kle, lit-tle star, how I won-der what you are.*

    Jedan slog po tonu. Pevaj u oktavi koja ti prija; tonovi su prilagođeni tvom opsegu.

    **Prekini ako nešto boli, grebe ili osetiš promuklost.**
