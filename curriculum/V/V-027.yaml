    minutes: 2
    prompt:
      en: "Warm-up: 4 low breaths, 3 quiet lip-trill sirens, then lip trills on 1-5-6-5 along with the piano, and 'la' along with the five notes."
      sr: "Zagrevanje: 4 niska udaha, 3 tihe sirene treperenjem usana, pa treperenje usnama na 1-5-6-5 uz klavir, i „la” uz pet tonova."
    play: {notes: [C4, G4, A4, G4, C4, D4, E4, F4, G4, F4, E4, D4, C4], mode: melodic, tempo: 100}
    checks:
