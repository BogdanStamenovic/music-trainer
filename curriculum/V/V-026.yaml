    type: checkin
    prompt:
      en: "Check-in: hum softly for 10 seconds. How does your voice feel?"
      sr: "Provera: tiho pevuši 10 sekundi. Kako ti je glas?"
  - id: V-026-2
    type: practice
    minutes: 2
    prompt:
      en: "Warm-up: 4 low breaths, 3 quiet lip-trill sirens, then 'la' along with the five notes up and down; finish with 2 rounds of quick 1-2-3-2-1 on 'ah'."
      sr: "Zagrevanje: 4 niska udaha, 3 tihe sirene treperenjem usana, pa „la” uz pet tonova gore i dole; završi sa 2 runde brzog 1-2-3-2-1 na „a”."
    play: {notes: [C4, D4, E4, F4, G4, F4, E4, D4, C4], mode: melodic, tempo: 100}
    checks:
      - interval: {from: C4, to: D4, is: M2}
      - interval: {from: D4, to: E4, is: M2}
      - interval: {from: E4, to: F4, is: m2}
      - interval: {from: F4, to: G4, is: M2}
