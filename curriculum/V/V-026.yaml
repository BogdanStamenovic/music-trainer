explain:
  en: |
    Eight bars now: **"Frère Jacques"** ("Are You Sleeping?" in English), a French traditional round (18th century, public domain).

    ```abc
    X:1
    T:Frère Jacques
    M:4/4
    L:1/8
    Q:1/4=88
    K:C
    C2 D2 E2 C2 | C2 D2 E2 C2 | E2 F2 G4 | E2 F2 G4 |
    GAGF E2 C2 | GAGF E2 C2 | C2 G,2 C4 | C2 G,2 C4 |]
    ```

    What is new compared with the Ode to Joy phrase:

    - **Eight bars** made of four 2-bar ideas, each sung twice. Spot the repeats and there is only 4 bars of melody to learn.
    - **Eighth notes** in bars 5-6 (G A G F): quick and light, like the agility lesson.
    - A **leap down a 4th** in bars 7-8 (C down to G), and a total range of a **9th** (G below middle C to the A above it).

    **Breathing**: take a quick, silent catch breath after each half note (end of bars 3, 4, 7) and at the end of bar 6 if you need one.
    Steal the time from the end of the long note, not from the next beat.

    Words, if you want them (one syllable per note): "*Frè-re Jac-ques, frè-re Jac-ques, dor-mez-vous? dor-mez-vous? Son-nez les ma-ti-nes, son-nez les ma-ti-nes, ding, dang, dong, ding, dang, dong*";
    or in English "*Are you sleep-ing, are you sleep-ing, Bro-ther John, Bro-ther John? Mor-ning bells are ring-ing, mor-ning bells are ring-ing, ding, dang, dong, ding, dang, dong*".

    Sing the rhythm as written; play it on the piano first if it helps. Sing in whatever octave is comfortable; the notes are fitted to your range.

    **Stop if anything hurts, scratches or you get hoarse.**
  sr: |
    Sada osam taktova: **„Frère Jacques”** (engl. „Are You Sleeping?”), francuski tradicionalni kanon (18. vek, javno dobro).

    ```abc
    X:1
    T:Frère Jacques
    M:4/4
    L:1/8
    Q:1/4=88
    K:C
    C2 D2 E2 C2 | C2 D2 E2 C2 | E2 F2 G4 | E2 F2 G4 |
    GAGF E2 C2 | GAGF E2 C2 | C2 G,2 C4 | C2 G,2 C4 |]
    ```

    Šta je novo u odnosu na frazu iz „Ode radosti”:

    - **Osam taktova** od četiri ideje po 2 takta, svaka otpevana dva puta. Uoči ponavljanja, pa ostaju samo 4 takta melodije za učenje.
    - **Osmine** u 5. i 6. taktu (G A G F): brzo i lagano, kao u lekciji o okretnosti.
    - **Skok za kvartu naniže** u 7. i 8. taktu (od C dole do G) i ukupan opseg od **none** (od G ispod srednjeg C do A iznad njega).

    **Disanje**: uzmi brz, tih udah posle svake polovine (kraj 3., 4. i 7. takta), a na kraju 6. takta ako ti treba.
    Vreme ukradi sa kraja dugog tona, ne sa sledeće dobe.

    Reči, ako ih želiš (jedan slog po tonu): „*Frè-re Jac-ques, frè-re Jac-ques, dor-mez-vous? dor-mez-vous? Son-nez les ma-ti-nes, son-nez les ma-ti-nes, ding, dang, dong, ding, dang, dong*”;
    ili na engleskom „*Are you sleep-ing, are you sleep-ing, Bro-ther John, Bro-ther John? Mor-ning bells are ring-ing, mor-ning bells are ring-ing, ding, dang, dong, ding, dang, dong*”.

    Pevaj ritam kako je zapisan; ako pomaže, prvo ga odsviraj na klaviru. Pevaj u oktavi koja ti prija; tonovi su prilagođeni tvom opsegu.

    **Prekini ako nešto boli, grebe ili osetiš promuklost.**
