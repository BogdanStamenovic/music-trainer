      sr: "Pri prelasku iz strofe u refren, šta treba najviše da se promeni?"
    options:
      - {en: "Colour and register: from light and close to a brighter light mix", sr: "Boja i registar: od laganog i bliskog ka svetlijem laganom miksu"}
      - {en: "Volume: the chorus should be much louder", sr: "Jačina: refren treba da bude mnogo glasniji"}
      - {en: "Nothing: both should sound exactly the same", sr: "Ništa: oba treba da zvuče potpuno isto"}
    answer: 0
  - id: V-062-8
    type: practice
    minutes: 1.5
    prompt:
      en: "Self-check: record the whole song with the piano playing D, G and A chords under it, and listen back. Rate: verse light and close, chorus brighter but not louder, a clean seam. Then 3 quiet hums sliding down."
      sr: "Samoprocena: snimi celu pesmu dok klavir svira akorde D, G i A ispod nje i preslušaj. Oceni: strofa lagana i bliska, refren svetliji ali ne glasniji, čist šav. Pa 3 tiha pevušenja uz klizanje naniže."
