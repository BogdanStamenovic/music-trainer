    type: checkin
    prompt:
      en: "Check-in: hum softly for 10 seconds. How does your voice feel?"
      sr: "Provera: tiho pevuši 10 sekundi. Kako ti je glas?"
  - id: V-004-2
    type: practice
    minutes: 2
    prompt:
      en: "Warm-up: 4 low breaths, 3 quiet lip-trill sirens, then hum along with the five notes (any octave)."
      sr: "Zagrevanje: 4 niska udaha, 3 tihe sirene treperenjem usana, pa pevuši uz pet tonova (bilo koja oktava)."
    play: {derive: {scale: {tonic: C4, type: major-pentatonic, octave: false}}, mode: melodic, tempo: 72}
  - id: V-004-3
    type: generated
    prompt: {en: "Unison: listen, hum, then sing the note on 'ah'", sr: "Unisono: slušaj, otpevuši, pa otpevaj ton na „a”"}
    count: 6
    pass: 0.6
    gen: {kind: pitch-match, range: [F3, C4], sustain: 2, tolerance: 75}
