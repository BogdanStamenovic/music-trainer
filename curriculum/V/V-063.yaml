      sr: "Zagrevanje: 4 niska udaha, 3 sirene treperenjem usana kroz lom, zadirkujuće „nej” 1-2-3-4-5-4-3-2-1, sitan kikot za tvang, jednom izgovorena lestvica jačine („Hej!” pored tebe, preko stola, preko sobe), pa izgovori tekst u ritmu."
