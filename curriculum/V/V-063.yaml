id: V-063
track: V
order: 63
title: {en: "Review: a song with one short low-intensity belted line", sr: "Ponavljanje: pesma sa jednim kratkim beltovanim redom niskog intenziteta"}
prereqs: [V-062, V-051, V-052]
minutes: 13
tags: [voice, song, review, belt]
explain:
  en: |
    The review of this block is a whole song in three colours: a **light** verse, a **light-mix** chorus, and **one short belted call** at the end, the low-intensity call
    of lessons 50-51. The song is an original written for this course, **"Come On Home"** (*Vrati se*), in C major.

    ```abc
    X:1
    T:Come On Home
    M:4/4
    L:1/4
    Q:1/4=84
    K:C
    C E G E | D2 C2 | E G A G | E F D2 |
    w: Far a-way the ri-ver runs a-long the val-ley floor,
    G A c A | G2 E2 | F A G E | D3 z | E D C2 |]
    w: ev-ery road I trav-el leads me back to you. Come on home!
    ```

    Serbian: *Re-ka te-če da-lje pre-ko po-lja do-mu svom, / sva-ki put što pre-đem vra-ća me na prag. Vra-ti se!*

    | part | bars | voice | from |
    |---|---|---|---|
    | verse | 1-4 | light, close, speech-like | 49, 62 |
    | chorus | 5-8 | light mix: brighter, a little twang, the high C no bigger than the A | 46-48, 62 |
    | the call | 9 | **belt at low intensity**: "Come on home!" falling 3-2-1 | 50-51 |

    The call is the **lowest** part of the chorus range on purpose: E-D-C sits in the **middle** of your voice, not at the top. It is three notes, and
    it resolves the song (the chorus ends open on D; the call lands on the tonic C).

    **The belt rules, unchanged:** the call only, nothing else in the song is belted; short (3 notes), mid range (no high belt), volume no more than **calling across a room**,
    a clean onset from support, no grit or distortion, and **20 seconds of quiet breathing** after every attempt that includes the call. At most 6 calls today in total.

    **If today is not a belt day** (the voice feels tired after the chorus), sing the call in **light mix**. It counts the same: the app grades
    **pitch only**, plus your self-rating. A louder call never scores higher; pushing lowers the ease rating.

    **Stop protocol.** Stop the belt work at once, and end voice work for today, at any scratch or tickle, urge to clear the throat, strain, tight neck,
    hoarseness, pain, or a voice that goes breathy or cracks afterwards. Rest, drink water, talk little. If hoarseness lasts more than two weeks, see an ENT doctor; if the voice suddenly goes or it hurts sharply during a call, see one promptly.
  sr: |
    Ponavljanje ovog bloka je cela pesma u tri boje: **lagana** strofa, refren u **laganom miksu** i **jedan kratak beltovan poziv** na kraju, poziv niskog intenziteta
    iz 50-51. lekcije. Pesma je originalna, napisana za ovaj kurs, **„Vrati se”** (engl. *Come On Home*), u C-duru.

    ```abc
    X:1
    T:Vrati se
    M:4/4
    L:1/4
    Q:1/4=84
    K:C
    C E G E | D2 C2 | E G A G | E F D2 |
    w: Re-ka te-če da-lje pre-ko po-lja do-mu svom,
    G A c A | G2 E2 | F A G E | D3 z | E D C2 |]
    w: sva-ki put što pre-đem vra-ća me na prag. Vra-ti se!
    ```

    Engleski: *Far a-way the ri-ver runs a-long the val-ley floor, / ev-ery road I trav-el leads me back to you. Come on home!*

    | deo | taktovi | glas | iz |
    |---|---|---|---|
    | strofa | 1-4 | lagan, blizak, kao govor | 49, 62 |
    | refren | 5-8 | lagani miks: svetlije, malo tvanga, visoko C ne veće od A | 46-48, 62 |
    | poziv | 9 | **belting niskog intenziteta**: „Vrati se!” naniže 3-2-1 | 50-51 |

    Poziv je namerno u **najnižem** delu opsega refrena: E-D-C leži u **sredini** tvog glasa, ne na vrhu. Ima tri tona i
    razrešava pesmu (refren se završava otvoreno na D; poziv doskače na toniku C).

    **Pravila beltinga, ista kao ranije:** beltuje se samo poziv, ništa drugo u pesmi; kratko (3 tona), srednji opseg (bez visokog beltinga), jačina najviše kao **poziv preko sobe**,
    čista ataka iz oslonca, bez hrapavosti i distorzije, i **20 sekundi tihog disanja** posle svakog pokušaja koji sadrži poziv. Danas najviše 6 poziva ukupno.

    **Ako danas nije dan za belting** (glas je umoran posle refrena), otpevaj poziv u **laganom miksu**. Računa se isto: aplikacija ocenjuje
    **samo visinu**, plus tvoju samoprocenu. Glasniji poziv nikad ne donosi veću ocenu; guranje smanjuje ocenu lakoće.

    **Protokol za prekid.** Odmah prekini belting, i završi rad sa glasom za danas, na svako grebanje ili golicanje, potrebu da pročistiš grlo, naprezanje, stegnut vrat,
    promuklost, bol, ili glas koji posle postane vazdušast ili puca. Odmori, pij vodu, malo pričaj. Ako promuklost traje duže od dve nedelje, idi kod lekara ORL; ako glas tokom poziva naglo nestane ili oštro zaboli, idi odmah.
