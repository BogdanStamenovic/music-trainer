id: V-011
track: V
order: 11
title: {en: "Pure vowels I: a e i o u (EN/SR)", sr: "Čisti samoglasnici I: a e i o u (EN/SR)"}
prereqs: [V-010]
minutes: 10
tags: [voice, vowels, diction]
explain:
  en: |
    In singing, the **vowel** (Serbian: *samoglasnik*) carries the tone; consonants only frame it. A vowel is a **shape** of the tongue, jaw and lips,
    and each shape colours the sound. If the shape wobbles during a long note, the tone wobbles too, and pitch often drifts with it.

    The five singing vowels are the five **pure vowels** of Serbian: **a, e, i, o, u**. "Pure" means the mouth does not move while the vowel lasts.

    | vowel | English example | tongue | lips and jaw |
    |---|---|---|---|
    | **a** | "f**a**ther" | low and flat, tip behind the lower teeth | jaw dropped, relaxed |
    | **e** | "b**e**d" | middle, front | a little less open than "a" |
    | **i** | "s**ee**" | high, front | lips relaxed, keep some space between the teeth |
    | **o** | "**o**h", without the "w" at the end | middle, back | rounded oval |
    | **u** | "f**oo**d" | high, back | rounded, small |

    For Serbian speakers these are already pure. English speakers tend to turn "oh" into "oh-oo" and the e vowel into "ay" (e-ee, as in *day*)
    (diphthongs, two vowels in one; they come in Pure vowels II). For now, sing the first vowel only and hold it still.

    Common problems:

    - **"i" and "u" feel tight or thin.** They are the closed vowels. Keep the jaw loose and a little space inside the mouth; do not clench to make them.
    - **The pitch moves when the vowel changes.** Open vowels often go a little flat, closed ones a little sharp. Listen for it.
    - **The jaw moves on every vowel.** Most of the change is the tongue and the lips; the jaw can stay nearly still from "e" to "i". A mirror shows it.

    The app checks the pitch; whether the vowel stayed pure is for you to listen for.

    **Stop if anything hurts, scratches or you get hoarse.**
  sr: |
    U pevanju ton nosi **samoglasnik** (engl. *vowel*); suglasnici ga samo uokviruju. Samoglasnik je **oblik** jezika, vilice i usana,
    i svaki oblik boji zvuk. Ako se oblik koleba tokom dugog tona, koleba se i ton, a često i visina.

    Pet pevačkih samoglasnika su pet **čistih samoglasnika** srpskog jezika: **a, e, i, o, u**. „Čist” znači da se usta ne pomeraju dok samoglasnik traje.

    | samoglasnik | engleski primer | jezik | usne i vilica |
    |---|---|---|---|
    | **a** | „f**a**ther” | nisko i ravno, vrh iza donjih zuba | vilica spuštena, opuštena |
    | **e** | „b**e**d” | u sredini, napred | malo manje otvoreno nego „a” |
    | **i** | „s**ee**” | visoko, napred | usne opuštene, malo prostora između zuba |
    | **o** | „**o**h”, bez „u” na kraju | u sredini, pozadi | zaobljeno, ovalno |
    | **u** | „f**oo**d” | visoko, pozadi | zaobljeno, malo |

    Za govornike srpskog ovi samoglasnici su već čisti. Govornici engleskog „o” pretvaraju u „o-u”, a „e” u „e-i”
    (diftonzi, dva samoglasnika u jednom; dolaze u lekciji Čisti samoglasnici II). Za sada pevaj samo prvi samoglasnik i drži ga mirno.

    Česti problemi:

    - **„i” i „u” su tesni ili tanki.** To su zatvoreni samoglasnici. Drži vilicu opuštenu i malo prostora u ustima; ne stiskaj da bi ih napravio.
    - **Visina se pomera kad se menja samoglasnik.** Otvoreni samoglasnici često malo padnu, zatvoreni se malo penju. Osluškuj to.
    - **Vilica se pomera na svakom samoglasniku.** Većinu promene rade jezik i usne; od „e” do „i” vilica može skoro da miruje. Ogledalo to pokazuje.

    Aplikacija proverava visinu; da li je samoglasnik ostao čist, procenjuješ ti, sluhom.

    **Prekini ako nešto boli, grebe ili osetiš promuklost.**
exercises:
  - id: V-011-1
    type: checkin
    prompt:
      en: "Check-in: hum softly for 10 seconds. How does your voice feel?"
      sr: "Provera: tiho pevuši 10 sekundi. Kako ti je glas?"
  - id: V-011-2
    type: practice
    role: warmup
    minutes: 2
    prompt:
      en: "Warm-up: 4 low breaths, 3 quiet sirens on 'ng', then hum along with the five notes up and down."
      sr: "Zagrevanje: 4 niska udaha, 3 tihe sirene na „ng”, pa pevuši uz pet tonova gore i dole."
    play: {notes: [C4, D4, E4, F4, G4, F4, E4, D4, C4], mode: melodic, tempo: 100}
    checks:
      - interval: {from: C4, to: D4, is: M2}
      - interval: {from: D4, to: E4, is: M2}
      - interval: {from: E4, to: F4, is: m2}
      - interval: {from: F4, to: G4, is: M2}
  - id: V-011-3
    type: practice
    minutes: 1.5
    prompt:
      en: "In a mirror: say 'a e i o u' in slow motion, then sing them on one easy note, 2 seconds each. Watch that the jaw stays loose and nothing moves while each vowel lasts."
      sr: "Ispred ogledala: izgovori „a e i o u” usporeno, pa ih otpevaj na jednom lakom tonu, po 2 sekunde. Pazi da vilica ostane opuštena i da se ništa ne pomera dok samoglasnik traje."
  - id: V-011-4
    type: sing-phrase
    prompt:
      en: "5-4-3-2-1 with a new vowel on each note: 'a', 'e', 'i', 'o', 'u'. Smooth, one breath, each vowel pure."
      sr: "5-4-3-2-1 sa novim samoglasnikom na svakom tonu: „a”, „e”, „i”, „o”, „u”. Povezano, jedan dah, svaki samoglasnik čist."
    notes: [G4, F4, E4, D4, C4]
    beats: [1, 1, 1, 1, 2]
    tempo: 66
    tolerance: 50
    pass: 0.65
    checks:
      - scale: {tonic: C, type: major, is: [C, D, E, F, G, A, B]}
  - id: V-011-5
    type: sing-pitch
    prompt:
      en: "Closed vowel: 'i' (as in 'see') for 3 seconds. Loose jaw, a little space between the teeth; listen that it does not creep sharp."
      sr: "Zatvoren samoglasnik: „i” 3 sekunde. Opuštena vilica, malo prostora između zuba; slušaj da se ton ne penje."
    notes: [A3]
    sustain: 3
    tolerance: 50
    pass: 0.65
  - id: V-011-6
    type: sing-pitch
    prompt:
      en: "Closed vowel: 'u' (as in 'food') for 3 seconds. Lips rounded but soft, not pursed tight."
      sr: "Zatvoren samoglasnik: „u” 3 sekunde. Usne zaobljene, ali meke, ne stisnute."
    notes: [G3]
    sustain: 3
    tolerance: 50
    pass: 0.65
  - id: V-011-7
    type: sing-phrase
    prompt:
      en: "1-3-5-3-1 (a major chord) on 'ma', 'me', 'mi', 'mo', 'mu'. The 'm' is quick; the vowel gets the time."
      sr: "1-3-5-3-1 (durski akord) na „ma”, „me”, „mi”, „mo”, „mu”. „M” je kratko; vreme dobija samoglasnik."
    notes: [C4, E4, G4, E4, C4]
    beats: [1, 1, 1, 1, 2]
    tempo: 66
    tolerance: 50
    pass: 0.65
    checks:
      - chord: {notes: [C4, E4, G4], root: C, quality: maj, inversion: 0}
