# Daily maintenance warm-up (tags: maintenance, warmup). Never planned as a focus
# lesson; the planner puts it in the maintenance block. Self-rated in M1; pitch
# matching gets graded once voice-score (M2) is wired in.
id: V-001
track: V
order: 0
title: {en: "Daily vocal warm-up", sr: "Dnevno vokalno zagrevanje"}
minutes: 4
tags: [maintenance, warmup]
explain:
  en: |
    Four minutes, every day you sing. **Stop if anything hurts, scratches or you feel hoarse**:
    rest is training too. Sit or stand tall, shoulders loose, breathe low (belly and sides move, not the shoulders).

    1. **Check-in**: hum softly. Hoarse, sore or tired? Then do only the breathing and skip voice work today.
    2. **Lip trills** (or a hum) on a 5-note scale: easy airflow, no pushing.
    3. **Sirens**: slide on "ng" or "oo" from low to high and back, light and quiet.
    4. **Pitch match**: the app plays a note; hum it, then sing it on "ah". Too high or low? Sing it an octave away.
  sr: |
    Četiri minuta, svakog dana kad pevaš. **Prekini ako nešto boli, grebe ili si promukao**:
    i odmor je trening. Sedi ili stoj uspravno, opuštena ramena, dah nisko (pomeraju se stomak i bokovi, ne ramena).

    1. **Provera**: tiho pevuši. Promuklost, bol ili umor? Onda samo vežbe disanja, bez pevanja danas.
    2. **Treperenje usnama** (ili pevušenje) na 5 tonova: lak protok vazduha, bez guranja.
    3. **Sirene**: klizi na "ng" ili "u" od dubokog do visokog i nazad, lagano i tiho.
    4. **Pogađanje tona**: aplikacija pusti ton; otpevuši ga, pa otpevaj na "a". Previsoko ili prenisko? Pevaj oktavu niže ili više.
exercises:
  - id: V-001-1
    type: practice
    prompt:
      en: "Check-in: hum softly for 10 seconds. If your voice is hoarse, sore or tired, rate 'Couldn't' and skip voice work today."
      sr: "Provera: tiho pevuši 10 sekundi. Ako je glas promukao, boli ili je umoran, oceni 'Nije išlo' i danas preskoči pevanje."
    minutes: 0.5
  - id: V-001-2
    type: practice
    prompt: {en: "Lip trills on 1-2-3-4-5-4-3-2-1 (listen, then trill along; repeat a step higher if easy).", sr: "Treperenje usnama na 1-2-3-4-5-4-3-2-1 (slušaj, pa ponovi; ako je lako, ponovi korak više)."}
    minutes: 1
    play: {notes: [C3, D3, E3, F3, G3, F3, E3, D3, C3], mode: melodic, tempo: 120}
  - id: V-001-3
    type: practice
    prompt: {en: "Sirens on 'ng' or 'oo': low to high and back, 4 times, quiet and easy.", sr: "Sirene na 'ng' ili 'u': od dubokog do visokog i nazad, 4 puta, tiho i lako."}
    minutes: 1
  - id: V-001-4
    type: practice
    prompt: {en: "Pitch match: hum each note, then sing it on 'ah' (play again as needed).", sr: "Pogađanje tona: otpevuši svaki ton, pa ga otpevaj na 'a' (pusti ponovo po potrebi)."}
    minutes: 1.5
    play: {notes: [G3, C3, E3, A3, D3], mode: melodic, tempo: 30}
