      sr: "Deo B (taktovi 9-12) na zadirkujuće „nej”, lagano: parovi osmina brzi i ravnomerni, pa pad za čistu kvintu do niskog A, lako, bez guranja."
    notes: [E4, E4, F#4, D4, E4, F#4, G4, F#4, D4, E4, F#4, G4, F#4, E4, D4, E4, A3]
