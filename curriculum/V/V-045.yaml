  - id: V-045-7
    type: practice
    minutes: 1.5
    prompt:
      en: "Optional, only if the whole song was easy: play the first line a whole step higher (in E major) and sing the A section on 'nay' there. If anything grows or tightens, go back to D. Rate where the light mix still held."
      sr: "Po želji, samo ako je cela pesma bila laka: odsviraj prvi red celi stepen više (u E-duru) i otpevaj deo A na „nej” tamo. Ako išta poraste ili se stegne, vrati se u D. Oceni gde je lagani miks još držao."
  - id: V-045-8
    type: practice
    minutes: 1.5
    prompt:
      en: "Review: record the whole song once more and listen back. Rate light mix (same size top to bottom), breath (silent, on time), the eighth notes (even), vowels (pure) and ease (no pushing). Then 3 quiet hums sliding down."
      sr: "Ponavljanje: snimi celu pesmu još jednom i preslušaj. Oceni lagani miks (ista veličina od vrha do dna), dah (tih, na vreme), osmine (ravnomerne), samoglasnike (čiste) i lakoću (bez guranja). Pa 3 tiha pevušenja uz klizanje naniže."
