[project]
name = "mtworker"
version = "0.1.0"
description = "Deterministic music21 rule checks for music-trainer composition projects"
requires-python = ">=3.12"
dependencies = ["music21>=9.1"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtworker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
